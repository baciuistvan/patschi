<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webhook & Email Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    <!-- SMTP Configuration Check -->
    <div class="bg-white rounded-lg shadow-lg p-8">
      <h1 class="text-2xl font-bold mb-6">Email & Webhook Configuration</h1>

      <button
        onclick="checkSMTPConfig()"
        class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 mb-4"
      >
        Check SMTP Configuration
      </button>

      <div id="smtpResults" class="mt-4"></div>
    </div>

    <!-- Test Email -->
    <div class="bg-white rounded-lg shadow-lg p-8">
      <h2 class="text-xl font-bold mb-4">Send Test Email</h2>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-2">Email Address:</label>
          <input
            type="email"
            id="testEmail"
            placeholder="your@email.com"
            class="w-full px-4 py-2 border rounded-lg"
          />
        </div>

        <button
          onclick="sendTestEmail()"
          class="w-full bg-green-600 text-white py-3 rounded-lg font-medium hover:bg-green-700"
        >
          Send Test Email
        </button>

        <div id="emailResults" class="mt-4"></div>
      </div>
    </div>

    <!-- Recent Reservations -->
    <div class="bg-white rounded-lg shadow-lg p-8">
      <h2 class="text-xl font-bold mb-4">Recent Reservations</h2>

      <button
        onclick="loadRecentReservations()"
        class="w-full bg-purple-600 text-white py-3 rounded-lg font-medium hover:bg-purple-700 mb-4"
      >
        Load Recent Reservations
      </button>

      <div id="reservationsList" class="mt-4"></div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabaseUrl = import.meta.env?.VITE_SUPABASE_URL || localStorage.getItem('supabase_url') || prompt('Enter Supabase URL:');
    const supabaseKey = import.meta.env?.VITE_SUPABASE_ANON_KEY || localStorage.getItem('supabase_anon_key') || prompt('Enter Supabase Anon Key:');

    if (supabaseUrl && supabaseKey) {
      localStorage.setItem('supabase_url', supabaseUrl);
      localStorage.setItem('supabase_anon_key', supabaseKey);
    }

    const supabase = createClient(supabaseUrl, supabaseKey);

    window.checkSMTPConfig = async () => {
      const resultsDiv = document.getElementById('smtpResults');
      resultsDiv.innerHTML = '<div class="text-center py-4">Checking...</div>';

      try {
        const { data: settings, error } = await supabase
          .from('settings')
          .select('key, value')
          .in('key', ['smtp_host', 'smtp_port', 'smtp_user', 'smtp_password', 'smtp_from_email']);

        if (error) throw error;

        const settingsMap = {};
        settings.forEach(s => settingsMap[s.key] = s.value);

        const isConfigured = settingsMap.smtp_host && settingsMap.smtp_user && settingsMap.smtp_password;

        resultsDiv.innerHTML = `
          <div class="bg-${isConfigured ? 'green' : 'red'}-50 border border-${isConfigured ? 'green' : 'red'}-200 rounded-lg p-4">
            <h3 class="font-bold mb-3">${isConfigured ? '✓ SMTP Configured' : '✗ SMTP Not Configured'}</h3>
            <div class="text-sm space-y-1">
              <p><strong>Host:</strong> ${settingsMap.smtp_host || 'Not set'}</p>
              <p><strong>Port:</strong> ${settingsMap.smtp_port || 'Not set'}</p>
              <p><strong>User:</strong> ${settingsMap.smtp_user || 'Not set'}</p>
              <p><strong>Password:</strong> ${settingsMap.smtp_password ? '***configured***' : 'Not set'}</p>
              <p><strong>From Email:</strong> ${settingsMap.smtp_from_email || 'Not set'}</p>
            </div>
            ${!isConfigured ? `
              <p class="mt-3 text-sm text-red-700">
                Please configure SMTP settings in Admin Dashboard → Settings → Email Settings
              </p>
            ` : ''}
          </div>
        `;
      } catch (err) {
        console.error('Error:', err);
        resultsDiv.innerHTML = `<div class="bg-red-50 border border-red-200 rounded-lg p-4 text-red-800">Error: ${err.message}</div>`;
      }
    };

    window.sendTestEmail = async () => {
      const email = document.getElementById('testEmail').value.trim();
      const resultsDiv = document.getElementById('emailResults');

      if (!email) {
        resultsDiv.innerHTML = '<div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 text-yellow-800">Please enter an email address</div>';
        return;
      }

      resultsDiv.innerHTML = '<div class="text-center py-4">Sending email...</div>';

      try {
        const response = await fetch(`${supabaseUrl}/functions/v1/send-test-email`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${supabaseKey}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email })
        });

        const result = await response.json();

        if (response.ok) {
          resultsDiv.innerHTML = `
            <div class="bg-green-50 border border-green-200 rounded-lg p-4">
              <p class="text-green-800 font-bold">✓ Test email sent successfully!</p>
              <p class="text-sm text-green-700 mt-2">Check your inbox at ${email}</p>
            </div>
          `;
        } else {
          resultsDiv.innerHTML = `
            <div class="bg-red-50 border border-red-200 rounded-lg p-4">
              <p class="text-red-800 font-bold">✗ Failed to send email</p>
              <p class="text-sm text-red-700 mt-2">${result.error || 'Unknown error'}</p>
            </div>
          `;
        }
      } catch (err) {
        console.error('Error:', err);
        resultsDiv.innerHTML = `<div class="bg-red-50 border border-red-200 rounded-lg p-4 text-red-800">Error: ${err.message}</div>`;
      }
    };

    window.loadRecentReservations = async () => {
      const resultsDiv = document.getElementById('reservationsList');
      resultsDiv.innerHTML = '<div class="text-center py-4">Loading...</div>';

      try {
        const { data: reservations, error } = await supabase
          .from('reservations')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(10);

        if (error) throw error;

        if (!reservations || reservations.length === 0) {
          resultsDiv.innerHTML = '<div class="text-gray-500 text-center py-4">No reservations found</div>';
          return;
        }

        resultsDiv.innerHTML = `
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Booking Code</th>
                  <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                  <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                  <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                  <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Payment</th>
                  <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                </tr>
              </thead>
              <tbody class="bg-white divide-y divide-gray-200">
                ${reservations.map(r => `
                  <tr>
                    <td class="px-4 py-2 text-sm font-mono">${r.booking_code}</td>
                    <td class="px-4 py-2 text-sm">${r.customer_name}</td>
                    <td class="px-4 py-2 text-sm">${r.customer_email}</td>
                    <td class="px-4 py-2 text-sm">
                      <span class="px-2 py-1 text-xs rounded-full ${
                        r.status === 'confirmed' ? 'bg-green-100 text-green-800' :
                        r.status === 'pending' ? 'bg-yellow-100 text-yellow-800' :
                        'bg-gray-100 text-gray-800'
                      }">${r.status}</span>
                    </td>
                    <td class="px-4 py-2 text-sm">
                      <span class="px-2 py-1 text-xs rounded-full ${
                        r.payment_status === 'paid' ? 'bg-green-100 text-green-800' :
                        'bg-red-100 text-red-800'
                      }">${r.payment_status}</span>
                    </td>
                    <td class="px-4 py-2 text-sm">
                      ${r.payment_status === 'paid' ? `
                        <button onclick="resendConfirmation('${r.id}')" class="text-blue-600 hover:text-blue-800 text-xs">
                          Resend Email
                        </button>
                      ` : r.payment_link_url ? `
                        <a href="${r.payment_link_url}" target="_blank" class="text-blue-600 hover:text-blue-800 text-xs">
                          Pay Now
                        </a>
                      ` : '-'}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        console.error('Error:', err);
        resultsDiv.innerHTML = `<div class="bg-red-50 border border-red-200 rounded-lg p-4 text-red-800">Error: ${err.message}</div>`;
      }
    };

    window.resendConfirmation = async (reservationId) => {
      if (!confirm('Resend confirmation email for this reservation?')) return;

      try {
        const response = await fetch(`${supabaseUrl}/functions/v1/send-reservation-confirmation-email`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${supabaseKey}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            reservationId: reservationId,
            is_payment_confirmation: true
          })
        });

        if (response.ok) {
          alert('Email sent successfully!');
        } else {
          const error = await response.text();
          alert('Failed to send email: ' + error);
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    };

    // Auto-load on page load
    checkSMTPConfig();
    loadRecentReservations();
  </script>
</body>
</html>
