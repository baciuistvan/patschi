<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover" />
    <title>Crew Dashboard Debug</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: monospace;
        background: #0f172a;
        color: #e2e8f0;
      }
      .debug-section {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
      }
      .debug-section h3 {
        margin: 0 0 10px 0;
        color: #3b82f6;
      }
      .success { color: #22c55e; }
      .error { color: #ef4444; }
      .warning { color: #f59e0b; }
      pre {
        background: #0f172a;
        padding: 10px;
        border-radius: 4px;
        overflow-x: auto;
      }
      button {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        margin: 5px;
      }
      button:hover {
        background: #2563eb;
      }
    </style>
  </head>
  <body>
    <h1>🔍 Crew Dashboard Debug Tool</h1>

    <div class="debug-section">
      <h3>Environment Configuration</h3>
      <div id="env-check"></div>
    </div>

    <div class="debug-section">
      <h3>URL Detection</h3>
      <div id="url-check"></div>
    </div>

    <div class="debug-section">
      <h3>Supabase Connection</h3>
      <div id="supabase-check"></div>
    </div>

    <div class="debug-section">
      <h3>Authentication Status</h3>
      <div id="auth-check"></div>
    </div>

    <div class="debug-section">
      <h3>Actions</h3>
      <button onclick="window.location.href='./crew.html'">Open Crew Dashboard</button>
      <button onclick="location.reload()">Refresh Debug</button>
      <button onclick="checkAuth()">Test Auth Connection</button>
    </div>

    <div class="debug-section">
      <h3>Console Output</h3>
      <pre id="console-output"></pre>
    </div>

    <script>
      const consoleOutput = document.getElementById('console-output');
      const originalLog = console.log;
      const originalError = console.error;

      function logToPage(type, ...args) {
        const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
        consoleOutput.textContent += `[${type}] ${msg}\n`;
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
      }

      console.log = (...args) => {
        originalLog(...args);
        logToPage('LOG', ...args);
      };

      console.error = (...args) => {
        originalError(...args);
        logToPage('ERROR', ...args);
      };

      // Environment Check
      const SUPABASE_URL = 'https://qwwerwkekvmaswusvgxy.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d2Vyd2tla3ZtYXN3dXN2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzkxOTYsImV4cCI6MjA3OTU1NTE5Nn0.LkNZz4Tl0y8DzI4P3dvZn2-5a4FIjE72kYHbhK5_YvE';

      document.getElementById('env-check').innerHTML = `
        <div class="${SUPABASE_URL ? 'success' : 'error'}">
          ✓ Supabase URL: ${SUPABASE_URL ? 'Configured' : 'Missing'}
        </div>
        <div class="${SUPABASE_ANON_KEY ? 'success' : 'error'}">
          ✓ Supabase Key: ${SUPABASE_ANON_KEY ? 'Configured' : 'Missing'}
        </div>
        <pre>${SUPABASE_URL}</pre>
      `;

      // URL Check
      const urlInfo = {
        pathname: window.location.pathname,
        search: window.location.search,
        hash: window.location.hash,
        hasCrewParam: new URLSearchParams(window.location.search).get('mode') === 'crew'
      };

      document.getElementById('url-check').innerHTML = `
        <pre>${JSON.stringify(urlInfo, null, 2)}</pre>
        <div class="${urlInfo.hasCrewParam ? 'success' : 'warning'}">
          ${urlInfo.hasCrewParam ? '✓ Crew mode parameter detected' : '⚠ Crew mode parameter NOT detected'}
        </div>
      `;

      // Supabase Check
      async function checkSupabase() {
        try {
          const response = await fetch(`${SUPABASE_URL}/rest/v1/`, {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          });

          document.getElementById('supabase-check').innerHTML = `
            <div class="success">✓ Supabase connection successful</div>
            <div>Status: ${response.status}</div>
          `;
        } catch (error) {
          document.getElementById('supabase-check').innerHTML = `
            <div class="error">✗ Supabase connection failed</div>
            <pre>${error.message}</pre>
          `;
        }
      }

      // Auth Check
      async function checkAuth() {
        document.getElementById('auth-check').innerHTML = '<div class="warning">Checking authentication...</div>';

        try {
          const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          });

          if (response.ok) {
            const data = await response.json();
            document.getElementById('auth-check').innerHTML = `
              <div class="success">✓ Authenticated</div>
              <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
          } else {
            document.getElementById('auth-check').innerHTML = `
              <div class="warning">⚠ Not authenticated (this is normal if not logged in)</div>
              <div>Status: ${response.status}</div>
              <div>Try logging in through the crew dashboard</div>
            `;
          }
        } catch (error) {
          document.getElementById('auth-check').innerHTML = `
            <div class="error">✗ Auth check failed</div>
            <pre>${error.message}</pre>
          `;
        }
      }

      // Run checks
      checkSupabase();
      checkAuth();

      console.log('Debug tool initialized');
    </script>
  </body>
</html>
