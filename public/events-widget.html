<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veranstaltungen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark-bg: #0d0d0d;
      --dark-panel: #111111;
      --amber: #c9a84c;
      --amber-light: #d4aa6a;
      --text-white: #f0ece6;
      --text-muted: #888078;
      --text-meta: #a09890;
      --divider: #1e1e1e;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: transparent;
      color: var(--text-white);
      -webkit-font-smoothing: antialiased;
    }

    #events-widget-root {
      max-width: 100%;
      margin: 0 auto;
      background: var(--dark-bg);
    }

    .ew-widget {
      background: var(--dark-bg);
      overflow: hidden;
    }

    /* ── Loading / Error / Empty ── */
    .ew-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 40px;
      gap: 20px;
      color: var(--text-muted);
      font-size: 16px;
      background: var(--dark-bg);
    }

    .ew-spinner {
      width: 48px; height: 48px;
      border: 2px solid #2a2a2a;
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .ew-empty {
      text-align: center;
      padding: 100px 40px;
      background: var(--dark-bg);
      color: var(--text-muted);
    }

    .ew-empty h3 {
      font-family: 'Cardo', Georgia, serif;
      font-size: 28px; font-weight: 700;
      color: var(--text-white);
      margin-bottom: 12px;
    }

    .ew-empty p { font-size: 16px; color: var(--text-muted); line-height: 1.65; }

    .ew-error {
      background: #1a0a0a;
      padding: 32px 40px;
      display: flex; align-items: flex-start; gap: 16px;
      font-size: 15px; color: #c07070;
    }

    .ew-error svg { flex-shrink: 0; margin-top: 2px; }

    /* ── Events list ── */
    .ew-events-list {
      display: flex;
      flex-direction: column;
    }

    /* ── Single event row ── */
    .ew-event-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 400px;
      border-bottom: 1px solid var(--divider);
      overflow: hidden;
    }

    /* odd  → image left,  text right */
    .ew-event-row.odd  .ew-event-img-wrap { order: 1; }
    .ew-event-row.odd  .ew-event-content  { order: 2; }

    /* even → text left,  image right */
    .ew-event-row.even .ew-event-content  { order: 1; }
    .ew-event-row.even .ew-event-img-wrap { order: 2; }

    /* No image: full-width content */
    .ew-event-row.no-image {
      grid-template-columns: 1fr;
    }

    /* ── Image pane ── */
    .ew-event-img-wrap {
      position: relative;
      overflow: hidden;
      background: #1a1a1a;
      min-height: 340px;
    }

    .ew-event-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    .ew-event-row:hover .ew-event-img-wrap img {
      transform: scale(1.04);
    }

    .ew-img-placeholder {
      width: 100%; height: 100%;
      min-height: 340px;
      display: flex; align-items: center; justify-content: center;
      background: #1a1a1a;
      color: #333;
    }

    /* Category tag on image */
    .ew-cat-tag {
      position: absolute;
      top: 20px; left: 20px;
      background: var(--amber);
      color: #0d0d0d;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 2px;
    }

    /* ── Content pane ── */
    .ew-event-content {
      padding: 52px 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--dark-panel);
    }

    /* ── Meta row (date / time / location) ── */
    .ew-event-meta-row {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .ew-meta-piece {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-meta);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .ew-meta-piece svg { opacity: 0.7; flex-shrink: 0; }

    .ew-meta-piece.date-piece { color: var(--amber); }

    /* ── Title ── */
    .ew-event-title {
      font-family: 'Cardo', Georgia, serif;
      font-size: 44px; font-weight: 700;
      color: var(--text-white);
      line-height: 1.15;
      margin-bottom: 20px;
      letter-spacing: -0.01em;
    }

    /* ── Description ── */
    .ew-event-description {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.75;
      white-space: pre-line;
      margin-bottom: 32px;
      max-height: 100px;
      overflow: hidden;
    }

    /* ── CTA Button ── */
    .ew-cta-btn {
      display: inline-flex;
      align-items: center;
      padding: 12px 28px;
      border: 1px solid rgba(240,236,230,0.35);
      background: transparent;
      color: var(--text-white);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      border-radius: 1px;
      align-self: flex-start;
    }

    .ew-cta-btn:hover {
      background: var(--text-white);
      border-color: var(--text-white);
      color: var(--dark-bg);
    }

    /* ── Mobile ── */
    @media (max-width: 680px) {
      .ew-event-row,
      .ew-event-row.odd,
      .ew-event-row.even {
        grid-template-columns: 1fr;
      }

      .ew-event-row.odd  .ew-event-img-wrap,
      .ew-event-row.even .ew-event-img-wrap { order: 1; }
      .ew-event-row.odd  .ew-event-content,
      .ew-event-row.even .ew-event-content  { order: 2; }

      .ew-event-img-wrap { min-height: 260px; }

      .ew-event-content {
        padding: 36px 28px 40px;
      }

      .ew-event-title { font-size: 32px; }

      .ew-event-meta-row { gap: 14px; }
    }

    @media (max-width: 480px) {
      .ew-event-content { padding: 28px 20px 32px; }
      .ew-event-title { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div id="events-widget-root">
    <div class="ew-widget">
      <div id="app">
        <div class="ew-loading" id="loading">
          <div class="ew-spinner"></div>
          <span>Events werden geladen&hellip;</span>
        </div>
        <div id="content" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://qwwerwkekvmaswusvgxy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d2Vyd2tla3ZtYXN3dXN2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzkxOTYsImV4cCI6MjA3OTU1NTE5Nn0.LkNZz4Tl0y8DzI4P3dvZn2-5a4FIjE72kYHbhK5_YvE';

    let allEvents = [];

    function icon(paths, size) {
      size = size || 14;
      return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
    }

    const icons = {
      calendar: icon('<rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/>'),
      clock:    icon('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>'),
      mapPin:   icon('<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>'),
      alertCircle: icon('<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>', 20),
      imagePlaceholder: icon('<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>', 56),
    };

    function formatMonthYear(d) {
      return new Date(d + 'T00:00:00').toLocaleDateString('de-AT', {month:'long', year:'numeric'}).toUpperCase();
    }

    function formatTime(t) { return t ? t.slice(0,5) : ''; }

    function escHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function renderEvent(ev, index) {
      var hasImage    = ev.image_url && ev.image_url.trim();
      var hasDesc     = ev.description && ev.description.trim();
      var hasTime     = ev.start_time;
      var hasLocation = ev.location && ev.location.trim();

      var parity = (index % 2 === 0) ? 'odd' : 'even';
      var noImgClass = hasImage ? '' : ' no-image';

      var timeStr = '';
      if (hasTime) {
        timeStr = 'Ab ' + formatTime(ev.start_time) + ' Uhr';
      }

      /* image pane */
      var imgPane = '';
      if (hasImage) {
        imgPane =
          '<div class="ew-event-img-wrap">' +
            (ev.category
              ? '<div class="ew-cat-tag">' + escHtml(ev.category) + '</div>'
              : '') +
            '<img src="' + escHtml(ev.image_url) + '" alt="' + escHtml(ev.title) + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=ew-img-placeholder>' + icons.imagePlaceholder + '</div>\'">' +
          '</div>';
      }

      /* meta row */
      var metaPieces = '';
      metaPieces += '<span class="ew-meta-piece date-piece">' + icons.calendar + ' ' + formatMonthYear(ev.date) + '</span>';
      if (hasTime)     metaPieces += '<span class="ew-meta-piece">' + icons.clock   + ' ' + escHtml(timeStr)    + '</span>';
      if (hasLocation) metaPieces += '<span class="ew-meta-piece">' + icons.mapPin  + ' ' + escHtml(ev.location) + '</span>';

      /* content pane */
      var contentPane =
        '<div class="ew-event-content">' +
          '<div class="ew-event-meta-row">' + metaPieces + '</div>' +
          '<div class="ew-event-title">' + escHtml(ev.title) + '</div>' +
          (hasDesc ? '<div class="ew-event-description">' + escHtml(ev.description) + '</div>' : '') +
          '<a class="ew-cta-btn" href="#">Mehr erfahren</a>' +
        '</div>';

      return '<div class="ew-event-row ' + parity + noImgClass + '">' +
        imgPane +
        contentPane +
      '</div>';
    }

    function renderList() {
      var today = new Date().toISOString().slice(0, 10);
      var filtered = allEvents.filter(function(ev) {
        return ev.date >= today;
      });

      var content = document.getElementById('content');

      if (filtered.length === 0) {
        content.innerHTML =
          '<div class="ew-empty">' +
            '<h3>Keine Veranstaltungen</h3>' +
            '<p>Aktuell sind keine Veranstaltungen geplant.<br>Schau bald wieder vorbei!</p>' +
          '</div>';
        return;
      }

      content.innerHTML = '<div class="ew-events-list">' + filtered.map(renderEvent).join('') + '</div>';
    }

    async function loadEvents() {
      try {
        var today = new Date().toISOString().slice(0, 10);
        var res = await fetch(
          SUPABASE_URL + '/rest/v1/events?select=*&is_active=eq.true&date=gte.' + today + '&order=sort_order.asc,date.asc',
          { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } }
        );

        if (!res.ok) throw new Error('Fehler beim Laden');

        allEvents = await res.json();

        document.getElementById('loading').style.display = 'none';
        var content = document.getElementById('content');
        content.style.display = 'block';

        if (!allEvents || allEvents.length === 0) {
          content.innerHTML =
            '<div class="ew-empty">' +
              '<h3>Aktuell keine Veranstaltungen</h3>' +
              '<p>Schau bald wieder vorbei &ndash;<br>neue Events werden bald angek&uuml;ndigt!</p>' +
            '</div>';
          return;
        }

        renderList();

      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        var content = document.getElementById('content');
        content.style.display = 'block';
        content.innerHTML =
          '<div class="ew-error">' +
            icons.alertCircle +
            '<div><strong>Fehler beim Laden</strong><br>Bitte die Seite neu laden.</div>' +
          '</div>';
      }
    }

    loadEvents();
  </script>
</body>
</html>
