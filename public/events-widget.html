<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veranstaltungen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --charcoal: #1e1e1e;
      --charcoal-light: #2e2e2e;
      --charcoal-mid: #3a3a3a;
      --warm-white: #f7f3ee;
      --warm-cream: #ede8e0;
      --warm-border: #d4cec4;
      --amber: #b8924a;
      --amber-light: #d4aa6a;
      --amber-pale: #f5eddc;
      --text-primary: #1e1e1e;
      --text-secondary: #5a5550;
      --text-muted: #9a948e;
      --success: #4a7c59;
      --success-pale: #eaf2ed;
      --error: #8b2e2e;
      --error-pale: #fdf0f0;
      --shadow: 6px 6px 9px rgba(0,0,0,0.12);
      --shadow-soft: 0 2px 8px rgba(0,0,0,0.08);
      --radius: 4px;
      --radius-lg: 8px;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 17px;
      background: transparent;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    #events-widget-root {
      max-width: 100%;
      margin: 0 auto;
    }

    @media (min-width: 640px) {
      body { padding: 40px; }
      #events-widget-root { max-width: 1200px; }
    }

    @media (min-width: 768px) {
      #events-widget-root { max-width: 1400px; }
    }

    .ew-widget {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .ew-header {
      background: var(--charcoal);
      padding: 52px 60px 44px;
      position: relative;
    }

    .ew-header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .ew-title {
      font-family: 'Cardo', Georgia, serif;
      font-size: 48px;
      font-weight: 700;
      color: var(--warm-white);
      letter-spacing: 0.01em;
      line-height: 1.2;
    }

    .ew-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: #9a948e;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .ew-count-badge {
      background: rgba(184,146,74,0.18);
      border: 1px solid rgba(184,146,74,0.35);
      color: var(--amber-light);
      padding: 7px 22px;
      border-radius: 9999px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      white-space: nowrap;
      margin-top: 4px;
    }

    .ew-filters {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    .ew-filter-btn {
      padding: 6px 18px;
      border-radius: 9999px;
      border: 1px solid rgba(212, 206, 196, 0.3);
      background: transparent;
      color: #9a948e;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 0.02em;
    }

    .ew-filter-btn:hover {
      border-color: rgba(184,146,74,0.5);
      color: var(--amber-light);
      background: rgba(184,146,74,0.08);
    }

    .ew-filter-btn.active {
      background: rgba(184,146,74,0.18);
      border-color: rgba(184,146,74,0.45);
      color: var(--amber-light);
    }

    .ew-body {
      padding: 40px 60px 56px;
    }

    @media (max-width: 640px) {
      .ew-header { padding: 32px 24px 28px; }
      .ew-body { padding: 28px 24px 36px; }
      .ew-title { font-size: 34px; }
      .ew-filters { margin-top: 20px; }
    }

    .ew-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 40px;
      gap: 20px;
      color: var(--text-muted);
      font-size: 16px;
    }

    .ew-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--warm-border);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .ew-empty {
      text-align: center;
      padding: 88px 40px;
    }

    .ew-empty-icon {
      width: 84px;
      height: 84px;
      border-radius: var(--radius-lg);
      background: var(--amber-pale);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: var(--amber);
    }

    .ew-empty h3 {
      font-family: 'Cardo', Georgia, serif;
      font-size: 30px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .ew-empty p {
      font-size: 17px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .ew-events-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ew-event-card {
      border: 1px solid var(--warm-border);
      border-radius: var(--radius-lg);
      background: white;
      overflow: hidden;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .ew-event-card.featured {
      border-color: rgba(184,146,74,0.4);
    }

    .ew-event-card:hover {
      box-shadow: var(--shadow-soft);
      border-color: var(--amber-light);
    }

    .ew-event-header {
      display: flex;
      align-items: flex-start;
      gap: 22px;
      padding: 26px 32px 22px;
      cursor: pointer;
      user-select: none;
    }

    .ew-date-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 68px;
      min-height: 68px;
      border-radius: var(--radius);
      background: var(--amber-pale);
      flex-shrink: 0;
      margin-top: 2px;
      padding: 8px 6px;
      border: 1px solid rgba(184,146,74,0.2);
    }

    .ew-date-block.featured {
      background: var(--amber);
    }

    .ew-date-day {
      font-family: 'Cardo', Georgia, serif;
      font-size: 30px;
      font-weight: 700;
      color: var(--charcoal);
      line-height: 1;
    }

    .ew-date-block.featured .ew-date-day {
      color: white;
    }

    .ew-date-month {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--amber);
      margin-top: 2px;
    }

    .ew-date-block.featured .ew-date-month {
      color: rgba(255,255,255,0.8);
    }

    .ew-event-main { flex: 1; min-width: 0; }

    .ew-event-title-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .ew-event-title {
      font-family: 'Cardo', Georgia, serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .ew-category-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
      margin-top: 6px;
      font-family: 'Inter', sans-serif;
    }

    .badge-party        { background: #fce7f3; color: #9d174d; border: 1px solid #fbcfe8; }
    .badge-live-music   { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
    .badge-dj-night     { background: var(--amber-pale); color: #7a5c20; border: 1px solid #e8d5a8; }
    .badge-spezialevent { background: var(--success-pale); color: #2d6045; border: 1px solid #a8d5b8; }
    .badge-apres-ski    { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .badge-konzert      { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .badge-sonstiges    { background: var(--warm-cream); color: var(--text-secondary); border: 1px solid var(--warm-border); }
    .badge-featured     { background: rgba(184,146,74,0.15); color: var(--amber); border: 1px solid rgba(184,146,74,0.3); }

    .ew-event-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--text-secondary);
      font-style: italic;
      margin-bottom: 8px;
    }

    .ew-event-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 14px;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
    }

    .ew-event-meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ew-event-meta-item svg { opacity: 0.7; flex-shrink: 0; }

    .ew-price-label {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--amber);
      margin-left: auto;
      white-space: nowrap;
    }

    .ew-event-toggle {
      width: 44px;
      height: 44px;
      border-radius: var(--radius);
      border: 1px solid var(--warm-border);
      background: var(--warm-white);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
      color: var(--text-muted);
    }

    .ew-event-toggle:hover {
      background: var(--amber-pale);
      border-color: var(--amber-light);
      color: var(--amber);
    }

    .ew-event-toggle.open {
      background: var(--amber-pale);
      border-color: var(--amber-light);
      color: var(--amber);
    }

    .ew-event-toggle svg { transition: transform 0.25s ease; }
    .ew-event-toggle.open svg { transform: rotate(180deg); }

    .ew-event-details {
      display: none;
      border-top: 1px solid var(--warm-border);
      padding: 28px 32px 30px;
      background: var(--warm-white);
    }

    .ew-event-details.open {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ew-detail-section h4 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 10px;
      font-family: 'Inter', sans-serif;
    }

    .ew-detail-section p {
      font-size: 16px;
      color: var(--text-secondary);
      line-height: 1.75;
      white-space: pre-line;
      font-family: 'Inter', sans-serif;
    }

    .ew-event-image {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: var(--radius);
      margin-bottom: 20px;
      display: block;
    }

    .ew-error {
      border: 1px solid #e8c8c8;
      background: var(--error-pale);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      font-size: 16px;
      color: var(--error);
      font-family: 'Inter', sans-serif;
    }

    .ew-error svg { flex-shrink: 0; margin-top: 2px; }

    @media (max-width: 520px) {
      .ew-event-header { padding: 20px 18px 18px; gap: 14px; }
      .ew-event-details { padding: 20px 18px 22px; }
      .ew-date-block { width: 56px; min-height: 56px; }
      .ew-date-day { font-size: 24px; }
      .ew-event-title { font-size: 20px; }
      .ew-price-label { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div id="events-widget-root">
    <div class="ew-widget">
      <div class="ew-header">
        <div class="ew-header-top">
          <div>
            <div class="ew-subtitle">Programm</div>
            <div class="ew-title">Veranstaltungen</div>
          </div>
          <div class="ew-count-badge" id="count-badge" style="display:none;"></div>
        </div>
        <div class="ew-filters" id="filters" style="display:none;"></div>
      </div>
      <div class="ew-body" id="app">
        <div class="ew-loading" id="loading">
          <div class="ew-spinner"></div>
          <span>Events werden geladen&hellip;</span>
        </div>
        <div id="content" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://qwwerwkekvmaswusvgxy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d2Vyd2tla3ZtYXN3dXN2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzkxOTYsImV4cCI6MjA3OTU1NTE5Nn0.LkNZz4Tl0y8DzI4P3dvZn2-5a4FIjE72kYHbhK5_YvE';

    const openCards = new Set();
    let allEvents = [];
    let activeFilter = 'Alle';

    function icon(paths, size) {
      size = size || 18;
      return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
    }

    const icons = {
      calendar: icon('<rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/>'),
      clock: icon('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>'),
      mapPin: icon('<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>'),
      chevronDown: icon('<path d="m6 9 6 6 6-6"/>', 20),
      alertCircle: icon('<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>'),
      calendarOff: icon('<path d="M 6 2 L 6 6"/><path d="M 18 2 L 18 6"/><path d="M 2 10 L 20 10"/><path d="M 2 6 Q 2 4 4 4 L 20 4 Q 22 4 22 6 L 22 20 Q 22 22 20 22 L 4 22 Q 2 22 2 20 Z"/><path d="M 8 14 L 16 20"/><path d="M 16 14 L 8 20"/>'),
      star: icon('<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'),
    };

    function badgeClass(category) {
      const map = {
        'Party': 'badge-party',
        'Live Music': 'badge-live-music',
        'DJ Night': 'badge-dj-night',
        'Spezialevent': 'badge-spezialevent',
        'Après-Ski': 'badge-apres-ski',
        'Konzert': 'badge-konzert',
        'Sonstiges': 'badge-sonstiges',
      };
      return map[category] || 'badge-sonstiges';
    }

    function formatDay(dateStr) {
      var d = new Date(dateStr + 'T00:00:00');
      return d.getDate();
    }

    function formatMonth(dateStr) {
      var d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('de-AT', { month: 'short' }).replace('.', '');
    }

    function formatFullDate(dateStr) {
      var d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('de-AT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    function formatTime(t) {
      return t ? t.slice(0, 5) : '';
    }

    function escHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function toggleCard(id) {
      var details = document.getElementById('ev-details-' + id);
      var toggle = document.getElementById('ev-toggle-' + id);
      if (!details) return;
      if (openCards.has(id)) {
        openCards.delete(id);
        details.classList.remove('open');
        toggle.classList.remove('open');
      } else {
        openCards.add(id);
        details.classList.add('open');
        toggle.classList.add('open');
      }
    }

    function renderEvent(ev) {
      var hasDesc = ev.description && ev.description.trim();
      var hasImage = ev.image_url && ev.image_url.trim();
      var hasDetails = hasDesc || hasImage;
      var isFeatured = ev.is_featured;
      var hasTime = ev.start_time;
      var hasLocation = ev.location && ev.location.trim();
      var hasPriceLabel = ev.price_label && ev.price_label.trim();
      var hasSubtitle = ev.subtitle && ev.subtitle.trim();

      var timeStr = '';
      if (hasTime) {
        timeStr = formatTime(ev.start_time);
        if (ev.end_time) timeStr += ' \u2013 ' + formatTime(ev.end_time);
        timeStr += ' Uhr';
      }

      return '<div class="ew-event-card' + (isFeatured ? ' featured' : '') + '" id="ev-card-' + ev.id + '">' +
        '<div class="ew-event-header" onclick="toggleCard(\'' + ev.id + '\')">' +
          '<div class="ew-date-block' + (isFeatured ? ' featured' : '') + '">' +
            '<span class="ew-date-day">' + formatDay(ev.date) + '</span>' +
            '<span class="ew-date-month">' + formatMonth(ev.date) + '</span>' +
          '</div>' +
          '<div class="ew-event-main">' +
            '<div class="ew-event-title-row">' +
              '<span class="ew-event-title">' + escHtml(ev.title) + '</span>' +
              (ev.category ? '<span class="ew-category-badge ' + badgeClass(ev.category) + '">' + escHtml(ev.category) + '</span>' : '') +
              (isFeatured ? '<span class="ew-category-badge badge-featured">' + icons.star + '&thinsp;Featured</span>' : '') +
            '</div>' +
            (hasSubtitle ? '<div class="ew-event-subtitle">' + escHtml(ev.subtitle) + '</div>' : '') +
            '<div class="ew-event-meta">' +
              '<span class="ew-event-meta-item">' + icons.calendar + ' ' + escHtml(formatFullDate(ev.date)) + '</span>' +
              (hasTime ? '<span class="ew-event-meta-item">' + icons.clock + ' ' + escHtml(timeStr) + '</span>' : '') +
              (hasLocation ? '<span class="ew-event-meta-item">' + icons.mapPin + ' ' + escHtml(ev.location) + '</span>' : '') +
              (hasPriceLabel ? '<span class="ew-price-label">' + escHtml(ev.price_label) + '</span>' : '') +
            '</div>' +
          '</div>' +
          (hasDetails
            ? '<button class="ew-event-toggle" id="ev-toggle-' + ev.id + '" onclick="event.stopPropagation(); toggleCard(\'' + ev.id + '\')" aria-label="Details anzeigen">' + icons.chevronDown + '</button>'
            : '') +
        '</div>' +
        (hasDetails
          ? '<div class="ew-event-details" id="ev-details-' + ev.id + '">' +
              (hasImage ? '<img src="' + escHtml(ev.image_url) + '" alt="' + escHtml(ev.title) + '" class="ew-event-image" onerror="this.style.display=\'none\'">' : '') +
              (hasDesc ? '<div class="ew-detail-section"><h4>Details</h4><p>' + escHtml(ev.description) + '</p></div>' : '') +
            '</div>'
          : '') +
        '</div>';
    }

    function buildFilters(events) {
      var categories = ['Alle'];
      events.forEach(function(ev) {
        if (ev.category && categories.indexOf(ev.category) === -1) {
          categories.push(ev.category);
        }
      });

      if (categories.length <= 2) return;

      var filtersEl = document.getElementById('filters');
      filtersEl.style.display = '';
      filtersEl.innerHTML = categories.map(function(cat) {
        return '<button class="ew-filter-btn' + (cat === activeFilter ? ' active' : '') + '" onclick="setFilter(\'' + cat.replace(/'/g, "\\'") + '\')">' + escHtml(cat) + '</button>';
      }).join('');
    }

    function setFilter(cat) {
      activeFilter = cat;
      renderList();
      var btns = document.querySelectorAll('.ew-filter-btn');
      btns.forEach(function(btn) {
        btn.classList.toggle('active', btn.textContent === cat);
      });
    }

    function renderList() {
      var today = new Date().toISOString().slice(0, 10);
      var filtered = allEvents.filter(function(ev) {
        var matchCat = activeFilter === 'Alle' || ev.category === activeFilter;
        var isUpcoming = ev.date >= today;
        return matchCat && isUpcoming;
      });

      var content = document.getElementById('content');

      if (filtered.length === 0) {
        content.innerHTML =
          '<div class="ew-empty">' +
            '<div class="ew-empty-icon">' + icons.calendarOff.replace('18', '44').replace('18', '44') + '</div>' +
            '<h3>Keine Veranstaltungen</h3>' +
            '<p>' + (activeFilter !== 'Alle' ? 'Keine Events in dieser Kategorie.' : 'Aktuell sind keine Veranstaltungen geplant.') + '<br>Schau bald wieder vorbei!</p>' +
          '</div>';
        return;
      }

      content.innerHTML = '<div class="ew-events-list">' + filtered.map(renderEvent).join('') + '</div>';
    }

    async function loadEvents() {
      try {
        var today = new Date().toISOString().slice(0, 10);
        var res = await fetch(
          SUPABASE_URL + '/rest/v1/events?select=*&is_active=eq.true&date=gte.' + today + '&order=sort_order.asc,date.asc',
          {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            }
          }
        );

        if (!res.ok) throw new Error('Fehler beim Laden');

        allEvents = await res.json();
        var loading = document.getElementById('loading');
        var content = document.getElementById('content');

        loading.style.display = 'none';
        content.style.display = 'block';

        if (!allEvents || allEvents.length === 0) {
          content.innerHTML =
            '<div class="ew-empty">' +
              '<div class="ew-empty-icon"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg></div>' +
              '<h3>Aktuell keine Veranstaltungen</h3>' +
              '<p>Schau bald wieder vorbei &ndash;<br>neue Events werden bald angek&uuml;ndigt!</p>' +
            '</div>';
          return;
        }

        var badge = document.getElementById('count-badge');
        badge.style.display = '';
        badge.textContent = allEvents.length + ' kommende ' + (allEvents.length === 1 ? 'Veranstaltung' : 'Veranstaltungen');

        buildFilters(allEvents);
        renderList();

      } catch (err) {
        var loading = document.getElementById('loading');
        var content = document.getElementById('content');
        loading.style.display = 'none';
        content.style.display = 'block';
        content.innerHTML =
          '<div class="ew-error">' +
            icons.alertCircle +
            '<div><strong>Fehler beim Laden</strong><br>Bitte die Seite neu laden.</div>' +
          '</div>';
      }
    }

    loadEvents();
  </script>
</body>
</html>
