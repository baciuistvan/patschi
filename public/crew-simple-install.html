    window.deleteReservation = async function(reservationId) {
      const reservation = state.reservations.find(r => r.id === reservationId);
      if (!reservation) return;

      // Check if it's an online paid reservation
      const isOnlineBooking = reservation.booking_method === 'stripe' ||
                             reservation.payment_method === 'stripe' ||
                             reservation.stripe_payment_intent_id;

      if (isOnlineBooking) {
        alert('Online bezahlte Reservierungen können nicht gelöscht werden.');
        return;
      }

      // Confirm deletion
      const confirmDelete = confirm(`Reservierung für ${reservation.customer_name} am ${reservation.reservation_date} um ${reservation.reservation_time} wirklich löschen?`);
      if (!confirmDelete) return;

      try {
        const token = localStorage.getItem('crew_token');
        if (!token) throw new Error('Not authenticated');

        const response = await fetch(`${SUPABASE_URL}/functions/v1/crew-delete-reservation`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ reservation_id: reservationId })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to delete reservation');
        }

        // Remove from state
        state.reservations = state.reservations.filter(r => r.id !== reservationId);

        // Refresh the display
        await fetchReservations();

        // Show success message
        alert('Reservierung erfolgreich gelöscht.');
      } catch (error) {
        console.error('Delete error:', error);
        alert('Fehler beim Löschen der Reservierung: ' + error.message);
      }
    };


    async function handleEditReservation() {
      const mainDate = document.getElementById('resDate').value;
      const reservationId = document.getElementById('resId').value;

      // Get current reservation to check if it's online booking
      const currentReservation = resEditReservation;
      const isOnlineBooking = currentReservation && (
        currentReservation.booking_method === 'stripe' ||
        currentReservation.payment_method === 'stripe' ||
        currentReservation.stripe_payment_intent_id
      );

      const baseData = {
        customer_name: document.getElementById('resCustomerName').value,
        customer_email: document.getElementById('resCustomerEmail').value,
        customer_phone: document.getElementById('resCustomerPhone').value,
        party_size: parseInt(document.getElementById('resPartySize').value),
        reservation_time: document.getElementById('resTime').value,
        special_requests: document.getElementById('resSpecialRequests').value,
        reservation_date: mainDate
      };

      // Only include payment data if it's not an online booking
      if (!isOnlineBooking) {
        baseData.payment_status = resPaidWithCash ? 'paid' : 'unpaid';
        baseData.payment_amount = resPaidWithCash ? parseFloat(document.getElementById('cashAmount').value) : 0;
        baseData.payment_method = resPaidWithCash ? 'cash' : 'none';
        baseData.booking_method = resBookingMethod === 'free' ? 'free' : (resPaidWithCash ? 'manual' : 'free');
      }

      // Validation
      if (!baseData.customer_name || !baseData.customer_email || baseData.party_size < 1 || !baseData.reservation_time) {
        document.getElementById('reservationError').textContent = 'Bitte füllen Sie alle Pflichtfelder aus.';
        document.getElementById('reservationError').classList.remove('hidden');
        return;
      }

      // Show loading
      document.getElementById('reservationError').classList.add('hidden');
      document.getElementById('reservationButtons').classList.add('hidden');
      document.getElementById('reservationLoading').classList.remove('hidden');
      document.getElementById('reservationLoadingText').textContent = 'Wird aktualisiert...';

      try {
        const updateData = {
          ...baseData,
          reservation_id: reservationId,
          selected_tables: resSelectedTables
        };

        console.log('Sending update data:', updateData);
        console.log('Selected tables:', resSelectedTables);

        const token = localStorage.getItem('crew_token');
        if (!token) {
          throw new Error('Nicht angemeldet. Bitte melden Sie sich erneut an.');
        }

        const response = await fetch(`${SUPABASE_URL}/functions/v1/crew-update-reservation`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(updateData)
        });

        console.log('Response status:', response.status);

        if (!response.ok) {
          const error = await response.json();
          console.error('Update error response:', error);
          let errorMsg = error.error || 'Update failed';
          if (error.details) errorMsg += ` (${error.details})`;
          if (error.hint) errorMsg += ` Hint: ${error.hint}`;
          throw new Error(errorMsg);
        }

        // Hide loading and form sections
        document.getElementById('reservationLoading').classList.add('hidden');
        const formSections = document.querySelectorAll('#reservationForm > div:not(#reservationSuccess):not(#reservationError):not(#reservationLoading):not(#reservationButtons)');
        formSections.forEach(section => section.classList.add('hidden'));

        // Show success
        document.getElementById('resSuccessTitle').textContent = 'Gespeichert!';
        document.getElementById('resSuccessMessage').textContent = 'Die Änderungen wurden erfolgreich gespeichert.';
        document.getElementById('resBookingCodeSection').classList.add('hidden');
        document.getElementById('resSuccessButton').textContent = 'Schließen';
        document.getElementById('resSuccessButton').onclick = () => {
          closeReservationModal();
          renderApp();
        };
        document.getElementById('reservationSuccess').classList.remove('hidden');

        // Reload reservations
        await fetchReservations();
        await render();
      } catch (error) {
        console.error('Error updating reservation:', error);
        document.getElementById('reservationError').textContent = error.message || 'Fehler beim Aktualisieren der Reservierung.';
        document.getElementById('reservationError').classList.remove('hidden');
        document.getElementById('reservationLoading').classList.add('hidden');
        document.getElementById('reservationButtons').classList.remove('hidden');
      }
    }

    window.deleteCurrentReservation = async function() {
      const reservationId = document.getElementById('resId').value;

      if (!reservationId) {
        alert('Keine Reservierungs-ID gefunden.');
        return;
      }

      if (!resEditReservation) {
        alert('Reservierungsdaten nicht gefunden.');
        return;
      }

      // Check if it's an online paid reservation
      const isOnlineBooking = resEditReservation.booking_method === 'stripe' ||
                             resEditReservation.payment_method === 'stripe' ||
                             resEditReservation.stripe_payment_intent_id;

      if (isOnlineBooking) {
        alert('Online bezahlte Reservierungen können nicht gelöscht werden.');
        return;
      }

      // Confirm deletion
      const confirmDelete = confirm(`Reservierung für ${resEditReservation.customer_name} am ${resEditReservation.reservation_date} um ${resEditReservation.reservation_time} wirklich löschen?`);
      if (!confirmDelete) return;

      // Show loading state
      document.getElementById('reservationButtons').classList.add('hidden');
      document.getElementById('reservationLoading').classList.remove('hidden');
      document.getElementById('reservationLoadingText').textContent = 'Wird gelöscht...';

      try {
        const token = localStorage.getItem('crew_token');
        if (!token) {
          throw new Error('Nicht angemeldet. Bitte melden Sie sich erneut an.');
        }

        console.log('Deleting reservation:', reservationId);

        const response = await fetch(`${SUPABASE_URL}/functions/v1/crew-delete-reservation`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ reservation_id: reservationId })
        });

        const data = await response.json();
        console.log('Delete response:', data);

        if (!response.ok) {
          console.error('Delete error response:', data);
          throw new Error(data.error || 'Fehler beim Löschen der Reservierung');
        }

        // Remove from state
        state.reservations = state.reservations.filter(r => r.id !== reservationId);

        // Close modal and refresh
        closeReservationModal();
        await fetchReservations();
        await render();

        // Show success message
        alert('Reservierung erfolgreich gelöscht.');
      } catch (error) {
        console.error('Delete error:', error);

        // Hide loading and show buttons again
        document.getElementById('reservationLoading').classList.add('hidden');
        document.getElementById('reservationButtons').classList.remove('hidden');

        // Show error in the modal
        document.getElementById('reservationError').textContent = `Fehler: ${error.message}`;
        document.getElementById('reservationError').classList.remove('hidden');

        alert('Fehler beim Löschen der Reservierung: ' + error.message);
      }
    };

    async function handleReservationSubmit(e) {
      e.preventDefault();

      // Check if we're in edit mode
      if (resEditMode && resEditReservation) {
        await handleEditReservation();
        return;
      }

      // Get dates to book
      const mainDate = document.getElementById('resDate').value;
      console.log('Main date from picker:', mainDate);
      console.log('Multiple days checked:', document.getElementById('multipleDays').checked);
      console.log('Additional selected days:', resSelectedDays);

      const datesToBook = [mainDate];
      if (document.getElementById('multipleDays').checked) {
        resSelectedDays.forEach(day => {
          if (!datesToBook.includes(day)) {
            datesToBook.push(day);
          }
        });
      }
      datesToBook.sort();

      console.log('Final dates to book:', datesToBook);

      const isPerDayMode = resPaidWithCash && document.getElementById('multipleDays').checked && resSelectedDays.length > 0;

      // Get form data
      const baseData = {
        reservation_time: document.getElementById('resTime').value,
        party_size: parseInt(document.getElementById('resPartySize').value),
        room_id: document.getElementById('resRoom').value,
        customer_name: document.getElementById('resCustomerName').value,
        customer_email: document.getElementById('resCustomerEmail').value,
        customer_phone: document.getElementById('resCustomerPhone').value,
        special_requests: document.getElementById('resSpecialRequests').value,
        duration_minutes: 120,
        status: 'confirmed',
        payment_status: resPaidWithCash ? 'paid' : 'unpaid',
        payment_method: resPaidWithCash ? 'cash' : 'none',
        booking_method: resBookingMethod === 'free' ? 'free' : (resPaidWithCash ? 'manual' : 'free'),
        selected_tables: resSelectedTables
      };

      // Validation
      if (!baseData.reservation_time || !baseData.room_id ||
          !baseData.customer_name || !baseData.customer_email || baseData.party_size < 1) {
        document.getElementById('reservationError').textContent = 'Bitte füllen Sie alle Pflichtfelder aus.';
        document.getElementById('reservationError').classList.remove('hidden');
        return;
      }

      // Show loading
      document.getElementById('reservationError').classList.add('hidden');
      document.getElementById('reservationButtons').classList.add('hidden');
      document.getElementById('reservationLoading').classList.remove('hidden');

      try {
        // Create reservations for all dates
        const bookingCodes = [];
        for (const date of datesToBook) {
          const paymentAmount = isPerDayMode
            ? (resDayAmounts[date] ?? 0)
            : (resPaidWithCash ? parseFloat(document.getElementById('cashAmount').value) || 0 : 0);
          const formData = { ...baseData, reservation_date: date, payment_amount: paymentAmount };

          const response = await fetch(`${SUPABASE_URL}/functions/v1/create-reservation`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            },
            body: JSON.stringify(formData)
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Fehler beim Erstellen der Reservierung');
          }

          bookingCodes.push(data.booking_code);

          fetch(`${SUPABASE_URL}/functions/v1/notify-admins-new-reservation`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            },
            body: JSON.stringify({
              reservation: {
                id: (data.reservation && data.reservation.id) || data.reservation_id || data.id,
                customer_name: baseData.customer_name,
                party_size: baseData.party_size,
                reservation_time: baseData.reservation_time,
                reservation_date: date
              }
            })
          }).catch(err => console.error('Notify admins failed:', err));
        }

        // Hide loading and form sections
        document.getElementById('reservationLoading').classList.add('hidden');
        const formSections = document.querySelectorAll('#reservationForm > div:not(#reservationSuccess):not(#reservationError):not(#reservationLoading):not(#reservationButtons)');
        formSections.forEach(section => section.classList.add('hidden'));

        // Show success
        if (datesToBook.length > 1) {
          document.getElementById('resSuccessMessage').textContent = `${datesToBook.length} Reservierungen wurden erfolgreich angelegt.`;
          document.getElementById('resBookingCode').textContent = bookingCodes.join(', ');
        } else {
          document.getElementById('resSuccessMessage').textContent = 'Die Reservierung wurde erfolgreich angelegt.';
          document.getElementById('resBookingCode').textContent = bookingCodes[0];
        }
        document.getElementById('reservationSuccess').classList.remove('hidden');

        // Refresh reservations
        await fetchReservations();
        await render();
      } catch (error) {
        console.error('Error creating reservation:', error);
        document.getElementById('reservationLoading').classList.add('hidden');
        document.getElementById('reservationButtons').classList.remove('hidden');
        document.getElementById('reservationError').textContent = error.message || 'Fehler beim Erstellen der Reservierung. Bitte versuchen Sie es erneut.';
        document.getElementById('reservationError').classList.remove('hidden');
      }
    }

    // iOS-specific enhancements
    function setupIOSWebApp() {
      // Prevent pull-to-refresh on iOS
      let startY = 0;
      document.body.addEventListener('touchstart', function(e) {
        startY = e.touches[0].pageY;
      }, { passive: true });

      document.body.addEventListener('touchmove', function(e) {
        // Allow scrolling in scrollable areas
        if (e.target.closest('.overflow-auto, .floor-plan-container, .sidebar-mobile, [class*="overflow-y"]')) {
          return;
        }

        // Prevent bounce/pull-to-refresh on body
        const currentY = e.touches[0].pageY;
        if (window.scrollY === 0 && currentY > startY) {
          e.preventDefault();
        }
      }, { passive: false });

      // Prevent double-tap zoom (skip floor plan and multi-touch)
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        if (e.touches.length > 0) return;
        if (e.target.closest('.floor-plan-container')) return;
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);

      // Prevent iOS keyboard from pushing content
      const viewport = document.querySelector('meta[name="viewport"]');
      const originalContent = viewport.getAttribute('content');

      window.addEventListener('focusin', function() {
        if (window.innerWidth < 768) {
          viewport.setAttribute('content', originalContent + ', height=' + window.innerHeight);
        }
      });

      window.addEventListener('focusout', function() {
        viewport.setAttribute('content', originalContent);
        window._lastKeyboardDismiss = Date.now();
      });

      // Register service worker for offline support and better installability
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        navigator.serviceWorker.register('./sw.js').catch(() => {
          // Silent fail if sw.js doesn't exist
        });
      }

      // Detect if running as standalone app
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                          window.navigator.standalone === true;
      if (isStandalone) {
        document.body.classList.add('standalone-mode');
      }

      // Improve touch scrolling on iOS
      const scrollableElements = document.querySelectorAll('.overflow-auto, .overflow-y-auto');
      scrollableElements.forEach(el => {
        el.style.webkitOverflowScrolling = 'touch';
      });
    }


    // ── Pinch-to-zoom for floor plan ──────────────────────────────────────
    let fpScale = 1;
    let fpPinchActive = false;
    let fpInitialDist = 0;
    let fpScaleAtStart = 1;
    let fpOriginX = 0;
    let fpOriginY = 0;

    const FP_MIN = 0.35;
    const FP_MAX = 3.0;

    function fpGetDist(t) {
      const dx = t[0].clientX - t[1].clientX;
      const dy = t[0].clientY - t[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function fpMidpoint(t) {
      return {
        x: (t[0].clientX + t[1].clientX) / 2,
        y: (t[0].clientY + t[1].clientY) / 2,
      };
    }

    function fpApply(container, inner) {
      inner.style.transform = `scale(${fpScale})`;
      inner.style.transformOrigin = `${fpOriginX}px ${fpOriginY}px`;
    }

    function initFloorPlanZoom() {
      const container = document.querySelector('.floor-plan-container');
      const inner = document.querySelector('.floor-plan-inner');
      if (!container || !inner) return;

      inner.style.transform = `scale(${fpScale})`;
      inner.style.transformOrigin = `${fpOriginX}px ${fpOriginY}px`;

      container.addEventListener('touchstart', function(e) {
        if (e.touches.length === 2) {
          fpPinchActive = true;
          fpInitialDist = fpGetDist(e.touches);
          fpScaleAtStart = fpScale;
          const mid = fpMidpoint(e.touches);
          const rect = container.getBoundingClientRect();
          const scrollLeft = container.scrollLeft;
          const scrollTop = container.scrollTop;
          fpOriginX = (mid.x - rect.left + scrollLeft) / fpScale;
          fpOriginY = (mid.y - rect.top + scrollTop) / fpScale;
          container.classList.add('pinching');
          e.preventDefault();
        }
      }, { passive: false });

      container.addEventListener('touchmove', function(e) {
        if (!fpPinchActive || e.touches.length !== 2) return;
        e.preventDefault();
        const dist = fpGetDist(e.touches);
        let newScale = fpScaleAtStart * (dist / fpInitialDist);
        newScale = Math.min(FP_MAX, Math.max(FP_MIN, newScale));
        fpScale = newScale;
        fpApply(container, inner);
      }, { passive: false });

      container.addEventListener('touchend', function(e) {
        if (fpPinchActive && e.touches.length < 2) {
          fpPinchActive = false;
          container.classList.remove('pinching');
          const innerWidth = parseFloat(inner.style.width || inner.offsetWidth) * fpScale;
          const innerHeight = parseFloat(inner.style.height || inner.offsetHeight) * fpScale;
          inner.style.width = inner.offsetWidth + 'px';
        }
      }, { passive: true });
    }

    window.initFloorPlanZoom = initFloorPlanZoom;
    // ─────────────────────────────────────────────────────────────────────

    // Initial render
    render();
    initFloorPlanZoom();

    // Setup iOS enhancements when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setupIOSWebApp);
    } else {
      setupIOSWebApp();
    }

    // Auto-refresh: Realtime subscription + polling fallback
    let realtimeChannel = null;
    let pollingInterval = null;
    let isRefreshing = false;

    async function silentRefresh() {
      if (isRefreshing || state.view !== 'dashboard') return;
      const modal = document.getElementById('reservationModal');
      if (modal && !modal.classList.contains('hidden')) return;
      const gcModal = document.getElementById('giftCardModal');
      if (gcModal && !gcModal.classList.contains('hidden')) return;
      isRefreshing = true;
      try {
        const prevCount = state.reservations.length;
        await fetchReservations();
        if (state.reservations.length !== prevCount) {
          await render();
          showRefreshToast();
        } else {
          await render();
        }
      } finally {
        isRefreshing = false;
      }
    }

    function showRefreshToast() {
      const existing = document.getElementById('refresh-toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.id = 'refresh-toast';
      toast.style.cssText = `
        position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
        background: #1e293b; color: #e2e8f0; padding: 8px 18px;
        border-radius: 999px; font-size: 13px; font-weight: 500;
        box-shadow: 0 4px 16px rgba(0,0,0,0.4); z-index: 9999;
        pointer-events: none; transition: opacity 0.4s;
      `;
      toast.textContent = 'Aktualisiert';
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; }, 1800);
      setTimeout(() => toast.remove(), 2200);
    }

    function setupRealtimeSubscription() {
      if (realtimeChannel) return;
      try {
        const ws = new WebSocket(
          `wss://${SUPABASE_URL.replace('https://', '')}/realtime/v1/websocket?apikey=${SUPABASE_ANON_KEY}&vsn=1.0.0`
        );
        let joined = false;

        ws.onopen = () => {
          ws.send(JSON.stringify({
            topic: 'realtime:public:reservations',
            event: 'phx_join',
            payload: { config: { broadcast: { self: false }, presence: { key: '' } } },
            ref: '1'
          }));
        };

        ws.onmessage = (e) => {
          try {
            const msg = JSON.parse(e.data);
            if (msg.event === 'phx_reply' && msg.payload?.status === 'ok') joined = true;
            if (joined && (msg.event === 'INSERT' || msg.event === 'UPDATE' || msg.event === 'DELETE')) {
              silentRefresh();
            }
          } catch {}
        };

        ws.onerror = () => {};
        ws.onclose = () => {
          realtimeChannel = null;
          setTimeout(() => { if (state.view === 'dashboard') setupRealtimeSubscription(); }, 5000);
        };

        realtimeChannel = ws;

        ws.addEventListener('open', () => {
          setInterval(() => {
            if (ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: null }));
            }
          }, 25000);
        });
      } catch (err) {
        console.warn('Realtime not available, using polling only');
      }
    }

    function startPolling() {
      if (pollingInterval) return;
      pollingInterval = setInterval(silentRefresh, 30000);
    }

    function stopAutoRefresh() {
      if (realtimeChannel) { realtimeChannel.close(); realtimeChannel = null; }
      if (pollingInterval) { clearInterval(pollingInterval); pollingInterval = null; }
    }
    window.stopAutoRefresh = stopAutoRefresh;

    window._startAutoRefresh = function() {
      setupRealtimeSubscription();
      startPolling();
    };

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && state.view === 'dashboard') {
        silentRefresh();
      }
    });

    window.addEventListener('focus', () => {
      if (state.view === 'dashboard') silentRefresh();
    });

    if (state.view === 'dashboard') {
      window._startAutoRefresh();
    }
  </script>
