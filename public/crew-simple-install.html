<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Web App Manifest -->
  <link rel="manifest" href="./crew-manifest.json">

  <!-- iOS Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Crew">

  <!-- Theme Colors -->
  <meta name="theme-color" content="#0f172a">
  <meta name="msapplication-TileColor" content="#0f172a">

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="./crew-icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./crew-icon-180.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./crew-icon-512.png">
  <link rel="icon" type="image/png" href="./crew-icon.png">

  <title>Patschi Crew Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html {
      height: 100%;
      width: 100%;
      position: fixed;
      overflow: hidden;
      background: #0f172a;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      position: fixed;
      overflow: hidden;
      background: #0f172a;
    }

    #app {
      height: 100%;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Prevent zoom on input focus for iOS */
    input, select, textarea {
      font-size: 16px !important;
      max-width: 100%;
    }

    /* Ensure no horizontal overflow */
    * {
      max-width: 100vw;
      box-sizing: border-box;
    }

    /* Allow specific elements to exceed viewport */
    .floor-plan-container, .floor-plan-container *,
    .overflow-auto, .overflow-x-auto {
      max-width: none;
    }

    /* Use CSS variables for viewport height */
    :root {
      --vh: 1vh;
    }

    .loading { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Nav safe area */
    .nav-safe {
      padding-top: max(12px, env(safe-area-inset-top));
      padding-left: max(8px, env(safe-area-inset-left));
      padding-right: max(8px, env(safe-area-inset-right));
    }

    /* Responsive layout improvements */
    .main-container {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    /* Bottom safe area padding for scrollable list */
    .safe-bottom {
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }

    @media (max-width: 767px) {
      .main-container {
        flex-direction: column-reverse;
        overflow: hidden;
      }

      .sidebar-mobile {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Fixed header - no scroll */
      .sidebar-mobile > div:first-child {
        flex-shrink: 0;
      }

      /* Fixed calendar - no scroll */
      .sidebar-mobile > div:nth-child(2) {
        flex-shrink: 0;
        max-height: 32vh;
      }

      /* Reservations list should scroll */
      .sidebar-mobile > div:last-child {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        flex: 1 1 auto;
        min-height: 0;
        max-height: 100%;
        padding-bottom: max(16px, env(safe-area-inset-bottom));
        scrollbar-width: thin;
        scrollbar-color: rgba(148, 163, 184, 0.5) transparent;
      }

      /* Better scrollbar for mobile */
      .sidebar-mobile > div:last-child::-webkit-scrollbar {
        width: 4px;
      }

      .sidebar-mobile > div:last-child::-webkit-scrollbar-track {
        background: transparent;
      }

      .sidebar-mobile > div:last-child::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.5);
        border-radius: 2px;
      }

      .sidebar-mobile > div:last-child::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.7);
      }

      .floor-plan-mobile {
        height: 30vh;
        min-height: 260px;
      }

      .floor-plan-mobile {
        height: 15vh;
        max-height: 15vh;
        min-height: 15vh;
        overflow: auto;
        flex-shrink: 0;
      }
    }

    /* Touch-friendly interactions */
    @media (hover: none) and (pointer: coarse) {
      button, a, input[type="checkbox"] {
        min-height: 44px;
        min-width: 44px;
      }
    }

    .table-item {
      position: absolute;
      transition: background-color 0.2s ease;
      border: 2px solid #000;
      --rotation: 0deg;
      transform: rotate(var(--rotation));
      transform-origin: center;
    }

    .table-item:hover {
      transform: rotate(var(--rotation));
    }

    /* iPad optimization */
    @media (min-width: 768px) and (max-width: 1024px) {
      .table-item {
        transform: scale(0.8) rotate(var(--rotation));
        transform-origin: top left;
      }
      .table-item:hover {
        transform: scale(0.8) rotate(var(--rotation));
      }
    }

    /* Mobile phones */
    @media (max-width: 767px) {
      .table-item {
        transform: scale(0.65) rotate(var(--rotation));
        transform-origin: top left;
      }
      .table-item:hover {
        transform: scale(0.65) rotate(var(--rotation));
      }
    }

    .table-item.cursor-pointer {
      cursor: pointer;
    }

    .table-item.available {
      background: #10b981;
    }

    .table-item.available:hover {
      background: #059669;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.3);
    }

    .table-item.reserved {
      background: #dc2626;
    }

    .table-item.reserved:hover {
      background: #b91c1c;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.3);
    }

    .table-item.not-bookable {
      background: #64748b;
      cursor: default;
    }

    .table-item.not-bookable:hover {
      background: #475569;
    }

    .table-item-label {
      font-weight: 600;
    }

    .table-item-capacity {
      font-size: 0.75rem;
      opacity: 0.85;
      font-weight: 400;
    }

    /* iPad text optimization */
    @media (min-width: 768px) and (max-width: 1024px) {
      .table-item-label {
        font-size: 0.95em;
      }
      .table-item-capacity {
        font-size: 0.8rem;
      }
    }

    /* Mobile text optimization */
    @media (max-width: 767px) {
      .table-item-label {
        font-size: 1.1em;
      }
      .table-item-capacity {
        font-size: 0.85rem;
      }
    }

    .floor-plan-container {
      background: #1e293b;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      cursor: grab;
    }

    .floor-plan-container.pinching {
      overflow: hidden;
      cursor: default;
    }

    .floor-plan-inner {
      position: relative;
      width: 704px;
      height: 397px;
      min-width: 512px;
      margin: 0;
      padding-left: 32px;
      padding-top: 38px;
      transform-origin: top left;
      transition: none;
      will-change: transform;
    }

    .table-item.circle {
      border-radius: 50%;
    }

    .table-item.rounded-xl {
      border-radius: 0.75rem;
    }

    /* iPad and tablets */
    @media (min-width: 768px) and (max-width: 1024px) {
      .floor-plan-inner {
        width: 576px;
        height: 346px;
        min-width: 480px;
        padding-left: 26px;
        padding-top: 32px;
      }
    }

    /* Mobile phones */
    @media (max-width: 767px) {
      .floor-plan-inner {
        width: 360px;
        height: 240px;
        min-width: 300px;
        padding-left: 18px;
        padding-top: 20px;
        margin-top: 8px;
      }

      .floor-plan-container {
        padding: 0.5rem !important;
        margin-top: 0.75rem;
      }
    }

    /* Extra small phones (iPhone SE, etc.) */
    @media (max-width: 400px) {
      .floor-plan-inner {
        width: 320px;
        height: 210px;
        min-width: 280px;
        padding-left: 14px;
        padding-top: 16px;
      }

      .table-item {
        transform: scale(0.55) rotate(var(--rotation));
        transform-origin: top left;
      }

      .table-item:hover {
        transform: scale(0.55) rotate(var(--rotation));
      }

      .table-item-label {
        font-size: 1.2em;
      }

      .table-item-capacity {
        font-size: 0.9rem;
      }
    }

    /* iPad specific optimizations */
    @media (min-width: 768px) and (max-width: 1024px) {
      body {
        -webkit-text-size-adjust: 100%;
      }

      .floor-plan-container {
        scrollbar-width: thin;
      }

      .floor-plan-container::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      .floor-plan-container::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.5);
        border-radius: 4px;
      }

      .floor-plan-container::-webkit-scrollbar-track {
        background: rgba(30, 41, 59, 0.3);
      }

      /* Optimize sidebar text for narrower width */
      h2 {
        font-size: 1.125rem !important;
      }

      .text-sm {
        font-size: 0.8125rem !important;
      }

      .text-xs {
        font-size: 0.6875rem !important;
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    /* Mobile-specific improvements */
    @media (max-width: 767px) {
      /* Navigation improvements */
      nav {
        position: sticky;
        top: 0;
        z-index: 50;
      }

      /* Prevent text overflow in nav */
      nav h1 {
        font-size: 0.875rem !important;
        line-height: 1.2;
      }

      /* Better button spacing on small screens */
      nav button {
        flex-shrink: 0;
      }

      /* Modal improvements for mobile */
      .modal-content {
        max-height: 90dvh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        margin: 0;
        width: 100%;
        max-width: 100vw;
        border-radius: 1rem 1rem 0 0;
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }

      /* Ensure modals are properly centered and scrollable */
      .fixed.inset-0 {
        -webkit-overflow-scrolling: touch;
      }

      /* Better modal spacing on small screens */
      .max-w-md, .max-w-lg, .max-w-xl, .max-w-2xl, .max-w-3xl {
        margin-left: 0.5rem;
        margin-right: 0.5rem;
      }

      /* Make buttons more touch-friendly */
      button {
        min-height: 44px;
        padding-top: 0.75rem;
        padding-bottom: 0.75rem;
      }

      /* Improve text readability */
      body {
        font-size: 16px;
        -webkit-text-size-adjust: 100%;
      }

      /* Better spacing for mobile */
      .p-4 {
        padding: 0.75rem !important;
      }

      .p-6 {
        padding: 1rem !important;
      }

    }

    /* Extra small iPhone improvements (iPhone SE, etc.) */
    @media (max-width: 400px) {
      nav {
        font-size: 14px;
      }

      /* Smaller padding in navigation on tiny screens */
      nav .max-w-full {
        padding-left: 0.375rem;
        padding-right: 0.375rem;
      }

      /* Make room buttons smaller and ensure they don't break layout */
      nav button {
        font-size: 0.7rem !important;
        padding: 0.375rem 0.5rem !important;
      }

      /* Prevent overflow in button container */
      .overflow-x-auto {
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .overflow-x-auto::-webkit-scrollbar {
        display: none;
      }
    }

    /* Landscape orientation on mobile */
    @media (max-width: 767px) and (orientation: landscape) {
      .sidebar-mobile {
        flex: 1 1 auto;
        min-height: 0;
      }

      .sidebar-mobile > div:last-child {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .main-container {
        flex: 1 1 auto;
        min-height: 0;
      }
    }

    /* iPad portrait - use regular mobile calendar view */
    @media (min-width: 768px) and (max-width: 1024px) and (orientation: portrait) {
      .main-container {
        flex-direction: column-reverse;
      }

      .sidebar-mobile {
        max-height: 50vh;
        min-height: 380px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Fixed header on iPad portrait */
      .sidebar-mobile > div:first-child {
        flex-shrink: 0;
        padding: 0.75rem 1rem !important;
      }

      /* Compact calendar on iPad portrait */
      .sidebar-mobile > div:nth-child(2) {
        flex-shrink: 0;
        padding-top: 0.5rem !important;
        padding-bottom: 0.5rem !important;
      }

      .sidebar-mobile > div:nth-child(2) .bg-slate-900\/95 {
        padding: 0.5rem !important;
      }

      /* Give more space to reservations list on iPad portrait */
      .sidebar-mobile > div:last-child {
        flex: 1 1 auto;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        min-height: 200px;
        max-height: calc(100% - 180px);
      }
    }

    /* Standalone mode specific styles */
    .standalone-mode {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }


    .date-selector-clickable {
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .date-selector-clickable:active {
      opacity: 0.8;
    }

    /* Mobile and tablet calendar and reservations layout */
    @media (max-width: 1023px) {
      /* Remove all dark backgrounds from sidebar */
      .sidebar-mobile {
        background: transparent !important;
      }

      /* Make header and calendar transparent */
      .sidebar-mobile > div:first-child,
      .sidebar-mobile > div:nth-child(2) {
        background: transparent !important;
      }

      .reservation-list {
        background: transparent !important;
      }

      .reservation-list > div {
        background: linear-gradient(to bottom, rgb(15 23 42), rgb(15 23 42)) !important;
        padding-top: 1rem;
        border-radius: 1rem 1rem 0 0;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    // Supabase configuration
    const SUPABASE_URL = 'https://qwwerwkekvmaswusvgxy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d2Vyd2tla3ZtYXN3dXN2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzkxOTYsImV4cCI6MjA3OTU1NTE5Nn0.LkNZz4Tl0y8DzI4P3dvZn2-5a4FIjE72kYHbhK5_YvE';

    //  State management
    let state = {
      user: null,
      view: 'login',
      loading: false,
      error: null,
      selectedRoom: null,
      rooms: [],
      tables: [],
      reservations: [],
      calendarMonth: new Date().getMonth(),
      calendarYear: new Date().getFullYear(),
      selectedDate: new Date()
    };

    // Fetch rooms from database
    async function fetchRooms() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/rooms?is_active=eq.true&order=name.asc`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        const rooms = await response.json();
        state.rooms = rooms;

        if (rooms.length > 0 && !state.selectedRoom) {
          state.selectedRoom = rooms[0].id;
        }
      } catch (error) {
        console.error('Error fetching rooms:', error);
      }
    }

    // Fetch tables from database
    async function fetchTables() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/tables?is_active=eq.true&select=*`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        const tables = await response.json();
        state.tables = tables;
      } catch (error) {
        console.error('Error fetching tables:', error);
      }
    }

    // Fetch reservations for selected date
    async function fetchReservations() {
      try {
        const year = state.selectedDate.getFullYear();
        const month = String(state.selectedDate.getMonth() + 1).padStart(2, '0');
        const day = String(state.selectedDate.getDate()).padStart(2, '0');
        const dateStr = `${year}-${month}-${day}`;
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/reservations?reservation_date=eq.${dateStr}&select=*,reservation_tables(*)`,
          {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          }
        );
        const reservations = await response.json();
        state.reservations = reservations;
      } catch (error) {
        console.error('Error fetching reservations:', error);
      }
    }

    // Get booking counts for calendar month
    async function getMonthBookingCounts() {
      try {
        const startDate = new Date(state.calendarYear, state.calendarMonth, 1);
        const endDate = new Date(state.calendarYear, state.calendarMonth + 1, 0);

        const startYear = startDate.getFullYear();
        const startMonth = String(startDate.getMonth() + 1).padStart(2, '0');
        const startDay = String(startDate.getDate()).padStart(2, '0');
        const startDateStr = `${startYear}-${startMonth}-${startDay}`;

        const endYear = endDate.getFullYear();
        const endMonth = String(endDate.getMonth() + 1).padStart(2, '0');
        const endDay = String(endDate.getDate()).padStart(2, '0');
        const endDateStr = `${endYear}-${endMonth}-${endDay}`;

        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/reservations?reservation_date=gte.${startDateStr}&reservation_date=lte.${endDateStr}&select=reservation_date`,
          {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          }
        );
        const reservations = await response.json();

        // Count bookings per day
        const counts = {};
        reservations.forEach(res => {
          const day = new Date(res.reservation_date).getDate();
          counts[day] = (counts[day] || 0) + 1;
        });

        return counts;
      } catch (error) {
        console.error('Error fetching booking counts:', error);
        return {};
      }
    }

    // Change calendar month
    async function changeMonth(direction) {
      state.calendarMonth += direction;

      if (state.calendarMonth > 11) {
        state.calendarMonth = 0;
        state.calendarYear++;
      } else if (state.calendarMonth < 0) {
        state.calendarMonth = 11;
        state.calendarYear--;
      }

      await render();
    }

    // Change day (for mobile daily navigation)
    async function changeDay(direction) {
      const newDate = new Date(state.selectedDate);
      newDate.setDate(newDate.getDate() + direction);

      state.selectedDate = newDate;
      state.calendarMonth = newDate.getMonth();
      state.calendarYear = newDate.getFullYear();

      await fetchReservations();
      await render();
    }

    // Select a date on calendar
    async function selectCalendarDate(year, month, day) {
      state.selectedDate = new Date(year, month, day);
      await fetchReservations();
      await render();
    }

    // Get timeline booking counts for 31-day range
    async function getTimelineBookingCounts() {
      try {
        const centerDate = new Date(state.selectedDate);
        const startDate = new Date(centerDate);
        startDate.setDate(startDate.getDate() - 15);
        const endDate = new Date(centerDate);
        endDate.setDate(endDate.getDate() + 15);

        const startYear = startDate.getFullYear();
        const startMonth = String(startDate.getMonth() + 1).padStart(2, '0');
        const startDay = String(startDate.getDate()).padStart(2, '0');
        const startDateStr = `${startYear}-${startMonth}-${startDay}`;

        const endYear = endDate.getFullYear();
        const endMonth = String(endDate.getMonth() + 1).padStart(2, '0');
        const endDay = String(endDate.getDate()).padStart(2, '0');
        const endDateStr = `${endYear}-${endMonth}-${endDay}`;

        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/reservations?reservation_date=gte.${startDateStr}&reservation_date=lte.${endDateStr}&select=reservation_date`,
          {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          }
        );
        const reservations = await response.json();

        const counts = {};
        reservations.forEach(res => {
          counts[res.reservation_date] = (counts[res.reservation_date] || 0) + 1;
        });

        return counts;
      } catch (error) {
        console.error('Error fetching timeline booking counts:', error);
        return {};
      }
    }

    // Get month label for timeline (shows the center month)
    function getTimelineMonthLabel() {
      const centerDate = state.selectedDate;
      return centerDate.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
    }

    // Render timeline days (15 before + current + 15 after)
    function renderTimelineDays() {
      const timelineCounts = window.timelineBookingCounts || {};
      const centerDate = new Date(state.selectedDate);
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const days = [];

      for (let offset = -15; offset <= 15; offset++) {
        const currentDate = new Date(centerDate);
        currentDate.setDate(currentDate.getDate() + offset);

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const day = currentDate.getDate();

        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

        const isToday = currentDate.getTime() === today.getTime();
        const isSelected = currentDate.getTime() === centerDate.getTime();
        const isOtherMonth = month !== centerDate.getMonth();
        const count = timelineCounts[dateStr] || 0;

        let classes = 'ipad-timeline-day';
        if (isSelected) {
          classes += ' selected';
        } else if (isToday) {
          classes += ' today';
        } else if (isOtherMonth) {
          classes += ' other-month';
        }

        days.push(
          `<div onclick="selectCalendarDate(${year}, ${month}, ${day})" class="${classes}">` +
            `<div class="day-number">${day}</div>` +
            (count > 0 ? `<div class="day-badge">${count}</div>` : '') +
          `</div>`
        );
      }

      return days.join('');
    }

    // Auto-scroll timeline to center selected day
    function scrollTimelineToCenter() {
      setTimeout(() => {
        const container = document.getElementById('timeline-container');
        if (container && container.style.display !== 'none') {
          const selectedDay = container.querySelector('.ipad-timeline-day.selected');
          if (selectedDay) {
            const containerWidth = container.offsetWidth;
            const dayLeft = selectedDay.offsetLeft;
            const dayWidth = selectedDay.offsetWidth;
            const scrollLeft = dayLeft - (containerWidth / 2) + (dayWidth / 2);
            container.scrollTo({ left: scrollLeft, behavior: 'smooth' });
          }
        }
      }, 100);
    }

    // Get shape class based on database shape
    function getShapeClass(shape) {
      switch (shape) {
        case 'circle': return 'circle';
        case 'square': return 'rounded-xl';
        case 'rectangle': return 'rounded-xl';
        case 'halfcircle': return 'rounded-full';
        default: return 'rounded-xl';
      }
    }

    // Convert database table to render format
    function convertTableToRender(table) {
      const reservation = state.reservations.find(res =>
        res.reservation_tables && res.reservation_tables.some(rt => rt.table_id === table.id)
      );
      const isReserved = !!reservation;

      let style = `left: ${table.position_x}px; top: ${table.position_y}px; width: ${table.width}px; height: ${table.height}px;`;

      // Only add border-radius for circle shape, not halfcircle
      if (table.shape === 'circle') {
        style += ' border-radius: 50%;';
      }

      // Add rotation as CSS variable instead of transform to avoid overriding media query scales
      if (table.rotation && table.rotation !== 0) {
        style += ` --rotation: ${table.rotation}deg;`;
      }

      const isStanding = table.table_number.toLowerCase().includes('stehend') ||
                        table.table_number.toLowerCase().includes('bartisch');

      let status = 'available';
      if (!table.is_bookable) {
        status = 'not-bookable';
      } else if (isReserved) {
        status = 'reserved';
      }

      return {
        id: table.id,
        name: table.custom_label || table.table_number,
        capacity: table.capacity,
        status: status,
        style: style,
        shape: table.shape,  // Keep original shape for rendering logic
        shapeClass: getShapeClass(table.shape),
        icon: isStanding,
        isBookable: table.is_bookable,
        customerName: reservation ? reservation.customer_name : null,
        reservationId: reservation ? reservation.id : null,
        rotation: table.rotation || 0
      };
    }

    // Get tables for selected room
    function getRoomTables() {
      if (!state.selectedRoom || !state.tables.length) return [];
      return state.tables
        .filter(table => table.room_id === state.selectedRoom)
        .map(convertTableToRender);
    }

    // Get room name by ID
    function getRoomName(roomId) {
      const room = state.rooms.find(r => r.id === roomId);
      return room ? room.name : '';
    }

    // Get reservations filtered by selected room
    function getFilteredReservations() {
      if (!state.selectedRoom) {
        return state.reservations;
      }

      return state.reservations.filter(reservation => {
        if (!reservation.reservation_tables || reservation.reservation_tables.length === 0) {
          return false;
        }

        // Check if any of the reservation's tables belong to the selected room
        return reservation.reservation_tables.some(resTable => {
          const table = state.tables.find(t => t.id === resTable.table_id);
          return table && table.room_id === state.selectedRoom;
        });
      });
    }

    // Check for saved session
    const savedUser = localStorage.getItem('crew_user');
    const savedToken = localStorage.getItem('crew_token');
    if (savedUser && savedToken) {
      try {
        state.user = JSON.parse(savedUser);
        state.view = 'dashboard';
        (async () => {
          await fetchRooms();
          await fetchTables();
          await fetchReservations();
          await render();
        })();
      } catch (e) {
        localStorage.removeItem('crew_user');
        localStorage.removeItem('crew_token');
      }
    }

    // Crew login function
    async function crewLogin(username, password) {
      state.loading = true;
      state.error = null;
      await render();

      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/crew-login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Anmeldung fehlgeschlagen');
        }

        if (data.success) {
          state.user = data.user;
          state.view = 'dashboard';
          localStorage.setItem('crew_user', JSON.stringify(data.user));
          localStorage.setItem('crew_token', data.token);

          await fetchRooms();
          await fetchTables();
          await fetchReservations();
          if (window._startAutoRefresh) window._startAutoRefresh();
        }
      } catch (err) {
        state.error = err.message;
      } finally {
        state.loading = false;
        await render();
      }
    }

    // Main render function
    async function render() {
      const app = document.getElementById('app');
      if (state.view === 'login') {
        app.innerHTML = renderLogin();
      } else {
        app.innerHTML = await renderDashboard();
        scrollTimelineToCenter();
        if (window.initFloorPlanZoom) window.initFloorPlanZoom();
      }
    }

    // Event handlers
    window.handleLogin = function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      crewLogin(username, password);
    };

    window.handleLogout = async function() {
      await logout();
    };

    window.handleRoomSwitch = async function(roomId) {
      await switchRoom(roomId);
    };

    // Handle table click
    window.handleTableClick = function(tableId, reservationId, isBookable) {
      if (!isBookable) {
        return; // Don't open modal for non-bookable tables
      }

      if (reservationId) {
        // Table is reserved, open edit modal
        openEditReservationModal(reservationId);
      } else {
        // Table is available, open reservation modal
        openReservationModal();
      }
    };

    // Calendar functions
    window.changeMonth = async function(direction) {
      await changeMonth(direction);
    };

    window.changeDay = async function(direction) {
      await changeDay(direction);
    };

    window.selectCalendarDate = async function(year, month, day) {
      await selectCalendarDate(year, month, day);
    };


    // Gift Card Modal Functions
    let currentGiftCard = null;

    window.openGiftCardModal = function() {
      const modal = document.getElementById('giftCardModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => {
        document.getElementById('giftCardCode').focus();
      }, 100);
    };

    window.closeGiftCardModal = function() {
      const modal = document.getElementById('giftCardModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      resetGiftCardModal();
    };


    window.resetGiftCardModal = function() {
      document.getElementById('giftCardCode').value = '';
      document.getElementById('giftCardResult').classList.add('hidden');
      document.getElementById('validGiftCard').classList.add('hidden');
      document.getElementById('invalidGiftCard').classList.add('hidden');
      document.getElementById('successMessage').classList.add('hidden');
      document.getElementById('giftCardLoading').classList.add('hidden');
      currentGiftCard = null;
    };

    window.handleGiftCardKeyPress = function(event) {
      if (event.key === 'Enter') {
        verifyGiftCard();
      }
    };

    window.verifyGiftCard = async function() {
      const code = document.getElementById('giftCardCode').value.trim();

      if (!code) {
        alert('Bitte geben Sie einen Gutschein Code ein');
        return;
      }

      // Check authentication
      const token = localStorage.getItem('crew_token');
      if (!token) {
        alert('Nicht angemeldet. Bitte melden Sie sich erneut an.');
        return;
      }

      // Show loading
      document.getElementById('giftCardResult').classList.add('hidden');
      document.getElementById('giftCardLoading').classList.remove('hidden');
      document.getElementById('verifyButton').disabled = true;

      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/crew-verify-gift-card`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ code: code.toUpperCase() })
        });

        const data = await response.json();

        console.log('Verify response:', data);

        // Hide loading
        document.getElementById('giftCardLoading').classList.add('hidden');
        document.getElementById('giftCardResult').classList.remove('hidden');

        if (data.valid) {
          // Show valid gift card
          currentGiftCard = data.giftCard;
          document.getElementById('validGiftCard').classList.remove('hidden');
          document.getElementById('invalidGiftCard').classList.add('hidden');

          // Populate data
          document.getElementById('gcCode').textContent = data.giftCard.code;
          document.getElementById('gcRecipient').textContent = data.giftCard.recipient_name || 'Nicht angegeben';
          document.getElementById('gcAmount').textContent = `€${parseFloat(data.giftCard.original_amount).toFixed(2)}`;

          const expiryDate = new Date(data.giftCard.expiry_date);
          document.getElementById('gcExpiry').textContent = expiryDate.toLocaleDateString('de-DE');
        } else {
          // Show invalid gift card
          console.error('Verification failed:', data.message || data.error);
          currentGiftCard = null;
          document.getElementById('validGiftCard').classList.add('hidden');
          document.getElementById('invalidGiftCard').classList.remove('hidden');

          document.getElementById('gcErrorMessage').textContent = data.message || data.error || 'Ungültiger Gutschein Code';

          // Show details if available
          if (data.giftCard) {
            document.getElementById('gcDetails').classList.remove('hidden');
            document.getElementById('gcCodeInvalid').textContent = data.giftCard.code;

            let statusText = data.giftCard.status;
            if (statusText === 'used') statusText = 'Eingelöst';
            else if (statusText === 'expired') statusText = 'Abgelaufen';
            else if (statusText === 'cancelled') statusText = 'Storniert';
            document.getElementById('gcStatus').textContent = statusText;

            // Show redeemed info if available
            if (data.giftCard.is_redeemed && data.giftCard.redeemed_at) {
              document.getElementById('gcRedeemedInfo').classList.remove('hidden');
              const redeemedDate = new Date(data.giftCard.redeemed_at);
              document.getElementById('gcRedeemedAt').textContent = redeemedDate.toLocaleString('de-DE');
              document.getElementById('gcRedeemedBy').textContent = data.giftCard.redeemed_by || 'Unbekannt';
            } else {
              document.getElementById('gcRedeemedInfo').classList.add('hidden');
            }
          } else {
            document.getElementById('gcDetails').classList.add('hidden');
          }
        }
      } catch (error) {
        console.error('Error verifying gift card:', error);
        document.getElementById('giftCardLoading').classList.add('hidden');
        document.getElementById('giftCardResult').classList.remove('hidden');
        document.getElementById('validGiftCard').classList.add('hidden');
        document.getElementById('invalidGiftCard').classList.remove('hidden');
        document.getElementById('gcErrorMessage').textContent = 'Fehler beim Prüfen des Gutscheins. Bitte versuchen Sie es erneut.';
        document.getElementById('gcDetails').classList.add('hidden');
      } finally {
        document.getElementById('verifyButton').disabled = false;
      }
    };

    window.redeemGiftCard = async function() {
      if (!currentGiftCard) {
        alert('Kein Gutschein ausgewählt');
        return;
      }

      // Check authentication
      const token = localStorage.getItem('crew_token');
      if (!token) {
        alert('Nicht angemeldet. Bitte melden Sie sich erneut an.');
        return;
      }

      // Confirmation dialog
      const confirmRedeem = confirm(`Möchten Sie den Gutschein über €${parseFloat(currentGiftCard.original_amount).toFixed(2)} wirklich einlösen?`);
      if (!confirmRedeem) {
        return;
      }

      // Show loading
      document.getElementById('giftCardResult').classList.add('hidden');
      document.getElementById('giftCardLoading').classList.remove('hidden');
      document.getElementById('redeemButton').disabled = true;

      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/crew-redeem-gift-card`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            code: currentGiftCard.code,
            redeemed_by: state.user ? state.user.name : 'Crew'
          })
        });

        const data = await response.json();

        console.log('Redeem response:', data);

        // Hide loading
        document.getElementById('giftCardLoading').classList.add('hidden');
        document.getElementById('giftCardResult').classList.remove('hidden');

        if (data.success) {
          // Show success message
          document.getElementById('validGiftCard').classList.add('hidden');
          document.getElementById('invalidGiftCard').classList.add('hidden');
          document.getElementById('successMessage').classList.remove('hidden');

          document.getElementById('gcCodeSuccess').textContent = data.giftCard.code;
          document.getElementById('gcAmountSuccess').textContent = `€${parseFloat(data.giftCard.original_amount).toFixed(2)}`;
        } else {
          // Show error
          console.error('Redemption failed:', data.message || data.error);
          document.getElementById('validGiftCard').classList.add('hidden');
          document.getElementById('invalidGiftCard').classList.remove('hidden');
          document.getElementById('successMessage').classList.add('hidden');
          document.getElementById('gcErrorMessage').textContent = data.message || data.error || 'Fehler beim Einlösen des Gutscheins';
          document.getElementById('gcDetails').classList.add('hidden');
        }
      } catch (error) {
        console.error('Error redeeming gift card:', error);
        document.getElementById('giftCardLoading').classList.add('hidden');
        document.getElementById('giftCardResult').classList.remove('hidden');
        document.getElementById('validGiftCard').classList.add('hidden');
        document.getElementById('invalidGiftCard').classList.remove('hidden');
        document.getElementById('successMessage').classList.add('hidden');
        document.getElementById('gcErrorMessage').textContent = 'Fehler beim Einlösen des Gutscheins. Bitte versuchen Sie es erneut.';
        document.getElementById('gcDetails').classList.add('hidden');
      } finally {
        document.getElementById('redeemButton').disabled = false;
      }
    };

    // Reservation Modal Functions
    let resSelectedTables = [];
    let resSelectedDays = [];
    let resBookingMethod = 'free';
    let resPaidWithCash = false;
    let resDayAmounts = {};
    let resTableRoomFilter = null;
    let resAllTables = [];
    let resEditMode = false;
    let resEditReservation = null;

    function formatDateLocal(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    window.openReservationModal = async function(reservationId = null) {
      const modal = document.getElementById('reservationModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      // Ensure form is visible and messages are hidden
      document.getElementById('reservationSuccess').classList.add('hidden');
      document.getElementById('reservationError').classList.add('hidden');
      document.getElementById('reservationLoading').classList.add('hidden');
      document.getElementById('reservationButtons').classList.remove('hidden');

      // Show all form sections except message areas
      const formSections = document.querySelectorAll('#reservationForm > div:not(#reservationSuccess):not(#reservationError):not(#reservationLoading):not(#reservationButtons)');
      formSections.forEach(section => section.classList.remove('hidden'));

      // Determine if we're editing or creating
      resEditMode = !!reservationId;
      resEditReservation = reservationId ? state.reservations.find(r => r.id === reservationId) : null;

      // Update modal UI based on mode
      if (resEditMode && resEditReservation) {
        // Edit mode
        document.getElementById('reservationModalTitleText').textContent = 'Reservierung bearbeiten';
        document.getElementById('reservationModalIcon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>';
        document.getElementById('submitReservationBtn').textContent = 'Änderungen speichern';
        document.getElementById('submitReservationBtn').className = 'flex-1 px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition min-h-[44px]';

        // Show delete button for non-online bookings
        const isOnlineBooking = resEditReservation.booking_method === 'stripe' ||
                               resEditReservation.payment_method === 'stripe' ||
                               resEditReservation.stripe_payment_intent_id;
        if (!isOnlineBooking) {
          document.getElementById('deleteReservationBtn').classList.remove('hidden');
        } else {
          document.getElementById('deleteReservationBtn').classList.add('hidden');
        }
      } else {
        // Create mode
        document.getElementById('reservationModalTitleText').textContent = 'Neue Reservierung';
        document.getElementById('reservationModalIcon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>';
        document.getElementById('submitReservationBtn').textContent = 'Reservierung erstellen';
        document.getElementById('submitReservationBtn').className = 'flex-1 px-4 py-3 bg-green-600 hover:bg-green-700 text-white font-medium rounded-lg transition min-h-[44px]';
        document.getElementById('deleteReservationBtn').classList.add('hidden');
      }

      // Reset or populate state
      resSelectedTables = [];
      resSelectedDays = [];
      resDayAmounts = {};

      if (resEditMode && resEditReservation) {
        // Populate form with existing data
        document.getElementById('resId').value = resEditReservation.id;
        document.getElementById('resCustomerName').value = resEditReservation.customer_name || '';
        document.getElementById('resCustomerEmail').value = resEditReservation.customer_email || '';
        document.getElementById('resCustomerPhone').value = resEditReservation.customer_phone || '';
        document.getElementById('resPartySize').value = resEditReservation.party_size || 2;
        document.getElementById('resDate').value = resEditReservation.reservation_date || '';
        document.getElementById('resTime').value = resEditReservation.reservation_time || '';
        document.getElementById('resSpecialRequests').value = resEditReservation.special_requests || '';

        // Populate selected tables from the reservation
        if (resEditReservation.reservation_tables && Array.isArray(resEditReservation.reservation_tables)) {
          resSelectedTables = resEditReservation.reservation_tables.map(rt => rt.table_id);
        }

        resBookingMethod = resEditReservation.booking_method || 'free';
        resPaidWithCash = resEditReservation.payment_method === 'cash';

        // Handle payment options section
        const isOnlineBooking = resEditReservation.booking_method === 'stripe' ||
                               resEditReservation.payment_method === 'stripe' ||
                               resEditReservation.stripe_payment_intent_id;

        if (isOnlineBooking) {
          document.getElementById('paymentOptions').closest('.space-y-3').classList.add('hidden');
        } else {
          document.getElementById('paymentOptions').closest('.space-y-3').classList.remove('hidden');

          // Set payment method buttons
          if (resBookingMethod === 'free') {
            document.getElementById('bookingMethodFree').className = 'px-3 py-3 rounded-lg text-sm font-medium transition bg-blue-600 text-white min-h-[44px]';
            document.getElementById('bookingMethodManual').className = 'px-3 py-3 rounded-lg text-sm font-medium transition bg-slate-800 text-slate-300 hover:bg-slate-700 min-h-[44px]';
            document.getElementById('paymentOptions').classList.add('hidden');
          } else {
            document.getElementById('bookingMethodFree').className = 'px-3 py-3 rounded-lg text-sm font-medium transition bg-slate-800 text-slate-300 hover:bg-slate-700 min-h-[44px]';
            document.getElementById('bookingMethodManual').className = 'px-3 py-3 rounded-lg text-sm font-medium transition bg-blue-600 text-white min-h-[44px]';
            document.getElementById('paymentOptions').classList.remove('hidden');
          }

          // Set cash payment state
          document.getElementById('paidWithCash').checked = resPaidWithCash;
          if (resPaidWithCash) {
            document.getElementById('cashAmountSection').classList.remove('hidden');
            document.getElementById('cashAmount').value = resEditReservation.payment_amount || 0;
          } else {
            document.getElementById('cashAmountSection').classList.add('hidden');
          }
        }
      } else {
        // Reset for new reservation
        document.getElementById('resId').value = '';
        document.getElementById('resCustomerName').value = '';
        document.getElementById('resCustomerEmail').value = '';
        document.getElementById('resCustomerPhone').value = '';
        document.getElementById('resPartySize').value = '2';
        document.getElementById('resSpecialRequests').value = '';
        resBookingMethod = 'free';
        resPaidWithCash = false;

        // Set today's date as minimum, use selected calendar date as default
        const today = formatDateLocal(new Date());
        document.getElementById('resDate').min = today;
        document.getElementById('resDate').value = formatDateLocal(state.selectedDate);
        document.getElementById('resTime').value = '15:45';

        document.getElementById('paymentOptions').closest('.space-y-3').classList.remove('hidden');
      }

      // Load rooms into dropdown
      const roomSelect = document.getElementById('resRoom');
      roomSelect.innerHTML = '<option value="">Bitte wählen...</option>';
      state.rooms.forEach(room => {
        const option = document.createElement('option');
        option.value = room.id;
        option.textContent = room.name;
        if (resEditMode && resEditReservation) {
          // For edit mode, select the room of the reservation
          if (resEditReservation.reservation_tables && resEditReservation.reservation_tables.length > 0) {
            const firstTable = state.tables.find(t => t.id === resEditReservation.reservation_tables[0].table_id);
            if (firstTable && firstTable.room_id === room.id) {
              option.selected = true;
            }
          }
        } else if (room.id === state.selectedRoom) {
          option.selected = true;
        }
        roomSelect.appendChild(option);
      });

      // Handle room selection change
      roomSelect.onchange = (e) => {
        const selectedRoomId = e.target.value;
        if (selectedRoomId) {
          resTableRoomFilter = selectedRoomId;
          setupRoomFilterButtons();
          updateTablesDisplay();
        }
      };

      // Load all tables
      await loadAllTablesForReservation();

      // If editing and has tables, set the room filter to the first table's room
      if (resEditMode && resEditReservation && resSelectedTables.length > 0) {
        const firstTable = state.tables.find(t => t.id === resSelectedTables[0]);
        if (firstTable) {
          resTableRoomFilter = firstTable.room_id;
        }
      }

      // Setup room filter buttons
      setupRoomFilterButtons();

      // Update tables display to show selected tables
      updateTablesDisplay();
      updateSelectedTablesInfo();

      // Setup event listeners
      setupReservationEventListeners();

      // Set up form submission
      const form = document.getElementById('reservationForm');
      form.onsubmit = handleReservationSubmit;
    };

    async function loadAllTablesForReservation() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/tables?select=*&order=table_number`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        const data = await response.json();
        resAllTables = data || [];

        if (state.rooms.length > 0 && !resTableRoomFilter) {
          resTableRoomFilter = state.rooms[0].id;
        }
        updateTablesDisplay();
      } catch (error) {
        console.error('Error loading tables:', error);
      }
    }

    function setupRoomFilterButtons() {
      const buttonsContainer = document.getElementById('roomFilterButtons');
      buttonsContainer.innerHTML = '';

      state.rooms.forEach(room => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = room.name;
        button.className = `px-3 py-1.5 rounded-lg text-xs font-medium transition ${
          resTableRoomFilter === room.id
            ? 'bg-blue-600 text-white'
            : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
        }`;
        button.onclick = () => {
          resTableRoomFilter = room.id;
          setupRoomFilterButtons();
          updateTablesDisplay();
        };
        buttonsContainer.appendChild(button);
      });
    }

    function getReservedTablesForDateTime(date, time) {
      // Get reservations for the selected date/time
      const reservedTableIds = new Set();

      // Normalize time format to HH:MM (remove seconds if present)
      const normalizeTime = (t) => t.slice(0, 5);
      const normalizedInputTime = normalizeTime(time);

      state.reservations.forEach(res => {
        // Skip the current reservation being edited
        if (resEditMode && resEditReservation && res.id === resEditReservation.id) {
          return;
        }

        // Normalize the reservation time for comparison
        const normalizedResTime = normalizeTime(res.reservation_time);

        // Check if reservation matches the date and time
        if (res.reservation_date === date && normalizedResTime === normalizedInputTime && res.status !== 'cancelled') {
          if (res.reservation_tables && Array.isArray(res.reservation_tables)) {
            res.reservation_tables.forEach(rt => {
              reservedTableIds.add(rt.table_id);
            });
          }
        }
      });

      return reservedTableIds;
    }

    function updateTablesDisplay() {
      const grid = document.getElementById('tablesGrid');
      const filteredTables = resAllTables.filter(t => t.capacity > 0 && t.room_id === resTableRoomFilter && t.is_bookable !== false);

      if (filteredTables.length === 0) {
        grid.innerHTML = '<p class="text-sm text-slate-500 col-span-5">Keine Tische verfügbar</p>';
        return;
      }

      // Get selected date and time to check for reserved tables
      const selectedDate = document.getElementById('resDate')?.value;
      const selectedTime = document.getElementById('resTime')?.value;
      const reservedTables = (selectedDate && selectedTime)
        ? getReservedTablesForDateTime(selectedDate, selectedTime)
        : new Set();

      grid.innerHTML = '';
      filteredTables.sort((a, b) => {
        const numA = parseInt(a.table_number) || 0;
        const numB = parseInt(b.table_number) || 0;
        return numA - numB;
      }).forEach(table => {
        const isSelected = resSelectedTables.includes(table.id);
        const isReserved = reservedTables.has(table.id);
        const button = document.createElement('button');
        button.type = 'button';

        // Different styling for reserved, selected, or available tables
        let buttonClass = '';
        if (isReserved) {
          buttonClass = 'bg-red-900 border-red-600 text-red-200 cursor-not-allowed opacity-75';
        } else if (isSelected) {
          buttonClass = 'bg-blue-600 border-blue-400 text-white shadow-lg';
        } else {
          buttonClass = 'bg-slate-800 border-slate-600 text-slate-300 hover:bg-slate-700 hover:border-slate-500';
        }

        button.className = `p-2 rounded-lg border-2 transition-all ${buttonClass}`;
        button.innerHTML = `
          <div class="text-center">
            <div class="text-sm font-bold">${table.table_number || table.custom_label || `T${table.id.slice(0,4)}`}</div>
            <div class="text-[10px] opacity-80">${table.capacity}p</div>
            ${isReserved ? '<div class="text-[9px] font-semibold mt-0.5">Reserviert</div>' : ''}
          </div>
        `;

        button.onclick = () => {
          // Prevent clicking reserved tables
          if (isReserved) {
            return;
          }

          if (isSelected) {
            resSelectedTables = resSelectedTables.filter(id => id !== table.id);
          } else {
            resSelectedTables.push(table.id);
          }
          updateTablesDisplay();
          updateSelectedTablesInfo();
        };

        // Disable button if table is reserved
        if (isReserved) {
          button.disabled = true;
        }

        grid.appendChild(button);
      });
    }

    function updateSelectedTablesInfo() {
      const info = document.getElementById('selectedTablesInfo');
      const count = document.getElementById('selectedTablesCount');
      count.textContent = resSelectedTables.length;
      if (resSelectedTables.length > 0) {
        info.classList.remove('hidden');
      } else {
        info.classList.add('hidden');
      }
    }

    function setupReservationEventListeners() {
      // Multiple days checkbox
      document.getElementById('multipleDays').onchange = (e) => {
        const selector = document.getElementById('daysSelector');
        if (e.target.checked) {
          selector.classList.remove('hidden');
          updateDaysGrid();
        } else {
          selector.classList.add('hidden');
          resSelectedDays = [];
          resDayAmounts = {};
          updateSelectedDaysInfo();
          updatePaymentAmountsSection();
        }
      };

      // Date change - update days grid and tables display
      document.getElementById('resDate').onchange = () => {
        if (document.getElementById('multipleDays').checked) {
          updateDaysGrid();
        }
        updateTablesDisplay();
      };

      // Time change - update tables display
      document.getElementById('resTime').onchange = () => {
        updateTablesDisplay();
      };

      // Booking method buttons
      document.getElementById('bookingMethodFree').onclick = () => {
        resBookingMethod = 'free';
        resPaidWithCash = false;
        document.getElementById('bookingMethodFree').className = 'px-3 py-3 rounded-lg text-sm font-medium transition bg-blue-600 text-white min-h-[44px]';
        document.getElementById('bookingMethodManual').className = 'px-3 py-3 rounded-lg text-sm font-medium transition bg-slate-800 text-slate-300 hover:bg-slate-700 min-h-[44px]';
        document.getElementById('paymentOptions').classList.add('hidden');
        document.getElementById('paidWithCash').checked = false;
        document.getElementById('cashAmountSection').classList.add('hidden');
      };

      document.getElementById('bookingMethodManual').onclick = () => {
        resBookingMethod = 'manual';
        document.getElementById('bookingMethodFree').className = 'px-3 py-3 rounded-lg text-sm font-medium transition bg-slate-800 text-slate-300 hover:bg-slate-700 min-h-[44px]';
        document.getElementById('bookingMethodManual').className = 'px-3 py-3 rounded-lg text-sm font-medium transition bg-blue-600 text-white min-h-[44px]';
        document.getElementById('paymentOptions').classList.remove('hidden');
      };

      // Cash payment checkbox
      document.getElementById('paidWithCash').onchange = (e) => {
        resPaidWithCash = e.target.checked;
        const section = document.getElementById('cashAmountSection');
        if (e.target.checked) {
          section.classList.remove('hidden');
          updatePaymentAmountsSection();
        } else {
          section.classList.add('hidden');
          document.getElementById('cashAmount').value = '0';
          resDayAmounts = {};
        }
      };
    }

    function updatePaymentAmountsSection() {
      if (!resPaidWithCash) return;

      const mainDate = document.getElementById('resDate').value;
      const isMultiDay = document.getElementById('multipleDays').checked && resSelectedDays.length > 0;

      const singleWrapper = document.getElementById('singleDayAmountWrapper');
      const perDayWrapper = document.getElementById('perDayAmountsWrapper');
      const perDayList = document.getElementById('perDayAmountsList');

      if (isMultiDay) {
        singleWrapper.classList.add('hidden');
        perDayWrapper.classList.remove('hidden');

        const allDates = [mainDate, ...resSelectedDays].filter(Boolean);
        allDates.sort();

        perDayList.innerHTML = '';
        allDates.forEach(dateStr => {
          const [y, m, d] = dateStr.split('-').map(Number);
          const dateObj = new Date(y, m - 1, d);
          const label = dateObj.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
          const isMain = dateStr === mainDate;
          const currentVal = resDayAmounts[dateStr] !== undefined ? resDayAmounts[dateStr] : 0;

          const row = document.createElement('div');
          row.className = 'flex items-center gap-3';
          row.innerHTML = `
            <span class="text-sm text-slate-300 flex-1">${label}${isMain ? ' <span class="text-green-400 text-xs">(Haupttag)</span>' : ''}</span>
            <input
              type="number"
              min="0"
              step="0.01"
              value="${currentVal}"
              data-date="${dateStr}"
              class="w-28 px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-green-500 focus:border-transparent text-sm text-right"
              placeholder="0.00"
            />
            <span class="text-slate-400 text-sm">€</span>
          `;

          const input = row.querySelector('input');
          input.addEventListener('input', (e) => {
            resDayAmounts[dateStr] = parseFloat(e.target.value) || 0;
          });

          perDayList.appendChild(row);
        });
      } else {
        singleWrapper.classList.remove('hidden');
        perDayWrapper.classList.add('hidden');
      }
    }

    function updateDaysGrid() {
      const grid = document.getElementById('daysGrid');
      const resDate = document.getElementById('resDate').value;
      if (!resDate) return;

      // Parse date string as local date to avoid timezone issues
      const [year, month, day] = resDate.split('-').map(Number);
      const startDate = new Date(year, month - 1, day);
      const currentDate = new Date(startDate);
      currentDate.setDate(currentDate.getDate() - 7);

      grid.innerHTML = '';
      for (let i = 0; i < 38; i++) {
        const dateStr = formatDateLocal(currentDate);
        const isSelected = resSelectedDays.includes(dateStr);
        const isOriginalDate = dateStr === resDate;
        const dayOfWeek = currentDate.toLocaleDateString('en-US', { weekday: 'short' });
        const dayOfMonth = currentDate.getDate();

        const button = document.createElement('button');
        button.type = 'button';
        button.className = `p-2 rounded-lg text-sm transition-colors min-w-[60px] ${
          isOriginalDate
            ? 'bg-green-600 text-white cursor-default'
            : isSelected
            ? 'bg-blue-600 text-white'
            : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
        }`;
        button.innerHTML = `
          <div class="font-medium text-xs">${dayOfWeek}</div>
          <div class="text-sm font-bold">${dayOfMonth}</div>
          ${isOriginalDate ? '<div class="text-xs mt-1">●</div>' : ''}
        `;

        if (!isOriginalDate) {
          button.onclick = () => {
            if (isSelected) {
              resSelectedDays = resSelectedDays.filter(d => d !== dateStr);
              delete resDayAmounts[dateStr];
            } else {
              resSelectedDays.push(dateStr);
              resSelectedDays.sort();
            }
            updateDaysGrid();
            updateSelectedDaysInfo();
            updatePaymentAmountsSection();
          };
        }

        grid.appendChild(button);
        currentDate.setDate(currentDate.getDate() + 1);
      }
    }

    function updateSelectedDaysInfo() {
      const info = document.getElementById('selectedDaysInfo');
      const count = document.getElementById('selectedDaysCount');
      count.textContent = resSelectedDays.length;
      if (resSelectedDays.length > 0) {
        info.classList.remove('hidden');
      } else {
        info.classList.add('hidden');
      }
    }
