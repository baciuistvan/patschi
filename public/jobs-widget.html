<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offene Stellen | Karriere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --charcoal: #1e1e1e;
      --charcoal-light: #2e2e2e;
      --charcoal-mid: #3a3a3a;
      --warm-white: #f7f3ee;
      --warm-cream: #ede8e0;
      --warm-border: #d4cec4;
      --amber: #b8924a;
      --amber-light: #d4aa6a;
      --amber-pale: #f5eddc;
      --text-primary: #1e1e1e;
      --text-secondary: #5a5550;
      --text-muted: #9a948e;
      --success: #4a7c59;
      --success-pale: #eaf2ed;
      --error: #8b2e2e;
      --error-pale: #fdf0f0;
      --shadow: 6px 6px 9px rgba(0,0,0,0.12);
      --shadow-soft: 0 2px 8px rgba(0,0,0,0.08);
      --radius: 4px;
      --radius-lg: 8px;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      background: transparent;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    #jobs-widget-root {
      max-width: 100%;
      margin: 0 auto;
    }

    @media (min-width: 640px) {
      body { padding: 24px; }
      #jobs-widget-root { max-width: 700px; }
    }

    @media (min-width: 768px) {
      #jobs-widget-root { max-width: 760px; }
    }

    .pw-widget {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .pw-header {
      background: var(--charcoal);
      padding: 28px 32px 24px;
      position: relative;
    }

    .pw-header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .pw-title {
      font-family: 'Cardo', Georgia, serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--warm-white);
      letter-spacing: 0.01em;
      line-height: 1.2;
    }

    .pw-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: #9a948e;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .pw-count-badge {
      background: rgba(184,146,74,0.18);
      border: 1px solid rgba(184,146,74,0.35);
      color: var(--amber-light);
      padding: 4px 14px;
      border-radius: 9999px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      white-space: nowrap;
      margin-top: 2px;
    }

    .pw-body {
      padding: 24px 28px 28px;
    }

    @media (max-width: 480px) {
      .pw-header { padding: 22px 20px 18px; }
      .pw-body { padding: 18px 16px 24px; }
    }

    .pw-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 24px;
      gap: 14px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .pw-spinner {
      width: 32px;
      height: 32px;
      border: 2.5px solid var(--warm-border);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .pw-empty {
      text-align: center;
      padding: 48px 24px;
    }

    .pw-empty-icon {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-lg);
      background: var(--amber-pale);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      color: var(--amber);
    }

    .pw-empty h3 {
      font-family: 'Cardo', Georgia, serif;
      font-size: 19px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .pw-empty p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .pw-jobs-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pw-job-card {
      border: 1px solid var(--warm-border);
      border-radius: var(--radius-lg);
      background: white;
      overflow: hidden;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .pw-job-card:hover {
      box-shadow: var(--shadow-soft);
      border-color: var(--amber-light);
    }

    .pw-job-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 18px 20px 16px;
      cursor: pointer;
      user-select: none;
    }

    .pw-job-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius);
      background: var(--amber-pale);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      color: var(--amber);
    }

    .pw-job-main { flex: 1; min-width: 0; }

    .pw-job-title-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 5px;
    }

    .pw-job-title {
      font-family: 'Cardo', Georgia, serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .pw-job-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
      margin-top: 3px;
      font-family: 'Inter', sans-serif;
    }

    .badge-vollzeit   { background: var(--amber-pale); color: #7a5c20; border: 1px solid #e8d5a8; }
    .badge-teilzeit   { background: #e8f0f8; color: #2c5282; border: 1px solid #b8d0e8; }
    .badge-minijob    { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
    .badge-aushilfe   { background: #fef9f0; color: #7a4010; border: 1px solid #f5d9a8; }
    .badge-praktikum  { background: var(--success-pale); color: #2d6045; border: 1px solid #a8d5b8; }
    .badge-ausbildung { background: #f0f8f0; color: #1a5c2a; border: 1px solid #9fd4a8; }
    .badge-default    { background: var(--warm-cream); color: var(--text-secondary); border: 1px solid var(--warm-border); }

    .pw-job-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 13px;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
    }

    .pw-job-meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .pw-job-meta-item svg { opacity: 0.7; flex-shrink: 0; }

    .pw-job-toggle {
      width: 30px;
      height: 30px;
      border-radius: var(--radius);
      border: 1px solid var(--warm-border);
      background: var(--warm-white);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
      color: var(--text-muted);
    }

    .pw-job-toggle:hover {
      background: var(--amber-pale);
      border-color: var(--amber-light);
      color: var(--amber);
    }

    .pw-job-toggle.open {
      background: var(--amber-pale);
      border-color: var(--amber-light);
      color: var(--amber);
    }

    .pw-job-toggle svg { transition: transform 0.25s ease; }
    .pw-job-toggle.open svg { transform: rotate(180deg); }

    .pw-job-details {
      display: none;
      border-top: 1px solid var(--warm-border);
      padding: 18px 20px 20px;
      background: var(--warm-white);
    }

    .pw-job-details.open {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pw-detail-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    @media (min-width: 560px) {
      .pw-detail-grid { grid-template-columns: 1fr 1fr; }
    }

    .pw-detail-section h4 {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 7px;
      font-family: 'Inter', sans-serif;
    }

    .pw-detail-section p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
      white-space: pre-line;
      font-family: 'Inter', sans-serif;
    }

    .pw-apply-section {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--warm-border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .pw-apply-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 22px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      transition: all 0.15s ease;
      cursor: pointer;
      border: none;
      letter-spacing: 0.02em;
    }

    .pw-apply-btn-primary {
      background: var(--charcoal);
      color: var(--warm-white);
      box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
    }

    .pw-apply-btn-primary:hover {
      background: var(--charcoal-mid);
      box-shadow: 3px 3px 10px rgba(0,0,0,0.2);
      transform: translateY(-1px);
    }

    .pw-apply-btn-secondary {
      background: white;
      color: var(--amber);
      border: 1.5px solid var(--amber-light);
    }

    .pw-apply-btn-secondary:hover {
      background: var(--amber-pale);
    }

    .pw-error {
      border: 1px solid #e8c8c8;
      background: var(--error-pale);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 14px;
      color: var(--error);
      font-family: 'Inter', sans-serif;
    }

    .pw-error svg { flex-shrink: 0; margin-top: 1px; }
  </style>
</head>
<body>
  <div id="jobs-widget-root">
    <div class="pw-widget">
      <div class="pw-header">
        <div class="pw-header-top">
          <div>
            <div class="pw-subtitle">Karriere</div>
            <div class="pw-title">Offene Stellen</div>
          </div>
          <div class="pw-count-badge" id="count-badge" style="display:none;"></div>
        </div>
      </div>
      <div class="pw-body" id="app">
        <div class="pw-loading" id="loading">
          <div class="pw-spinner"></div>
          <span>Stellen werden geladen&hellip;</span>
        </div>
        <div id="content" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://qwwerwkekvmaswusvgxy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d2Vyd2tla3ZtYXN3dXN2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzkxOTYsImV4cCI6MjA3OTU1NTE5Nn0.LkNZz4Tl0y8DzI4P3dvZn2-5a4FIjE72kYHbhK5_YvE';

    const openCards = new Set();

    function badgeClass(type) {
      const map = {
        'vollzeit': 'badge-vollzeit',
        'teilzeit': 'badge-teilzeit',
        'minijob': 'badge-minijob',
        'aushilfe': 'badge-aushilfe',
        'praktikum': 'badge-praktikum',
        'ausbildung': 'badge-ausbildung',
      };
      return map[(type || '').toLowerCase()] || 'badge-default';
    }

    function icon(paths, size) {
      size = size || 16;
      return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
    }

    const icons = {
      briefcase: icon('<rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>'),
      mapPin: icon('<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>'),
      chevronDown: icon('<path d="m6 9 6 6 6-6"/>'),
      mail: icon('<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>'),
      link: icon('<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>'),
      arrowRight: icon('<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>'),
      alertCircle: icon('<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>'),
    };

    function toggleCard(id) {
      var details = document.getElementById('details-' + id);
      var toggle = document.getElementById('toggle-' + id);
      if (openCards.has(id)) {
        openCards.delete(id);
        details.classList.remove('open');
        toggle.classList.remove('open');
      } else {
        openCards.add(id);
        details.classList.add('open');
        toggle.classList.add('open');
      }
    }

    function escHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderJob(job) {
      var hasDept = job.department && job.department.trim();
      var hasLocation = job.location && job.location.trim();
      var hasDesc = job.description && job.description.trim();
      var hasReqs = job.requirements && job.requirements.trim();
      var hasEmail = job.apply_email && job.apply_email.trim();
      var hasUrl = job.apply_url && job.apply_url.trim();
      var hasApply = hasEmail || hasUrl;
      var hasDetails = hasDesc || hasReqs || hasApply;

      return '<div class="pw-job-card" id="card-' + job.id + '">' +
        '<div class="pw-job-header" onclick="toggleCard(\'' + job.id + '\')">' +
          '<div class="pw-job-icon">' + icons.briefcase + '</div>' +
          '<div class="pw-job-main">' +
            '<div class="pw-job-title-row">' +
              '<span class="pw-job-title">' + escHtml(job.title) + '</span>' +
              (job.job_type ? '<span class="pw-job-badge ' + badgeClass(job.job_type) + '">' + escHtml(job.job_type) + '</span>' : '') +
            '</div>' +
            '<div class="pw-job-meta">' +
              (hasDept ? '<span class="pw-job-meta-item">' + icons.briefcase + ' ' + escHtml(job.department) + '</span>' : '') +
              (hasLocation ? '<span class="pw-job-meta-item">' + icons.mapPin + ' ' + escHtml(job.location) + '</span>' : '') +
            '</div>' +
          '</div>' +
          (hasDetails
            ? '<button class="pw-job-toggle" id="toggle-' + job.id + '" onclick="event.stopPropagation(); toggleCard(\'' + job.id + '\')" aria-label="Details anzeigen">' + icons.chevronDown + '</button>'
            : '') +
        '</div>' +
        (hasDetails
          ? '<div class="pw-job-details" id="details-' + job.id + '">' +
              '<div class="pw-detail-grid">' +
                (hasDesc ? '<div class="pw-detail-section"><h4>Stellenbeschreibung</h4><p>' + escHtml(job.description) + '</p></div>' : '') +
                (hasReqs ? '<div class="pw-detail-section"><h4>Anforderungen</h4><p>' + escHtml(job.requirements) + '</p></div>' : '') +
              '</div>' +
              (hasApply
                ? '<div class="pw-apply-section">' +
                    (hasEmail ? '<a href="mailto:' + escHtml(job.apply_email) + '" class="pw-apply-btn pw-apply-btn-primary">' + icons.mail + ' Jetzt bewerben</a>' : '') +
                    (hasUrl && !hasEmail ? '<a href="' + escHtml(job.apply_url) + '" target="_blank" rel="noopener noreferrer" class="pw-apply-btn pw-apply-btn-primary">' + icons.arrowRight + ' Zur Bewerbung</a>' : '') +
                    (hasUrl && hasEmail ? '<a href="' + escHtml(job.apply_url) + '" target="_blank" rel="noopener noreferrer" class="pw-apply-btn pw-apply-btn-secondary">' + icons.link + ' Online bewerben</a>' : '') +
                  '</div>'
                : '') +
            '</div>'
          : '') +
        '</div>';
    }

    async function loadJobs() {
      try {
        var res = await fetch(
          SUPABASE_URL + '/rest/v1/job_listings?select=*&is_active=eq.true&order=sort_order.asc,created_at.desc',
          {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            }
          }
        );

        if (!res.ok) throw new Error('Fehler beim Laden');

        var jobs = await res.json();
        var loading = document.getElementById('loading');
        var content = document.getElementById('content');

        loading.style.display = 'none';
        content.style.display = 'block';

        if (!jobs || jobs.length === 0) {
          content.innerHTML =
            '<div class="pw-empty">' +
              '<div class="pw-empty-icon">' +
                '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>' +
              '</div>' +
              '<h3>Aktuell keine offenen Stellen</h3>' +
              '<p>Schau bald wieder vorbei &ndash;<br>wir freuen uns auf neue Bewerbungen!</p>' +
            '</div>';
          return;
        }

        var badge = document.getElementById('count-badge');
        badge.style.display = '';
        badge.textContent = jobs.length + ' offene ' + (jobs.length === 1 ? 'Stelle' : 'Stellen');

        content.innerHTML =
          '<div class="pw-jobs-list">' +
            jobs.map(renderJob).join('') +
          '</div>';

      } catch (err) {
        var loading = document.getElementById('loading');
        var content = document.getElementById('content');
        loading.style.display = 'none';
        content.style.display = 'block';
        content.innerHTML =
          '<div class="pw-error">' +
            icons.alertCircle +
            '<div><strong>Fehler beim Laden</strong><br>Bitte die Seite neu laden.</div>' +
          '</div>';
      }
    }

    loadJobs();
  </script>
</body>
</html>
