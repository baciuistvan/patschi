<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patschi Crew Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    .loading { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .table-item {
      position: absolute;
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
    }

    .table-item:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    .table-item.available {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: 2px solid rgba(16, 185, 129, 0.5);
    }

    .table-item.available:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      border: 2px solid rgba(16, 185, 129, 0.8);
    }

    .table-item.reserved {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      border: 2px solid rgba(239, 68, 68, 0.5);
    }

    .table-item.reserved:hover {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      border: 2px solid rgba(239, 68, 68, 0.8);
    }

    .table-item.not-bookable {
      background: linear-gradient(135deg, #475569 0%, #334155 100%);
      border: 3px solid #64748b;
      opacity: 1;
    }

    .table-item.not-bookable:hover {
      background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      border: 3px solid #475569;
      opacity: 1;
    }

    .table-item-label {
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      letter-spacing: 0.5px;
    }

    .table-item-capacity {
      font-size: 0.75rem;
      opacity: 0.95;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    .floor-plan-container {
      background:
        radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
        linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    // Supabase configuration
    const SUPABASE_URL = 'https://qwwerwkekvmaswusvgxy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d2Vyd2tla3ZtYXN3dXN2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzkxOTYsImV4cCI6MjA3OTU1NTE5Nn0.LkNZz4Tl0y8DzI4P3dvZn2-5a4FIjE72kYHbhK5_YvE';

    //  State management
    let state = {
      user: null,
      view: 'login',
      loading: false,
      error: null,
      selectedRoom: null,
      rooms: [],
      tables: [],
      reservations: []
    };

    // Fetch rooms from database
    async function fetchRooms() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/rooms?is_active=eq.true&order=name.asc`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        const rooms = await response.json();
        state.rooms = rooms;

        if (rooms.length > 0 && !state.selectedRoom) {
          state.selectedRoom = rooms[0].id;
        }
      } catch (error) {
        console.error('Error fetching rooms:', error);
      }
    }

    // Fetch tables from database
    async function fetchTables() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/tables?is_active=eq.true&select=*`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        const tables = await response.json();
        state.tables = tables;
      } catch (error) {
        console.error('Error fetching tables:', error);
      }
    }

    // Fetch today's reservations
    async function fetchReservations() {
      try {
        const today = new Date().toISOString().split('T')[0];
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/reservations?reservation_date=eq.${today}&select=*,reservation_tables(table_id)`,
          {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          }
        );
        const reservations = await response.json();
        state.reservations = reservations;
      } catch (error) {
        console.error('Error fetching reservations:', error);
      }
    }

    // Get shape class based on database shape
    function getShapeClass(shape) {
      switch (shape) {
        case 'circle': return 'circle';
        case 'square': return 'rounded-xl';
        case 'rectangle': return 'rounded-xl';
        case 'halfcircle': return 'rounded-full';
        default: return 'rounded-xl';
      }
    }

    // Convert database table to render format
    function convertTableToRender(table) {
      const isReserved = state.reservations.some(res =>
        res.reservation_tables && res.reservation_tables.some(rt => rt.table_id === table.id)
      );

      let style = `left: ${table.position_x}px; top: ${table.position_y}px; width: ${table.width}px; height: ${table.height}px;`;

      if (table.shape === 'circle' || table.shape === 'halfcircle') {
        style += ' border-radius: 50%;';
      }

      if (table.rotation && table.rotation !== 0) {
        style += ` transform: rotate(${table.rotation}deg);`;
      }

      const isStanding = table.table_number.toLowerCase().includes('stehend') ||
                        table.table_number.toLowerCase().includes('bartisch');

      let status = 'available';
      if (!table.is_bookable) {
        status = 'not-bookable';
      } else if (isReserved) {
        status = 'reserved';
      }

      return {
        id: table.id,
        name: table.custom_label || table.table_number,
        capacity: table.capacity,
        status: status,
        style: style,
        shape: getShapeClass(table.shape),
        icon: isStanding,
        isBookable: table.is_bookable
      };
    }

    // Get tables for selected room
    function getRoomTables() {
      if (!state.selectedRoom || !state.tables.length) return [];
      return state.tables
        .filter(table => table.room_id === state.selectedRoom)
        .map(convertTableToRender);
    }

    // Get room name by ID
    function getRoomName(roomId) {
      const room = state.rooms.find(r => r.id === roomId);
      return room ? room.name : '';
    }

    // Check for saved session
    const savedUser = localStorage.getItem('crew_user');
    const savedToken = localStorage.getItem('crew_token');
    if (savedUser && savedToken) {
      try {
        state.user = JSON.parse(savedUser);
        state.view = 'dashboard';
        (async () => {
          await fetchRooms();
          await fetchTables();
          await fetchReservations();
          render();
        })();
      } catch (e) {
        localStorage.removeItem('crew_user');
        localStorage.removeItem('crew_token');
      }
    }

    // Crew login function
    async function crewLogin(username, password) {
      state.loading = true;
      state.error = null;
      render();

      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/crew-login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Anmeldung fehlgeschlagen');
        }

        if (data.success) {
          state.user = data.user;
          state.view = 'dashboard';
          localStorage.setItem('crew_user', JSON.stringify(data.user));
          localStorage.setItem('crew_token', data.token);

          await fetchRooms();
          await fetchTables();
          await fetchReservations();
        }
      } catch (err) {
        state.error = err.message;
      } finally {
        state.loading = false;
        render();
      }
    }

    // Logout function
    function logout() {
      state.user = null;
      state.view = 'login';
      localStorage.removeItem('crew_user');
      localStorage.removeItem('crew_token');
      render();
    }

    // Switch room function
    async function switchRoom(roomId) {
      state.selectedRoom = roomId;
      await fetchReservations();
      render();
    }

    // Render login view
    function renderLogin() {
      return `
        <div class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
            <div class="text-center mb-8">
              <div class="w-16 h-16 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4">
                <span class="text-white font-bold text-2xl">P</span>
              </div>
              <h1 class="text-3xl font-bold text-gray-900 mb-2">Crew Dashboard</h1>
              <p class="text-gray-600">Anmelden um fortzufahren</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-6">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Benutzername</label>
                <input
                  type="text"
                  id="username"
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  placeholder="Benutzername eingeben"
                  required
                  autofocus
                />
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Passwort</label>
                <input
                  type="password"
                  id="password"
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  placeholder="Passwort eingeben"
                  required
                />
              </div>

              ${state.error ? `
                <div class="p-4 bg-red-50 border border-red-200 rounded-lg">
                  <p class="text-sm text-red-700">${state.error}</p>
                </div>
              ` : ''}

              <button
                type="submit"
                ${state.loading ? 'disabled' : ''}
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
              >
                ${state.loading ? 'Wird angemeldet...' : 'Anmelden'}
              </button>
            </form>

            <div class="mt-6 p-4 bg-blue-50 rounded-lg">
              <p class="text-sm text-blue-900 font-medium mb-1">Standard-Zugangsdaten:</p>
              <p class="text-sm text-blue-700">Benutzername: Crew</p>
              <p class="text-sm text-blue-700">Passwort: crew123</p>
            </div>
          </div>
        </div>
      `;
    }

    // Render dashboard view
    function renderDashboard() {
      const today = new Date();
      const currentMonth = today.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
      const selectedDate = today.toLocaleDateString('de-DE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

      return `
        <div class="min-h-screen bg-slate-900">
          <nav class="bg-gradient-to-r from-slate-800 via-slate-800 to-slate-900 border-b border-slate-700 shadow-lg">
            <div class="max-w-full px-4 py-2.5">
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-6">
                  <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-blue-700 rounded-lg flex items-center justify-center shadow-lg">
                      <span class="text-white font-bold text-lg">P</span>
                    </div>
                    <div>
                      <h1 class="text-lg font-bold text-white leading-tight">Raumplan - ${getRoomName(state.selectedRoom)}</h1>
                      <p class="text-xs text-slate-400">Live-Ansicht</p>
                    </div>
                  </div>
                  <div class="h-8 w-px bg-slate-700"></div>
                  <div class="flex items-center space-x-4 text-sm">
                    <span class="flex items-center px-3 py-1.5 bg-slate-700/50 rounded-lg">
                      <span class="w-3 h-3 bg-gradient-to-br from-green-400 to-green-600 rounded mr-2 shadow-sm"></span>
                      <span class="text-slate-200 font-medium">Verfügbar</span>
                    </span>
                    <span class="flex items-center px-3 py-1.5 bg-slate-700/50 rounded-lg">
                      <span class="w-3 h-3 bg-gradient-to-br from-red-400 to-red-600 rounded mr-2 shadow-sm"></span>
                      <span class="text-slate-200 font-medium">Reserviert</span>
                    </span>
                    <span class="flex items-center px-3 py-1.5 bg-slate-700/50 rounded-lg">
                      <span class="w-3 h-3 bg-gradient-to-br from-gray-400 to-gray-600 rounded mr-2 shadow-sm"></span>
                      <span class="text-slate-200 font-medium">Nicht buchbar</span>
                    </span>
                  </div>
                </div>

                <div class="flex items-center space-x-2">
                  <button onclick="openGiftCardModal()" class="px-3 py-2 bg-gradient-to-r from-orange-500 to-orange-600 text-white rounded-lg hover:from-orange-600 hover:to-orange-700 transition text-sm font-semibold flex items-center shadow-md">
                    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path>
                    </svg>
                    Gutschein
                  </button>
                  ${state.rooms.map(room => `
                    <button
                      onclick="handleRoomSwitch('${room.id}')"
                      class="px-5 py-2 ${state.selectedRoom === room.id ? 'bg-blue-600 shadow-lg ring-2 ring-blue-400' : 'bg-slate-700'} text-white rounded-lg hover:bg-blue-700 transition text-sm font-semibold shadow-md">
                      ${room.name}
                    </button>
                  `).join('')}
                  <div class="h-8 w-px bg-slate-700 mx-1"></div>
                  <button onclick="handleLogout()" class="px-4 py-2 bg-gradient-to-r from-red-600 to-red-700 text-white rounded-lg hover:from-red-700 hover:to-red-800 transition text-sm font-semibold shadow-md">
                    Abmelden
                  </button>
                </div>
              </div>
            </div>
          </nav>

          <div class="flex h-[calc(100vh-60px)]">
            <!-- Floor Plan -->
            <div class="flex-1 p-4 relative overflow-hidden floor-plan-container">
              <div class="relative w-full h-full max-w-7xl mx-auto">
                <!-- Dynamic Tables from Database -->
                ${getRoomTables().map(table => {
                  const isBar = table.name.toUpperCase() === 'BAR';
                  return `
                  <div class="table-item ${table.status} ${table.shape}" style="${table.style}">
                    <div class="w-full h-full flex flex-col items-center justify-center ${table.shape === 'rounded-2xl' ? 'p-4' : 'p-3'}">
                      <div class="text-white table-item-label ${isBar ? 'text-4xl font-bold' : table.name.length > 10 ? 'text-lg' : 'text-xl'} ${isBar ? '' : 'mb-2'}">${table.name}</div>
                      ${!isBar ? `<div class="text-white table-item-capacity ${table.shape === 'rounded-2xl' ? 'text-base' : ''}">${table.capacity} Plätze</div>` : ''}
                      ${table.status === 'reserved' && !isBar ? '<div class="mt-2 px-2 py-1 bg-white/20 rounded text-xs">Reserviert</div>' : ''}
                      ${table.status === 'not-bookable' && !isBar ? '<div class="mt-2 px-2 py-1 bg-white/20 rounded text-xs">Nicht buchbar</div>' : ''}
                      ${table.icon && !isBar ? `
                        <div class="mt-2 flex items-center space-x-2">
                          <svg class="w-5 h-5 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                          </svg>
                          <span class="text-white/70 text-sm">Stehtisch</span>
                        </div>
                      ` : ''}
                      ${(table.capacity >= 10 && !table.icon && table.status === 'available' && !isBar) ? '<div class="mt-2 w-12 h-0.5 bg-white/30"></div>' : ''}
                    </div>
                  </div>
                `}).join('')}
              </div>
            </div>

            <!-- Right Sidebar - Reservations -->
            <div class="w-96 bg-gradient-to-b from-slate-800 to-slate-900 border-l border-slate-700 flex flex-col shadow-2xl">
              <div class="p-4 border-b border-slate-700/50 bg-slate-800/50 backdrop-blur-sm">
                <div class="flex items-center justify-between">
                  <div>
                    <h2 class="text-xl font-bold text-white">Reservierungen</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Heute: ${new Date().toLocaleDateString('de-DE')}</p>
                  </div>
                  <button class="w-11 h-11 bg-gradient-to-br from-green-500 to-green-700 rounded-xl flex items-center justify-center hover:from-green-600 hover:to-green-800 transition shadow-lg">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Calendar -->
              <div class="p-4 border-b border-slate-700/50">
                <div class="bg-slate-900/50 rounded-xl p-4 backdrop-blur-sm shadow-inner">
                  <div class="flex items-center justify-between mb-4">
                    <button class="text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg p-2 transition">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                      </svg>
                    </button>
                    <h3 class="text-white font-bold text-base">Januar 2026</h3>
                    <button class="text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg p-2 transition">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                      </svg>
                    </button>
                  </div>

                  <div class="grid grid-cols-7 gap-1 text-center text-xs mb-2">
                    <div class="text-slate-500 font-semibold py-1">SO</div>
                    <div class="text-slate-500 font-semibold py-1">MO</div>
                    <div class="text-slate-500 font-semibold py-1">DI</div>
                    <div class="text-slate-500 font-semibold py-1">MI</div>
                    <div class="text-slate-500 font-semibold py-1">DO</div>
                    <div class="text-slate-500 font-semibold py-1">FR</div>
                    <div class="text-slate-500 font-semibold py-1">SA</div>
                  </div>

                  <div class="grid grid-cols-7 gap-1 text-center text-sm">
                    ${Array.from({length: 31}, (_, i) => {
                      const day = i + 1;
                      const isToday = day === today.getDate();
                      return `<div class="py-2 ${isToday ? 'bg-gradient-to-br from-blue-500 to-blue-700 text-white rounded-lg font-bold shadow-md' : 'text-slate-300 hover:bg-slate-700 rounded-lg cursor-pointer transition font-medium'}">${day}</div>`;
                    }).join('')}
                  </div>
                </div>
              </div>

              <!-- Selected Date Info -->
              <div class="p-4 flex-1 overflow-y-auto">
                <div class="bg-slate-900/50 rounded-xl p-4 backdrop-blur-sm shadow-inner">
                  <div class="text-center mb-4">
                    <div class="inline-flex items-center px-4 py-2 bg-blue-500/10 border border-blue-500/20 rounded-lg mb-3">
                      <svg class="w-4 h-4 text-blue-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                      </svg>
                      <span class="text-sm text-blue-300 font-semibold">${selectedDate}</span>
                    </div>
                    <div class="flex items-center justify-center space-x-2 mb-6">
                      <div class="text-3xl font-bold text-white">${state.reservations.length}</div>
                      <div class="text-slate-400 text-sm">Reservierungen</div>
                    </div>
                  </div>

                  <div class="flex flex-col items-center justify-center py-8 space-y-4">
                    <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center">
                      <svg class="w-10 h-10 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                      </svg>
                    </div>
                    <div class="text-center">
                      <p class="text-slate-400 font-medium mb-1">Keine Reservierungen</p>
                      <p class="text-slate-500 text-sm">Für diesen Tag sind keine Buchungen vorhanden</p>
                    </div>
                  </div>

                  <button onclick="openReservationModal()" class="w-full mt-6 px-4 py-3 bg-gradient-to-r from-blue-600 to-blue-700 text-white rounded-lg hover:from-blue-700 hover:to-blue-800 transition font-semibold text-sm shadow-lg flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    <span>Neue Reservierung</span>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Gift Card Modal -->
          <div id="giftCardModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50" onclick="closeGiftCardModalOnBackdrop(event)">
            <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4" onclick="event.stopPropagation()">
              <div class="bg-gradient-to-r from-orange-500 to-orange-600 p-6 rounded-t-2xl">
                <div class="flex items-center justify-between">
                  <h2 class="text-2xl font-bold text-white flex items-center">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">

    // Main render function
    function render() {
      const app = document.getElementById('app');
      if (state.view === 'login') {
        app.innerHTML = renderLogin();
      } else {
        app.innerHTML = renderDashboard();
      }
    }

    // Event handlers
    window.handleLogin = function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      crewLogin(username, password);
    };

    window.handleLogout = function() {
      logout();
    };

    window.handleRoomSwitch = async function(roomId) {
      await switchRoom(roomId);
    };

    // Gift Card Modal Functions
    let currentGiftCard = null;

    window.openGiftCardModal = function() {
      const modal = document.getElementById('giftCardModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => {
        document.getElementById('giftCardCode').focus();
      }, 100);
    };

    window.closeGiftCardModal = function() {
      const modal = document.getElementById('giftCardModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      resetGiftCardModal();
    };

    window.closeGiftCardModalOnBackdrop = function(event) {
      if (event.target.id === 'giftCardModal') {
        closeGiftCardModal();
      }
    };

    window.resetGiftCardModal = function() {
      document.getElementById('giftCardCode').value = '';
      document.getElementById('giftCardResult').classList.add('hidden');
      document.getElementById('validGiftCard').classList.add('hidden');
      document.getElementById('invalidGiftCard').classList.add('hidden');
      document.getElementById('successMessage').classList.add('hidden');
      document.getElementById('giftCardLoading').classList.add('hidden');
      currentGiftCard = null;
    };

    window.handleGiftCardKeyPress = function(event) {
      if (event.key === 'Enter') {
        verifyGiftCard();
      }
    };

    window.verifyGiftCard = async function() {
      const code = document.getElementById('giftCardCode').value.trim();

      if (!code) {
        alert('Bitte geben Sie einen Gutschein Code ein');
        return;
      }

      // Show loading
      document.getElementById('giftCardResult').classList.add('hidden');
      document.getElementById('giftCardLoading').classList.remove('hidden');
      document.getElementById('verifyButton').disabled = true;

      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/crew-verify-gift-card`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ code: code.toUpperCase() })
        });

        const data = await response.json();

        // Hide loading
        document.getElementById('giftCardLoading').classList.add('hidden');
        document.getElementById('giftCardResult').classList.remove('hidden');

        if (data.valid) {
          // Show valid gift card
          currentGiftCard = data.giftCard;
          document.getElementById('validGiftCard').classList.remove('hidden');
          document.getElementById('invalidGiftCard').classList.add('hidden');

          // Populate data
          document.getElementById('gcCode').textContent = data.giftCard.code;
          document.getElementById('gcRecipient').textContent = data.giftCard.recipient_name || 'Nicht angegeben';
          document.getElementById('gcAmount').textContent = `€${parseFloat(data.giftCard.original_amount).toFixed(2)}`;

          const expiryDate = new Date(data.giftCard.expiry_date);
          document.getElementById('gcExpiry').textContent = expiryDate.toLocaleDateString('de-DE');
        } else {
          // Show invalid gift card
          currentGiftCard = null;
          document.getElementById('validGiftCard').classList.add('hidden');
          document.getElementById('invalidGiftCard').classList.remove('hidden');

          document.getElementById('gcErrorMessage').textContent = data.message;

          // Show details if available
          if (data.giftCard) {
            document.getElementById('gcDetails').classList.remove('hidden');
            document.getElementById('gcCodeInvalid').textContent = data.giftCard.code;

            let statusText = data.giftCard.status;
            if (statusText === 'used') statusText = 'Eingelöst';
            else if (statusText === 'expired') statusText = 'Abgelaufen';
            else if (statusText === 'cancelled') statusText = 'Storniert';
            document.getElementById('gcStatus').textContent = statusText;

            // Show redeemed info if available
            if (data.giftCard.is_redeemed && data.giftCard.redeemed_at) {
              document.getElementById('gcRedeemedInfo').classList.remove('hidden');
              const redeemedDate = new Date(data.giftCard.redeemed_at);
              document.getElementById('gcRedeemedAt').textContent = redeemedDate.toLocaleString('de-DE');
              document.getElementById('gcRedeemedBy').textContent = data.giftCard.redeemed_by || 'Unbekannt';
            } else {
              document.getElementById('gcRedeemedInfo').classList.add('hidden');
            }
          } else {
            document.getElementById('gcDetails').classList.add('hidden');
          }
        }
      } catch (error) {
        console.error('Error verifying gift card:', error);
        document.getElementById('giftCardLoading').classList.add('hidden');
        document.getElementById('giftCardResult').classList.remove('hidden');
        document.getElementById('validGiftCard').classList.add('hidden');
        document.getElementById('invalidGiftCard').classList.remove('hidden');
        document.getElementById('gcErrorMessage').textContent = 'Fehler beim Prüfen des Gutscheins. Bitte versuchen Sie es erneut.';
        document.getElementById('gcDetails').classList.add('hidden');
      } finally {
        document.getElementById('verifyButton').disabled = false;
      }
    };

    window.redeemGiftCard = async function() {
      if (!currentGiftCard) {
        alert('Kein Gutschein ausgewählt');
        return;
      }

      // Confirmation dialog
      const confirmRedeem = confirm(`Möchten Sie den Gutschein über €${parseFloat(currentGiftCard.original_amount).toFixed(2)} wirklich einlösen?`);
      if (!confirmRedeem) {
        return;
      }

      // Show loading
      document.getElementById('giftCardResult').classList.add('hidden');
      document.getElementById('giftCardLoading').classList.remove('hidden');
      document.getElementById('redeemButton').disabled = true;

      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/crew-redeem-gift-card`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({
            code: currentGiftCard.code,
            redeemed_by: state.user ? state.user.name : 'Crew'
          })
        });

        const data = await response.json();

        // Hide loading
        document.getElementById('giftCardLoading').classList.add('hidden');
        document.getElementById('giftCardResult').classList.remove('hidden');

        if (data.success) {
          // Show success message
          document.getElementById('validGiftCard').classList.add('hidden');
          document.getElementById('invalidGiftCard').classList.add('hidden');
          document.getElementById('successMessage').classList.remove('hidden');

          document.getElementById('gcCodeSuccess').textContent = data.giftCard.code;
          document.getElementById('gcAmountSuccess').textContent = `€${parseFloat(data.giftCard.original_amount).toFixed(2)}`;
        } else {
          // Show error
          document.getElementById('validGiftCard').classList.add('hidden');
          document.getElementById('invalidGiftCard').classList.remove('hidden');
          document.getElementById('successMessage').classList.add('hidden');
          document.getElementById('gcErrorMessage').textContent = data.message || 'Fehler beim Einlösen des Gutscheins';
          document.getElementById('gcDetails').classList.add('hidden');
        }
      } catch (error) {
        console.error('Error redeeming gift card:', error);
        document.getElementById('giftCardLoading').classList.add('hidden');
        document.getElementById('giftCardResult').classList.remove('hidden');
        document.getElementById('validGiftCard').classList.add('hidden');
        document.getElementById('invalidGiftCard').classList.remove('hidden');
        document.getElementById('successMessage').classList.add('hidden');
        document.getElementById('gcErrorMessage').textContent = 'Fehler beim Einlösen des Gutscheins. Bitte versuchen Sie es erneut.';
        document.getElementById('gcDetails').classList.add('hidden');
      } finally {
        document.getElementById('redeemButton').disabled = false;
      }
    };

    // Reservation Modal Functions
    window.openReservationModal = function() {
      const modal = document.getElementById('reservationModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      // Set today's date as minimum
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('resDate').min = today;
      document.getElementById('resDate').value = today;

      // Load rooms into dropdown
      const roomSelect = document.getElementById('resRoom');
      roomSelect.innerHTML = '<option value="">Wählen Sie einen Raum...</option>';
      state.rooms.forEach(room => {
        const option = document.createElement('option');
        option.value = room.id;
        option.textContent = room.name;
        if (room.id === state.selectedRoom) {
          option.selected = true;
        }
        roomSelect.appendChild(option);
      });

      // Set up form submission
      const form = document.getElementById('reservationForm');
      form.onsubmit = handleReservationSubmit;
    };

    window.closeReservationModal = function() {
      const modal = document.getElementById('reservationModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      resetReservationModal();
    };

    window.closeReservationModalOnBackdrop = function(event) {
      if (event.target.id === 'reservationModal') {
        closeReservationModal();
      }
    };

    window.resetReservationModal = function() {
      // Reset form
      document.getElementById('reservationForm').reset();
      document.getElementById('resTime').value = '15:45';
      document.getElementById('resPartySize').value = '2';

      // Hide messages
      document.getElementById('reservationError').classList.add('hidden');
      document.getElementById('reservationSuccess').classList.add('hidden');
      document.getElementById('reservationLoading').classList.add('hidden');
      document.getElementById('reservationButtons').classList.remove('hidden');
      document.getElementById('reservationForm').querySelector('div').classList.remove('hidden');
    };

    async function handleReservationSubmit(e) {
      e.preventDefault();

      // Get form data
      const formData = {
        reservation_date: document.getElementById('resDate').value,
        reservation_time: document.getElementById('resTime').value,
        party_size: parseInt(document.getElementById('resPartySize').value),
        room_id: document.getElementById('resRoom').value,
        customer_name: document.getElementById('resCustomerName').value,
        customer_email: document.getElementById('resCustomerEmail').value,
        customer_phone: document.getElementById('resCustomerPhone').value,
        special_requests: document.getElementById('resSpecialRequests').value,
        duration_minutes: 120,
        status: 'confirmed',
        payment_status: 'unpaid',
        payment_amount: 0,
        payment_method: 'none',
        booking_method: 'crew',
        selected_tables: []
      };

      // Validation
      if (!formData.reservation_date || !formData.reservation_time || !formData.room_id ||
          !formData.customer_name || !formData.customer_email || formData.party_size < 1) {
        document.getElementById('reservationError').textContent = 'Bitte füllen Sie alle Pflichtfelder aus.';
        document.getElementById('reservationError').classList.remove('hidden');
        return;
      }

      // Show loading
      document.getElementById('reservationError').classList.add('hidden');
      document.getElementById('reservationButtons').classList.add('hidden');
      document.getElementById('reservationLoading').classList.remove('hidden');

      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/create-reservation`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Fehler beim Erstellen der Reservierung');
        }

        // Hide loading and form
        document.getElementById('reservationLoading').classList.add('hidden');
        document.getElementById('reservationForm').querySelector('.space-y-6').classList.add('hidden');

        // Show success
        document.getElementById('resBookingCode').textContent = data.booking_code;
        document.getElementById('reservationSuccess').classList.remove('hidden');

        // Refresh reservations
        await loadReservations();
      } catch (error) {
        console.error('Error creating reservation:', error);
        document.getElementById('reservationLoading').classList.add('hidden');
        document.getElementById('reservationButtons').classList.remove('hidden');
        document.getElementById('reservationError').textContent = error.message || 'Fehler beim Erstellen der Reservierung. Bitte versuchen Sie es erneut.';
        document.getElementById('reservationError').classList.remove('hidden');
      }
    }

    // Initial render
    render();
  </script>
</body>
</html>
