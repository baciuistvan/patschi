<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patschi Crew Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    .loading { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Touch-friendly interactions */
    @media (hover: none) and (pointer: coarse) {
      button, a, input[type="checkbox"] {
        min-height: 44px;
        min-width: 44px;
      }
    }

    .table-item {
      position: absolute;
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
    }

    .table-item:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    @media (max-width: 768px) {
      .table-item {
        transform: scale(0.7);
        transform-origin: top left;
      }
      .table-item:hover {
        transform: translateY(-4px) scale(0.75);
      }
    }

    .table-item.available {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: 2px solid rgba(16, 185, 129, 0.5);
    }

    .table-item.available:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      border: 2px solid rgba(16, 185, 129, 0.8);
    }

    .table-item.reserved {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      border: 2px solid rgba(239, 68, 68, 0.5);
    }

    .table-item.reserved:hover {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      border: 2px solid rgba(239, 68, 68, 0.8);
    }

    .table-item.not-bookable {
      background: linear-gradient(135deg, #475569 0%, #334155 100%);
      border: 3px solid #64748b;
      opacity: 1;
    }

    .table-item.not-bookable:hover {
      background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      border: 3px solid #475569;
      opacity: 1;
    }

    .table-item-label {
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      letter-spacing: 0.5px;
    }

    .table-item-capacity {
      font-size: 0.75rem;
      opacity: 0.95;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 768px) {
      .table-item-label {
        font-size: 1.2em;
      }
      .table-item-capacity {
        font-size: 0.9rem;
      }
    }

    .floor-plan-container {
      background:
        radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
        linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }

    @media (max-width: 768px) {
      .floor-plan-container {
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    // Supabase configuration
    const SUPABASE_URL = 'https://qwwerwkekvmaswusvgxy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d2Vyd2tla3ZtYXN3dXN2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzkxOTYsImV4cCI6MjA3OTU1NTE5Nn0.LkNZz4Tl0y8DzI4P3dvZn2-5a4FIjE72kYHbhK5_YvE';

    //  State management
    let state = {
      user: null,
      view: 'login',
      loading: false,
      error: null,
      selectedRoom: null,
      rooms: [],
      tables: [],
      reservations: [],
      calendarMonth: new Date().getMonth(),
      calendarYear: new Date().getFullYear(),
      selectedDate: new Date()
    };

    // Fetch rooms from database
    async function fetchRooms() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/rooms?is_active=eq.true&order=name.asc`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        const rooms = await response.json();
        state.rooms = rooms;

        if (rooms.length > 0 && !state.selectedRoom) {
          state.selectedRoom = rooms[0].id;
        }
      } catch (error) {
        console.error('Error fetching rooms:', error);
      }
    }

    // Fetch tables from database
    async function fetchTables() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/tables?is_active=eq.true&select=*`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        const tables = await response.json();
        state.tables = tables;
      } catch (error) {
        console.error('Error fetching tables:', error);
      }
    }

    // Fetch reservations for selected date
    async function fetchReservations() {
      try {
        const dateStr = state.selectedDate.toISOString().split('T')[0];
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/reservations?reservation_date=eq.${dateStr}&select=*,reservation_tables(table_id)`,
          {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          }
        );
        const reservations = await response.json();
        state.reservations = reservations;
      } catch (error) {
        console.error('Error fetching reservations:', error);
      }
    }

    // Get booking counts for calendar month
    async function getMonthBookingCounts() {
      try {
        const startDate = new Date(state.calendarYear, state.calendarMonth, 1);
        const endDate = new Date(state.calendarYear, state.calendarMonth + 1, 0);

        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/reservations?reservation_date=gte.${startDate.toISOString().split('T')[0]}&reservation_date=lte.${endDate.toISOString().split('T')[0]}&select=reservation_date`,
          {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          }
        );
        const reservations = await response.json();

        // Count bookings per day
        const counts = {};
        reservations.forEach(res => {
          const day = new Date(res.reservation_date).getDate();
          counts[day] = (counts[day] || 0) + 1;
        });

        return counts;
      } catch (error) {
        console.error('Error fetching booking counts:', error);
        return {};
      }
    }

    // Change calendar month
    async function changeMonth(direction) {
      state.calendarMonth += direction;

      if (state.calendarMonth > 11) {
        state.calendarMonth = 0;
        state.calendarYear++;
      } else if (state.calendarMonth < 0) {
        state.calendarMonth = 11;
        state.calendarYear--;
      }

      await render();
    }

    // Select a date on calendar
    async function selectCalendarDate(year, month, day) {
      state.selectedDate = new Date(year, month, day);
      await fetchReservations();
      await render();
    }

    // Get shape class based on database shape
    function getShapeClass(shape) {
      switch (shape) {
        case 'circle': return 'circle';
        case 'square': return 'rounded-xl';
        case 'rectangle': return 'rounded-xl';
        case 'halfcircle': return 'rounded-full';
        default: return 'rounded-xl';
      }
    }

    // Convert database table to render format
    function convertTableToRender(table) {
      const reservation = state.reservations.find(res =>
        res.reservation_tables && res.reservation_tables.some(rt => rt.table_id === table.id)
      );
      const isReserved = !!reservation;

      let style = `left: ${table.position_x}px; top: ${table.position_y}px; width: ${table.width}px; height: ${table.height}px;`;

      if (table.shape === 'circle' || table.shape === 'halfcircle') {
        style += ' border-radius: 50%;';
      }

      if (table.rotation && table.rotation !== 0) {
        style += ` transform: rotate(${table.rotation}deg);`;
      }

      const isStanding = table.table_number.toLowerCase().includes('stehend') ||
                        table.table_number.toLowerCase().includes('bartisch');

      let status = 'available';
      if (!table.is_bookable) {
        status = 'not-bookable';
      } else if (isReserved) {
        status = 'reserved';
      }

      return {
        id: table.id,
        name: table.custom_label || table.table_number,
        capacity: table.capacity,
        status: status,
        style: style,
        shape: getShapeClass(table.shape),
        icon: isStanding,
        isBookable: table.is_bookable,
        customerName: reservation ? reservation.customer_name : null
      };
    }

    // Get tables for selected room
    function getRoomTables() {
      if (!state.selectedRoom || !state.tables.length) return [];
      return state.tables
        .filter(table => table.room_id === state.selectedRoom)
        .map(convertTableToRender);
    }

    // Get room name by ID
    function getRoomName(roomId) {
      const room = state.rooms.find(r => r.id === roomId);
      return room ? room.name : '';
    }

    // Get reservations filtered by selected room
    function getFilteredReservations() {
      if (!state.selectedRoom) return state.reservations;

      // Filter reservations that have tables in the selected room
      return state.reservations.filter(res => {
        if (!res.reservation_tables || res.reservation_tables.length === 0) {
          return true; // Show reservations without tables assigned
        }

        // Check if any of the reservation's tables belong to the selected room
        return res.reservation_tables.some(rt => {
          const table = state.tables.find(t => t.id === rt.table_id);
          return table && table.room_id === state.selectedRoom;
        });
      });
    }

    // Check for saved session
    const savedUser = localStorage.getItem('crew_user');
    const savedToken = localStorage.getItem('crew_token');
    if (savedUser && savedToken) {
      try {
        state.user = JSON.parse(savedUser);
        state.view = 'dashboard';
        (async () => {
          await fetchRooms();
          await fetchTables();
          await fetchReservations();
          await render();
        })();
      } catch (e) {
        localStorage.removeItem('crew_user');
        localStorage.removeItem('crew_token');
      }
    }

    // Crew login function
    async function crewLogin(username, password) {
      state.loading = true;
      state.error = null;
      await render();

      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/crew-login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Anmeldung fehlgeschlagen');
        }

        if (data.success) {
          state.user = data.user;
          state.view = 'dashboard';
          localStorage.setItem('crew_user', JSON.stringify(data.user));
          localStorage.setItem('crew_token', data.token);

          await fetchRooms();
          await fetchTables();
          await fetchReservations();
        }
      } catch (err) {
        state.error = err.message;
      } finally {
        state.loading = false;
        await render();
      }
    }

    // Logout function
    async function logout() {
      state.user = null;
      state.view = 'login';
      localStorage.removeItem('crew_user');
      localStorage.removeItem('crew_token');
      await render();
    }

    // Switch room function
    async function switchRoom(roomId) {
      state.selectedRoom = roomId;
      await fetchReservations();
      await render();
    }

    // Render login view
    function renderLogin() {
      return `
        <div class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 sm:p-8">
            <div class="text-center mb-6 sm:mb-8">
              <div class="w-14 h-14 sm:w-16 sm:h-16 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4">
                <span class="text-white font-bold text-xl sm:text-2xl">P</span>
              </div>
              <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-2">Crew Dashboard</h1>
              <p class="text-sm sm:text-base text-gray-600">Anmelden um fortzufahren</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4 sm:space-y-6">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Benutzername</label>
                <input
                  type="text"
                  id="username"
                  class="w-full px-3 sm:px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-base min-h-[44px]"
                  placeholder="Benutzername eingeben"
                  required
                  autofocus
                />
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Passwort</label>
                <input
                  type="password"
                  id="password"
                  class="w-full px-3 sm:px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-base min-h-[44px]"
                  placeholder="Passwort eingeben"
                  required
                />
              </div>

              ${state.error ? `
                <div class="p-3 sm:p-4 bg-red-50 border border-red-200 rounded-lg">
                  <p class="text-sm text-red-700">${state.error}</p>
                </div>
              ` : ''}

              <button
                type="submit"
                ${state.loading ? 'disabled' : ''}
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors min-h-[44px]"
              >
                ${state.loading ? 'Wird angemeldet...' : 'Anmelden'}
              </button>
            </form>

            <div class="mt-4 sm:mt-6 p-3 sm:p-4 bg-blue-50 rounded-lg">
              <p class="text-sm text-blue-900 font-medium mb-1">Standard-Zugangsdaten:</p>
              <p class="text-sm text-blue-700">Benutzername: Crew</p>
              <p class="text-sm text-blue-700">Passwort: crew123</p>
            </div>
          </div>
        </div>
      `;
    }

    // Render dashboard view
    async function renderDashboard() {
      const today = new Date();
      const currentMonth = today.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
      const selectedDate = state.selectedDate.toLocaleDateString('de-DE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const bookingCounts = await getMonthBookingCounts();

      return `
        <div class="min-h-screen bg-slate-900">
          <nav class="bg-gradient-to-r from-slate-800 via-slate-800 to-slate-900 border-b border-slate-700 shadow-lg">
            <div class="max-w-full px-2 sm:px-4 py-2.5">
              <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between space-y-2 sm:space-y-0">
                <div class="flex items-center justify-between w-full sm:w-auto space-x-2 sm:space-x-6">
                  <div class="flex items-center space-x-2 sm:space-x-3">
                    <div class="w-8 h-8 sm:w-10 sm:h-10 bg-gradient-to-br from-blue-500 to-blue-700 rounded-lg flex items-center justify-center shadow-lg">
                      <span class="text-white font-bold text-base sm:text-lg">P</span>
                    </div>
                    <div>
                      <h1 class="text-sm sm:text-lg font-bold text-white leading-tight">
                        <span class="hidden md:inline">Raumplan - </span>${getRoomName(state.selectedRoom)}
                      </h1>
                      <p class="text-xs text-slate-400 hidden sm:block">Live-Ansicht</p>
                    </div>
                  </div>
                  <button onclick="openGiftCardModal()" class="px-2 py-2 sm:px-3 sm:py-2 bg-gradient-to-r from-orange-500 to-orange-600 text-white rounded-lg hover:from-orange-600 hover:to-orange-700 transition text-xs sm:text-sm font-semibold flex items-center shadow-md">
                    <svg class="w-4 h-4 sm:mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path>
                    </svg>
                    <span class="hidden sm:inline">Gutschein</span>
                  </button>
                </div>

                <div class="flex items-center space-x-1.5 sm:space-x-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
                  ${state.rooms.map(room => `
                    <button
                      onclick="handleRoomSwitch('${room.id}')"
                      class="px-3 py-1.5 sm:px-5 sm:py-2 whitespace-nowrap ${state.selectedRoom === room.id ? 'bg-blue-600 shadow-lg ring-2 ring-blue-400' : 'bg-slate-700'} text-white rounded-lg hover:bg-blue-700 transition text-xs sm:text-sm font-semibold shadow-md">
                      ${room.name}
                    </button>
                  `).join('')}
                  <div class="h-6 sm:h-8 w-px bg-slate-700 mx-1"></div>
                  <button onclick="handleLogout()" class="p-2 sm:p-2.5 bg-gradient-to-r from-red-600 to-red-700 text-white rounded-lg hover:from-red-700 hover:to-red-800 transition flex items-center justify-center shadow-md">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </nav>

          <div class="flex flex-col md:flex-row h-[calc(100vh-80px)] sm:h-[calc(100vh-70px)] md:h-[calc(100vh-65px)]">
            <!-- Floor Plan -->
            <div class="flex-1 p-2 sm:p-4 relative overflow-auto floor-plan-container">
              <div class="relative w-full h-full max-w-7xl mx-auto min-h-[400px] sm:min-h-[500px]">
                <!-- Dynamic Tables from Database -->
                ${getRoomTables().map(table => {
                  const isBar = table.name.toUpperCase() === 'BAR';
                  return `
                  <div class="table-item ${table.status} ${table.shape}" style="${table.style}">
                    <div class="w-full h-full flex flex-col items-center justify-center ${table.shape === 'rounded-2xl' ? 'p-4' : 'p-3'}">
                      <div class="text-white table-item-label ${isBar ? 'text-4xl font-bold' : table.name.length > 10 ? 'text-lg' : 'text-xl'} ${isBar ? '' : 'mb-1'}">${table.name}</div>
                      ${!isBar ? `<div class="text-white table-item-capacity ${table.shape === 'rounded-2xl' ? 'text-base' : ''}">${table.capacity} Plätze</div>` : ''}
                      ${table.status === 'reserved' && !isBar && table.customerName ? `
                        <div class="mt-2 flex items-center space-x-1.5 px-3 py-1.5 bg-gradient-to-r from-amber-500/90 to-amber-600/90 backdrop-blur-sm rounded-lg shadow-lg border border-amber-400/30">
                          <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                          </svg>
                          <span class="text-white text-xs font-bold tracking-wide">${table.customerName}</span>
                        </div>
                      ` : ''}
                      ${table.status === 'reserved' && !isBar && !table.customerName ? '<div class="mt-2 px-2 py-1 bg-white/20 rounded text-xs">Reserviert</div>' : ''}
                      ${table.status === 'not-bookable' && !isBar ? '<div class="mt-2 px-2 py-1 bg-white/20 rounded text-xs">Nicht buchbar</div>' : ''}
                      ${table.icon && !isBar ? `
                        <div class="mt-2 flex items-center space-x-2">
                          <svg class="w-5 h-5 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                          </svg>
                          <span class="text-white/70 text-sm">Stehtisch</span>
                        </div>
                      ` : ''}
                      ${(table.capacity >= 10 && !table.icon && table.status === 'available' && !isBar) ? '<div class="mt-2 w-12 h-0.5 bg-white/30"></div>' : ''}
                    </div>
                  </div>
                `}).join('')}
              </div>
            </div>

            <!-- Right Sidebar - Reservations -->
            <div class="w-full md:w-72 lg:w-96 bg-gradient-to-b from-slate-800 to-slate-900 border-t md:border-t-0 md:border-l border-slate-700 flex flex-col shadow-2xl max-h-[50vh] md:max-h-none">
              <div class="p-2 sm:p-4 border-b border-slate-700/50 bg-slate-800/50 backdrop-blur-sm">
                <div class="flex items-center justify-between">
                  <div>
                    <h2 class="text-lg sm:text-xl font-bold text-white">Reservierungen</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Heute: ${new Date().toLocaleDateString('de-DE')}</p>
                  </div>
                  <button onclick="openReservationModal()" class="w-10 h-10 sm:w-11 sm:h-11 bg-gradient-to-br from-green-500 to-green-700 rounded-xl flex items-center justify-center hover:from-green-600 hover:to-green-800 transition shadow-lg">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Calendar -->
              <div class="p-2 sm:p-3 border-b border-slate-700/50">
                <div class="bg-slate-900/50 rounded-xl p-2 sm:p-3 backdrop-blur-sm shadow-inner">
                  <div class="flex items-center justify-between mb-1.5 sm:mb-2">
                    <button onclick="changeMonth(-1)" class="text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg p-1 sm:p-1.5 transition">
                      <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                      </svg>
                    </button>
                    <h3 class="text-white font-bold text-xs sm:text-sm">${new Date(state.calendarYear, state.calendarMonth).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' })}</h3>

                      const daysInMonth = lastDay.getDate();

                      // Get day of week (0=Sunday, 1=Monday, etc) and adjust to Monday start
                      let firstDayOfWeek = firstDay.getDay();
                      firstDayOfWeek = firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1; // Convert Sunday=0 to Sunday=6

                      const cells = [];

                      // Empty cells before first day
                      for (let i = 0; i < firstDayOfWeek; i++) {
                        cells.push('<div class="py-2"></div>');
                      }

                      // Days of month
                      for (let day = 1; day <= daysInMonth; day++) {
                        const isToday = day === today.getDate() &&
                                       state.calendarMonth === today.getMonth() &&
                                       state.calendarYear === today.getFullYear();
                        const isSelected = day === state.selectedDate.getDate() &&
                                          state.calendarMonth === state.selectedDate.getMonth() &&
                                          state.calendarYear === state.selectedDate.getFullYear();

    // Main render function
    async function render() {
      const app = document.getElementById('app');
      if (state.view === 'login') {
        app.innerHTML = renderLogin();
      } else {
        app.innerHTML = await renderDashboard();
      }
    }

    // Event handlers
    window.handleLogin = function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      crewLogin(username, password);
    };

    window.handleLogout = async function() {
      await logout();
    };

    window.handleRoomSwitch = async function(roomId) {
      await switchRoom(roomId);
    };

    // Calendar functions
    window.changeMonth = async function(direction) {
      await changeMonth(direction);
    };

    window.selectCalendarDate = async function(year, month, day) {
      await selectCalendarDate(year, month, day);
    };

    // Gift Card Modal Functions
    let currentGiftCard = null;

    window.openGiftCardModal = function() {
      const modal = document.getElementById('giftCardModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => {
        document.getElementById('giftCardCode').focus();
      }, 100);
    };

    window.closeGiftCardModal = function() {
      const modal = document.getElementById('giftCardModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      resetGiftCardModal();
    };

    window.closeGiftCardModalOnBackdrop = function(event) {
      if (event.target.id === 'giftCardModal') {
        closeGiftCardModal();
      }
    };

    window.resetGiftCardModal = function() {
      document.getElementById('giftCardCode').value = '';
      document.getElementById('giftCardResult').classList.add('hidden');
      document.getElementById('validGiftCard').classList.add('hidden');
      document.getElementById('invalidGiftCard').classList.add('hidden');
      document.getElementById('successMessage').classList.add('hidden');
      document.getElementById('giftCardLoading').classList.add('hidden');
      currentGiftCard = null;
    };

    window.handleGiftCardKeyPress = function(event) {
      if (event.key === 'Enter') {
        verifyGiftCard();
      }
    };

    window.verifyGiftCard = async function() {
      const code = document.getElementById('giftCardCode').value.trim();

      if (!code) {
        alert('Bitte geben Sie einen Gutschein Code ein');
        return;
      }

      // Show loading
      document.getElementById('giftCardResult').classList.add('hidden');
      document.getElementById('giftCardLoading').classList.remove('hidden');
      document.getElementById('verifyButton').disabled = true;

      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/crew-verify-gift-card`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ code: code.toUpperCase() })
        });

        const data = await response.json();

        // Hide loading
        document.getElementById('giftCardLoading').classList.add('hidden');
        document.getElementById('giftCardResult').classList.remove('hidden');

        if (data.valid) {
          // Show valid gift card
          currentGiftCard = data.giftCard;
          document.getElementById('validGiftCard').classList.remove('hidden');
          document.getElementById('invalidGiftCard').classList.add('hidden');

          // Populate data
          document.getElementById('gcCode').textContent = data.giftCard.code;
          document.getElementById('gcRecipient').textContent = data.giftCard.recipient_name || 'Nicht angegeben';
          document.getElementById('gcAmount').textContent = `€${parseFloat(data.giftCard.original_amount).toFixed(2)}`;

          const expiryDate = new Date(data.giftCard.expiry_date);
          document.getElementById('gcExpiry').textContent = expiryDate.toLocaleDateString('de-DE');
        } else {
          // Show invalid gift card
          currentGiftCard = null;
          document.getElementById('validGiftCard').classList.add('hidden');
          document.getElementById('invalidGiftCard').classList.remove('hidden');

          document.getElementById('gcErrorMessage').textContent = data.message;

          // Show details if available
          if (data.giftCard) {
            document.getElementById('gcDetails').classList.remove('hidden');
            document.getElementById('gcCodeInvalid').textContent = data.giftCard.code;

            let statusText = data.giftCard.status;
            if (statusText === 'used') statusText = 'Eingelöst';
            else if (statusText === 'expired') statusText = 'Abgelaufen';
            else if (statusText === 'cancelled') statusText = 'Storniert';
            document.getElementById('gcStatus').textContent = statusText;

            // Show redeemed info if available
            if (data.giftCard.is_redeemed && data.giftCard.redeemed_at) {
              document.getElementById('gcRedeemedInfo').classList.remove('hidden');
              const redeemedDate = new Date(data.giftCard.redeemed_at);
              document.getElementById('gcRedeemedAt').textContent = redeemedDate.toLocaleString('de-DE');
              document.getElementById('gcRedeemedBy').textContent = data.giftCard.redeemed_by || 'Unbekannt';
            } else {
              document.getElementById('gcRedeemedInfo').classList.add('hidden');
            }
          } else {
            document.getElementById('gcDetails').classList.add('hidden');
          }
        }
      } catch (error) {
        console.error('Error verifying gift card:', error);
        document.getElementById('giftCardLoading').classList.add('hidden');
        document.getElementById('giftCardResult').classList.remove('hidden');
        document.getElementById('validGiftCard').classList.add('hidden');
        document.getElementById('invalidGiftCard').classList.remove('hidden');
        document.getElementById('gcErrorMessage').textContent = 'Fehler beim Prüfen des Gutscheins. Bitte versuchen Sie es erneut.';
        document.getElementById('gcDetails').classList.add('hidden');
      } finally {
        document.getElementById('verifyButton').disabled = false;

    function updateTablesDisplay() {
      const grid = document.getElementById('tablesGrid');
      const filteredTables = resAllTables.filter(t => t.capacity > 0 && t.room_id === resTableRoomFilter);

      if (filteredTables.length === 0) {
        grid.innerHTML = '<p class="text-sm text-slate-500 col-span-5">Keine Tische verfügbar</p>';
        return;
      }

      grid.innerHTML = '';
      filteredTables.sort((a, b) => {
        const numA = parseInt(a.table_number) || 0;
        const numB = parseInt(b.table_number) || 0;
        return numA - numB;
      }).forEach(table => {
        const isSelected = resSelectedTables.includes(table.id);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `p-2 rounded-lg border-2 transition-all ${
          isSelected
            ? 'bg-blue-600 border-blue-400 text-white shadow-lg'
            : 'bg-slate-800 border-slate-600 text-slate-300 hover:bg-slate-700 hover:border-slate-500'
        }`;
        button.innerHTML = `
          <div class="text-center">
            <div class="text-sm font-bold">${table.table_number || table.custom_label || `T${table.id.slice(0,4)}`}</div>
            <div class="text-[10px] opacity-80">${table.capacity}p</div>
          </div>
        `;

            resSelectedTables = resSelectedTables.filter(id => id !== table.id);

      const currentDate = new Date(startDate);
      currentDate.setDate(currentDate.getDate() - 7);

      grid.innerHTML = '';
      for (let i = 0; i < 38; i++) {
        const dateStr = formatDateLocal(currentDate);
        const isSelected = resSelectedDays.includes(dateStr);
        const isOriginalDate = dateStr === resDate;
        const dayOfWeek = currentDate.toLocaleDateString('en-US', { weekday: 'short' });
        const dayOfMonth = currentDate.getDate();

        const button = document.createElement('button');
        button.type = 'button';
        button.className = `p-2 rounded-lg text-sm transition-colors min-w-[60px] ${
          isOriginalDate
            ? 'bg-green-600 text-white cursor-default'
            : isSelected
            ? 'bg-blue-600 text-white'
            : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
        }`;
        button.innerHTML = `
          <div class="font-medium text-xs">${dayOfWeek}</div>
          <div class="text-sm font-bold">${dayOfMonth}</div>
          ${isOriginalDate ? '<div class="text-xs mt-1">●</div>' : ''}
        `;

        if (!isOriginalDate) {
          button.onclick = () => {
            if (isSelected) {
              resSelectedDays = resSelectedDays.filter(d => d !== dateStr);
            } else {
              resSelectedDays.push(dateStr);
              resSelectedDays.sort();
            }
            updateDaysGrid();
            updateSelectedDaysInfo();
          };
        }

        grid.appendChild(button);
        currentDate.setDate(currentDate.getDate() + 1);

    window.deleteReservation = async function(reservationId) {
      const reservation = state.reservations.find(r => r.id === reservationId);
      if (!reservation) return;

      // Check if it's an online paid reservation
      const isOnlineBooking = reservation.booking_method === 'stripe' ||
                             reservation.payment_method === 'stripe' ||
                             reservation.stripe_payment_intent_id;

      if (isOnlineBooking) {
        alert('Online bezahlte Reservierungen können nicht gelöscht werden.');
        return;
      }

      // Confirm deletion
      const confirmDelete = confirm(`Reservierung für ${reservation.customer_name} am ${reservation.reservation_date} um ${reservation.reservation_time} wirklich löschen?`);
      if (!confirmDelete) return;

      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) throw new Error('Not authenticated');

        const { error } = await supabase
          .from('reservations')
          .delete()
          .eq('id', reservationId);

        if (error) throw error;

        // Remove from state
        state.reservations = state.reservations.filter(r => r.id !== reservationId);

        // Refresh the display
        displayReservations();

        // Show success message
        alert('Reservierung erfolgreich gelöscht.');
      } catch (error) {
        console.error('Delete error:', error);
        alert('Fehler beim Löschen der Reservierung: ' + error.message);
      }
    };

      if (!resDate) return;

      const startDate = new Date(resDate);
      const currentDate = new Date(startDate);

      const days = [];
      for (let i = 0; i < 28; i++) {
        currentDate.setDate(currentDate.getDate() + 1);
        const dateStr = currentDate.toISOString().split('T')[0];
        if (dateStr !== resDate) {
          days.push(dateStr);
        }

      grid.innerHTML = days.map(day => {
        const date = new Date(day);
        const isSelected = editResSelectedDays.includes(day);
        return `
          <button
            type="button"
            onclick="toggleEditDay('${day}')"
            class="p-2 text-xs rounded ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'} transition"

    async function handleEditReservationSubmit(e) {
      e.preventDefault();

      // Get dates to update
      const mainDate = document.getElementById('editResDate').value;
      const datesToBook = [mainDate];
      if (document.getElementById('editMultipleDays').checked) {
        editResSelectedDays.forEach(day => {
          if (!datesToBook.includes(day)) {
            datesToBook.push(day);
          }
        });
      }
      datesToBook.sort();

      const reservationId = document.getElementById('editResId').value;

      // Get current reservation to check if it's online booking
      const currentReservation = state.reservations.find(r => r.id === reservationId);
      const isOnlineBooking = currentReservation && (
        currentReservation.booking_method === 'stripe' ||
        currentReservation.payment_method === 'stripe' ||
        currentReservation.stripe_payment_intent_id
      );

      const baseData = {
        customer_name: document.getElementById('editResCustomerName').value,
        customer_email: document.getElementById('editResCustomerEmail').value,
        customer_phone: document.getElementById('editResCustomerPhone').value,
        party_size: parseInt(document.getElementById('editResPartySize').value),
        reservation_time: document.getElementById('editResTime').value,
        special_requests: document.getElementById('editResSpecialRequests').value
      };

      // Only include payment data if it's not an online booking
      if (!isOnlineBooking) {
        baseData.payment_status = editResPaidWithCash ? 'paid' : 'unpaid';
        baseData.payment_amount = editResPaidWithCash ? parseFloat(document.getElementById('editCashAmount').value) : 0;
        baseData.payment_method = editResPaidWithCash ? 'cash' : 'none';
        baseData.booking_method = editResBookingMethod === 'free' ? 'free' : (editResPaidWithCash ? 'manual' : 'free');
      }

      // Validation
      if (!baseData.customer_name || !baseData.customer_email || baseData.party_size < 1 || !baseData.reservation_time) {
        document.getElementById('editReservationError').textContent = 'Bitte füllen Sie alle Pflichtfelder aus.';
        document.getElementById('editReservationError').classList.remove('hidden');
        return;
      }

      // Show loading
      document.getElementById('editReservationError').classList.add('hidden');
      document.getElementById('editReservationButtons').classList.add('hidden');
      const formSections = document.querySelectorAll('#editReservationForm > div:not(#editReservationSuccess):not(#editReservationLoading):not(#editReservationButtons)');
      formSections.forEach(section => section.classList.add('hidden'));
      document.getElementById('editReservationLoading').classList.remove('hidden');

      try {
        // If multiple days selected, create additional reservations
        if (datesToBook.length > 1) {
          // Update main reservation
          const updateData = {
            ...baseData,
            reservation_id: reservationId,
            reservation_date: mainDate
          };

          const response = await fetch(`${SUPABASE_URL}/functions/v1/crew-update-reservation`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${state.crewToken}`
            },
            body: JSON.stringify(updateData)
          });

          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Update failed');
          }

          // Create new reservations for additional days
          for (let i = 1; i < datesToBook.length; i++) {
            const additionalDate = datesToBook[i];
            const createData = {
              ...baseData,
              reservation_date: additionalDate,
              room_id: state.selectedRoom,
              duration_minutes: 120,
              status: 'confirmed',
              selected_tables: []
            };

            await fetch(`${SUPABASE_URL}/functions/v1/create-reservation`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${ANON_KEY}`
              },
              body: JSON.stringify(createData)
            });
          }
        } else {
          // Single day update
          const updateData = {
            ...baseData,
            reservation_id: reservationId,
            reservation_date: mainDate
          };

          const response = await fetch(`${SUPABASE_URL}/functions/v1/crew-update-reservation`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${state.crewToken}`
            },
            body: JSON.stringify(updateData)
          });

          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Update failed');
          }
        }

        // Hide loading, show success
        document.getElementById('editReservationLoading').classList.add('hidden');
        document.getElementById('editReservationSuccess').classList.remove('hidden');

        // Reload reservations
        await loadReservations();
      } catch (error) {
        console.error('Error updating reservation:', error);
        document.getElementById('editReservationError').textContent = error.message || 'Fehler beim Aktualisieren der Reservierung.';
        document.getElementById('editReservationError').classList.remove('hidden');
        document.getElementById('editReservationLoading').classList.add('hidden');
        document.getElementById('editReservationButtons').classList.remove('hidden');
        formSections.forEach(section => section.classList.remove('hidden'));
      }
    }

    // Attach edit form handler
    document.addEventListener('DOMContentLoaded', () => {
      const editForm = document.getElementById('editReservationForm');
      if (editForm) {
        editForm.addEventListener('submit', handleEditReservationSubmit);
      }
    });

    async function handleReservationSubmit(e) {
      e.preventDefault();

      // Get dates to book
      const mainDate = document.getElementById('resDate').value;
      const datesToBook = [mainDate];
      if (document.getElementById('multipleDays').checked) {
        resSelectedDays.forEach(day => {
          if (!datesToBook.includes(day)) {
            datesToBook.push(day);
          }
        });
      }
      datesToBook.sort();

      // Get form data
      const baseData = {
        reservation_time: document.getElementById('resTime').value,
        party_size: parseInt(document.getElementById('resPartySize').value),
        room_id: document.getElementById('resRoom').value,
        customer_name: document.getElementById('resCustomerName').value,
        customer_email: document.getElementById('resCustomerEmail').value,
        customer_phone: document.getElementById('resCustomerPhone').value,
        special_requests: document.getElementById('resSpecialRequests').value,
        duration_minutes: 120,
        status: 'confirmed',
        payment_status: resPaidWithCash ? 'paid' : 'unpaid',
        payment_amount: resPaidWithCash ? parseFloat(document.getElementById('cashAmount').value) : 0,
        payment_method: resPaidWithCash ? 'cash' : 'none',
        booking_method: resBookingMethod === 'free' ? 'free' : (resPaidWithCash ? 'manual' : 'free'),
        selected_tables: resSelectedTables
      };

      // Validation
      if (!baseData.reservation_time || !baseData.room_id ||
          !baseData.customer_name || !baseData.customer_email || baseData.party_size < 1) {
        document.getElementById('reservationError').textContent = 'Bitte füllen Sie alle Pflichtfelder aus.';
        document.getElementById('reservationError').classList.remove('hidden');
        return;
      }

      // Show loading
      document.getElementById('reservationError').classList.add('hidden');
      document.getElementById('reservationButtons').classList.add('hidden');
      document.getElementById('reservationLoading').classList.remove('hidden');

      try {
        // Create reservations for all dates
        const bookingCodes = [];
        for (const date of datesToBook) {
          const formData = { ...baseData, reservation_date: date };

          const response = await fetch(`${SUPABASE_URL}/functions/v1/create-reservation`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            },
            body: JSON.stringify(formData)
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Fehler beim Erstellen der Reservierung');
          }

          bookingCodes.push(data.booking_code);
        }

        // Hide loading and form sections
        document.getElementById('reservationLoading').classList.add('hidden');
        const formSections = document.querySelectorAll('#reservationForm > div:not(#reservationSuccess):not(#reservationError):not(#reservationLoading):not(#reservationButtons)');
        formSections.forEach(section => section.classList.add('hidden'));

        // Show success
        if (datesToBook.length > 1) {
          document.getElementById('resSuccessMessage').textContent = `${datesToBook.length} Reservierungen wurden erfolgreich angelegt.`;
          document.getElementById('resBookingCode').textContent = bookingCodes.join(', ');
        } else {
          document.getElementById('resSuccessMessage').textContent = 'Die Reservierung wurde erfolgreich angelegt.';
          document.getElementById('resBookingCode').textContent = bookingCodes[0];
        }
        document.getElementById('reservationSuccess').classList.remove('hidden');

        // Refresh reservations
        await fetchReservations();
        await render();
      } catch (error) {
        console.error('Error creating reservation:', error);
        document.getElementById('reservationLoading').classList.add('hidden');
        document.getElementById('reservationButtons').classList.remove('hidden');
        document.getElementById('reservationError').textContent = error.message || 'Fehler beim Erstellen der Reservierung. Bitte versuchen Sie es erneut.';
        document.getElementById('reservationError').classList.remove('hidden');
      }
    }

    // Initial render
    render();
  </script>
</body>
</html>
