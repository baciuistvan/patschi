<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gutschein Kaufen | Gift Card</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --charcoal: #1e1e1e;
            --charcoal-light: #2e2e2e;
            --charcoal-mid: #3a3a3a;
            --warm-white: #f7f3ee;
            --warm-cream: #ede8e0;
            --warm-border: #d4cec4;
            --amber: #b8924a;
            --amber-light: #d4aa6a;
            --amber-pale: #f5eddc;
            --text-primary: #1e1e1e;
            --text-secondary: #5a5550;
            --text-muted: #9a948e;
            --success: #4a7c59;
            --success-pale: #eaf2ed;
            --error: #8b2e2e;
            --error-pale: #fdf0f0;
            --info-pale: #eef2f8;
            --info: #3a5a8a;
            --shadow: 6px 6px 9px rgba(0,0,0,0.12);
            --shadow-soft: 0 2px 8px rgba(0,0,0,0.08);
            --radius: 4px;
            --radius-lg: 8px;
        }

        body {
            margin: 0;
            padding: 12px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 15px;
            background: transparent;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        #gift-card-widget-root {
            max-width: 100%;
            margin: 0 auto;
        }

        @media (min-width: 640px) {
            body { padding: 24px; }
            #gift-card-widget-root { max-width: 620px; }
        }

        @media (min-width: 768px) {
            #gift-card-widget-root { max-width: 680px; }
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        textarea {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            font-family: 'Inter', sans-serif;
            font-size: 15px !important;
        }

        .pw-widget {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .pw-header {
            background: var(--charcoal);
            padding: 28px 32px 24px;
            position: relative;
        }

        .pw-header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .pw-title {
            font-family: 'Cardo', Georgia, serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--warm-white);
            letter-spacing: 0.01em;
            line-height: 1.2;
        }

        .pw-subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 400;
            color: #9a948e;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .pw-body {
            padding: 28px 32px 32px;
            background: var(--warm-white);
        }

        .pw-section-title {
            font-family: 'Cardo', Georgia, serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--charcoal);
            margin-bottom: 20px;
            letter-spacing: 0.01em;
        }

        .pw-field {
            margin-bottom: 18px;
        }

        .pw-label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .pw-label svg {
            opacity: 0.6;
            flex-shrink: 0;
        }

        .pw-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--warm-border);
            border-radius: var(--radius);
            background: white;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
            height: 48px;
        }
        .pw-input:focus {
            outline: none;
            border-color: var(--amber);
            box-shadow: 0 0 0 3px rgba(184,146,74,0.1);
        }
        .pw-input::placeholder { color: var(--text-muted); }

        .pw-textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--warm-border);
            border-radius: var(--radius);
            background: white;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
            resize: vertical;
            min-height: 90px;
        }
        .pw-textarea:focus {
            outline: none;
            border-color: var(--amber);
            box-shadow: 0 0 0 3px rgba(184,146,74,0.1);
        }
        .pw-textarea::placeholder { color: var(--text-muted); }

        .pw-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 560px) {
            .pw-row { grid-template-columns: 1fr; }
        }

        .pw-amounts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .pw-amount-btn {
            padding: 16px 10px;
            border: 1px solid var(--warm-border);
            border-radius: var(--radius);
            background: white;
            font-family: 'Cardo', Georgia, serif;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-primary);
            text-align: center;
            line-height: 1;
        }
        .pw-amount-btn:hover {
            border-color: var(--amber);
            background: var(--amber-pale);
            color: var(--amber);
        }
        .pw-amount-btn.active {
            border-color: var(--amber);
            background: var(--amber-pale);
            color: var(--amber);
            box-shadow: 0 0 0 2px rgba(184,146,74,0.15);
        }

        .pw-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
            color: var(--text-muted);
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .pw-divider::before, .pw-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--warm-border);
        }

        .pw-notice {
            padding: 14px 16px;
            border-radius: var(--radius);
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .pw-notice-info {
            background: var(--info-pale);
            border-left: 3px solid var(--info);
            color: var(--info);
        }

        .pw-notice-success {
            background: var(--success-pale);
            border-left: 3px solid var(--success);
            color: var(--success);
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .pw-notice-error {
            background: var(--error-pale);
            border-left: 3px solid var(--error);
            color: var(--error);
        }

        .pw-notice-amber {
            background: var(--amber-pale);
            border-left: 3px solid var(--amber);
            color: #7a5a20;
        }

        .pw-summary-card {
            background: var(--charcoal);
            border-radius: var(--radius);
            padding: 22px 24px;
            margin-bottom: 18px;
        }

        .pw-summary-title {
            font-family: 'Cardo', Georgia, serif;
            font-size: 14px;
            font-weight: 400;
            color: rgba(255,255,255,0.45);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .pw-summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .pw-summary-row:last-child { border-bottom: none; }

        .pw-summary-key {
            font-size: 12px;
            letter-spacing: 0.04em;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            font-weight: 500;
        }

        .pw-summary-val {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255,255,255,0.85);
            font-family: 'Inter', sans-serif;
        }

        .pw-summary-total-key {
            font-family: 'Cardo', Georgia, serif;
            font-size: 15px;
            color: rgba(255,255,255,0.55);
            font-style: italic;
        }

        .pw-summary-total-val {
            font-family: 'Cardo', Georgia, serif;
            font-size: 30px;
            font-weight: 700;
            color: var(--amber-light);
        }

        .pw-btn-primary {
            width: 100%;
            padding: 14px 28px;
            background: var(--charcoal);
            color: var(--warm-white);
            border: none;
            border-radius: 9999px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 3px 3px 6px rgba(0,0,0,0.15);
        }
        .pw-btn-primary:hover:not(:disabled) {
            background: var(--charcoal-light);
            transform: translateY(-1px);
            box-shadow: 4px 5px 10px rgba(0,0,0,0.18);
        }
        .pw-btn-primary:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .pw-btn-amber {
            width: 100%;
            padding: 14px 28px;
            background: var(--amber);
            color: white;
            border: none;
            border-radius: 9999px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 3px 3px 6px rgba(184,146,74,0.25);
        }
        .pw-btn-amber:hover:not(:disabled) {
            background: var(--amber-light);
            transform: translateY(-1px);
            box-shadow: 4px 5px 10px rgba(184,146,74,0.3);
        }
        .pw-btn-amber:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .pw-btn-secondary {
            width: 100%;
            padding: 12px 20px;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--warm-border);
            border-radius: 9999px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pw-btn-secondary:hover {
            border-color: var(--charcoal);
            color: var(--charcoal);
            background: var(--warm-cream);
        }

        .pw-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: pw-spin 0.7s linear infinite;
            margin-right: 8px;
            flex-shrink: 0;
            vertical-align: middle;
        }
        @keyframes pw-spin { to { transform: rotate(360deg); } }

        .pw-success-header {
            background: var(--charcoal);
            padding: 36px 32px 30px;
            text-align: center;
        }

        .pw-success-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--amber);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 0 0 8px rgba(184,146,74,0.15);
        }

        .pw-success-title {
            font-family: 'Cardo', Georgia, serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--warm-white);
            margin-bottom: 6px;
        }

        .pw-success-subtitle {
            font-size: 13px;
            color: rgba(255,255,255,0.45);
            letter-spacing: 0.04em;
        }

        .pw-processing-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--warm-cream);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .pw-detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--warm-border);
            font-size: 14px;
        }
        .pw-detail-row:last-child { border-bottom: none; }
        .pw-detail-key { color: var(--text-muted); }
        .pw-detail-val { font-weight: 600; color: var(--text-primary); }

        .pw-verify-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .pw-verify-input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid var(--warm-border);
            border-radius: var(--radius);
            background: white;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
            height: 48px;
        }
        .pw-verify-input:focus {
            outline: none;
            border-color: var(--amber);
            box-shadow: 0 0 0 3px rgba(184,146,74,0.1);
        }
        .pw-verify-input::placeholder { color: var(--text-muted); }

        .pw-verify-btn {
            padding: 12px 20px;
            background: var(--charcoal);
            color: var(--warm-white);
            border: none;
            border-radius: 9999px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            box-shadow: 3px 3px 6px rgba(0,0,0,0.12);
        }
        .pw-verify-btn:hover:not(:disabled) {
            background: var(--charcoal-light);
            transform: translateY(-1px);
        }
        .pw-verify-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .pw-card-result {
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-top: 16px;
        }
        .pw-card-result.valid {
            background: var(--success-pale);
            border-left: 3px solid var(--success);
        }
        .pw-card-result.invalid {
            background: var(--error-pale);
            border-left: 3px solid var(--error);
        }

        .pw-card-result-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .pw-card-result-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .pw-card-result-icon.valid { background: var(--success); }
        .pw-card-result-icon.invalid { background: var(--error); }

        .pw-card-result-title {
            font-family: 'Cardo', Georgia, serif;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .pw-card-result-title.valid { color: var(--success); }
        .pw-card-result-title.invalid { color: var(--error); }

        .pw-card-result-sub {
            font-size: 12px;
        }
        .pw-card-result-sub.valid { color: var(--success); opacity: 0.8; }
        .pw-card-result-sub.invalid { color: var(--error); opacity: 0.8; }

        .pw-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 460px) {
            .pw-info-grid { grid-template-columns: 1fr; }
        }

        .pw-info-box {
            background: white;
            border: 1px solid var(--warm-border);
            border-radius: var(--radius);
            padding: 12px 14px;
        }

        .pw-info-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .pw-info-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
        }
        .pw-info-value.expired { color: var(--error); }

        .pw-footer-note {
            margin-top: 18px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;
        }

        .pw-config-error {
            padding: 36px 32px;
            text-align: center;
            background: var(--warm-white);
        }

        @media (max-width: 480px) {
            .pw-header { padding: 22px 20px 20px; }
            .pw-body { padding: 22px 20px 24px; }
            .pw-amounts { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div id="gift-card-widget-root"></div>

    <script>
        const GIFT_CARD_CONFIG = {
            supabaseUrl: 'https://qwwerwkekvmaswusvgxy.supabase.co',
            supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d2Vyd2tla3ZtYXN3dXN2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzkxOTYsImV4cCI6MjA3OTU1NTE5Nn0.LkNZz4Tl0y8DzI4P3dvZn2-5a4FIjE72kYHbhK5_YvE'
        };

        function initWidget() {
            if (!window.supabase) {
                document.getElementById('gift-card-widget-root').innerHTML = `
                    <div class="pw-widget">
                        <div class="pw-header">
                            <div class="pw-title">Gutschein Kaufen</div>
                            <div class="pw-subtitle">Schenken Sie Freude</div>
                        </div>
                        <div class="pw-config-error">
                            <div class="pw-notice pw-notice-error">Die Supabase-Bibliothek konnte nicht geladen werden. Bitte überprüfen Sie Ihre Internetverbindung.</div>
                        </div>
                    </div>
                `;
                return;
            }

            const supabase = window.supabase.createClient(GIFT_CARD_CONFIG.supabaseUrl, GIFT_CARD_CONFIG.supabaseAnonKey);

            if (!GIFT_CARD_CONFIG.supabaseUrl || GIFT_CARD_CONFIG.supabaseUrl === 'YOUR_SUPABASE_URL' ||
                !GIFT_CARD_CONFIG.supabaseAnonKey || GIFT_CARD_CONFIG.supabaseAnonKey === 'YOUR_SUPABASE_ANON_KEY') {
                document.getElementById('gift-card-widget-root').innerHTML = `
                    <div class="pw-widget">
                        <div class="pw-header">
                            <div class="pw-title">Gutschein Kaufen</div>
                        </div>
                        <div class="pw-body">
                            <div class="pw-notice pw-notice-amber">Konfiguration erforderlich: Bitte ersetzen Sie YOUR_SUPABASE_URL und YOUR_SUPABASE_ANON_KEY durch Ihre Supabase-Anmeldedaten.</div>
                        </div>
                    </div>
                `;
                return;
            }

            (function() {
                const root = document.getElementById('gift-card-widget-root');
                const config = GIFT_CARD_CONFIG;

                try {

                let selectedAmount = 50;
                let isCustomAmount = false;
                let verifyCode = '';
                let verifyLoading = false;
                let verifyResult = null;
                let giftCardDetails = null;
                let showSuccess = false;
                let successProcessing = true;
                let successError = null;

                const urlParams = new URLSearchParams(window.location.search);
                const sessionId = urlParams.get('session_id');
                if (urlParams.get('success') === 'true') {
                    showSuccess = true;
                    if (sessionId) {
                        fetch(config.supabaseUrl + '/functions/v1/gift-card-success', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + config.supabaseAnonKey
                            },
                            body: JSON.stringify({ sessionId })
                        })
                        .then(r => r.json())
                        .then(data => {
                            successProcessing = false;
                            if (!data.success) {
                                successError = data.error || 'Verarbeitung fehlgeschlagen';
                            }
                            render();
                        })
                        .catch(() => {
                            successProcessing = false;
                            render();
                        });
                    } else {
                        successProcessing = false;
                    }
                }

                function isExpired(expiryDate) {
                    return new Date(expiryDate) < new Date();
                }

                function isValid(card) {
                    return card.status === 'active' &&
                           card.payment_status === 'paid' &&
                           card.current_balance > 0 &&
                           !isExpired(card.expiry_date);
                }

                async function handleVerifyGiftCard(e) {
                    e.preventDefault();
                    verifyLoading = true;
                    verifyResult = null;
                    giftCardDetails = null;
                    render();

                    try {
                        const { data: giftCard, error } = await supabase
                            .from('gift_cards')
                            .select(`
                                *,
                                redemptions:gift_card_redemptions(
                                    id,
                                    amount,
                                    redeemed_at
                                )
                            `)
                            .eq('barcode', verifyCode.trim())
                            .maybeSingle();

                        if (error) throw error;

                        if (!giftCard) {
                            verifyResult = { valid: false, error: 'Gutschein mit diesem Barcode nicht gefunden' };
                        } else {
                            const expired = isExpired(giftCard.expiry_date);
                            const valid = giftCard.status === 'active' &&
                                         giftCard.payment_status === 'paid' &&
                                         giftCard.current_balance > 0 &&
                                         !expired;

                            let errorMessage;
                            if (!valid) {
                                if (giftCard.payment_status === 'pending') {
                                    errorMessage = 'Gutschein wartet auf Zahlungsbestätigung';
                                } else if (expired) {
                                    errorMessage = 'Gutschein ist abgelaufen';
                                } else if (giftCard.status === 'cancelled') {
                                    errorMessage = 'Gutschein wurde storniert';
                                } else if (giftCard.current_balance <= 0) {
                                    errorMessage = 'Gutschein ist vollständig eingelöst';
                                } else {
                                    errorMessage = 'Gutschein ist nicht mehr gültig';
                                }
                            }

                            verifyResult = {
                                valid: valid,
                                balance: giftCard.current_balance,
                                expiryDate: giftCard.expiry_date,
                                error: errorMessage
                            };
                            giftCardDetails = giftCard;
                        }

                        verifyLoading = false;
                        render();
                    } catch (err) {
                        verifyResult = { valid: false, error: 'Ein Fehler ist aufgetreten' };
                        verifyLoading = false;
                        render();
                    }
                }

                function renderGiftCardDetails() {
                    if (!verifyResult || !giftCardDetails) return '';

                    const card = giftCardDetails;
                    const valid = isValid(card);

                    const checkIconSvg = `<svg width="18" height="18" fill="none" stroke="white" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
                    const xIconSvg = `<svg width="18" height="18" fill="none" stroke="white" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;

                    let redemptionsHtml = '';
                    if (card.redemptions && card.redemptions.length > 0) {
                        redemptionsHtml = `
                            <div class="pw-info-box" style="grid-column: 1 / -1;">
                                <div class="pw-info-label">Einlösungen</div>
                                ${card.redemptions.map(r => `
                                    <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; padding-top: 6px; border-top: 1px solid var(--warm-border);">
                                        <span style="color: var(--text-muted);">${new Date(r.redeemed_at).toLocaleDateString('de-DE')}</span>
                                        <span style="font-weight: 600; color: var(--error);">-€${Number(r.amount).toFixed(2)}</span>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }

                    return `
                        <div class="pw-card-result ${valid ? 'valid' : 'invalid'}">
                            <div class="pw-card-result-header">
                                <div class="pw-card-result-icon ${valid ? 'valid' : 'invalid'}">
                                    ${valid ? checkIconSvg : xIconSvg}
                                </div>
                                <div>
                                    <div class="pw-card-result-title ${valid ? 'valid' : 'invalid'}">
                                        ${valid ? 'Gültiger Gutschein' : 'Ungültiger Gutschein'}
                                    </div>
                                    <div class="pw-card-result-sub ${valid ? 'valid' : 'invalid'}">
                                        ${verifyResult.error || 'Dieser Gutschein kann verwendet werden'}
                                    </div>
                                </div>
                            </div>

                            <div class="pw-info-grid">
                                <div class="pw-info-box">
                                    <div class="pw-info-label">Gutschein-Code</div>
                                    <div class="pw-info-value" style="font-size: 14px; letter-spacing: 0.04em;">${card.code}</div>
                                </div>
                                <div class="pw-info-box">
                                    <div class="pw-info-label">Ursprünglicher Betrag</div>
                                    <div class="pw-info-value">€${Number(card.original_amount).toFixed(2)}</div>
                                </div>
                                <div class="pw-info-box">
                                    <div class="pw-info-label">Aktuelles Guthaben</div>
                                    <div class="pw-info-value" style="color: var(--${valid ? 'success' : 'error'});">€${Number(card.current_balance).toFixed(2)}</div>
                                </div>
                                <div class="pw-info-box">
                                    <div class="pw-info-label">Ablaufdatum</div>
                                    <div class="pw-info-value ${isExpired(card.expiry_date) ? 'expired' : ''}">
                                        ${new Date(card.expiry_date).toLocaleDateString('de-DE')}
                                        ${isExpired(card.expiry_date) ? '<span style="font-size:11px;font-weight:500;"> (Abgelaufen)</span>' : ''}
                                    </div>
                                </div>
                                ${card.recipient_name ? `
                                    <div class="pw-info-box" style="grid-column: 1 / -1;">
                                        <div class="pw-info-label">Empfänger</div>
                                        <div class="pw-info-value" style="font-size: 14px;">${card.recipient_name}</div>
                                    </div>
                                ` : ''}
                                ${redemptionsHtml}
                            </div>
                        </div>
                    `;
                }

                function render() {
                    if (showSuccess) {
                        if (successProcessing) {
                            root.innerHTML = `
                                <div class="pw-widget">
                                    <div class="pw-success-header">
                                        <div class="pw-processing-icon">
                                            <svg width="28" height="28" fill="none" stroke="var(--text-muted)" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M12 4v1m0 14v1m8-8h-1M5 12H4m13.66-6.34l-.71.71M7.05 16.95l-.71.71m11.32 0l-.71-.71M7.05 7.05l-.71-.71"/>
                                            </svg>
                                        </div>
                                        <div class="pw-success-title" style="color: var(--text-secondary); font-size: 22px;">Zahlung wird verarbeitet</div>
                                        <div class="pw-success-subtitle" style="color: var(--text-muted);">Ihr Gutschein wird gerade erstellt</div>
                                    </div>
                                    <div class="pw-body" style="text-align: center;">
                                        <p style="color: var(--text-secondary); font-size: 14px; line-height: 1.7;">Bitte warten Sie einen Moment. Dies kann einige Sekunden dauern.</p>
                                    </div>
                                </div>
                            `;
                            return;
                        }

                        root.innerHTML = `
                            <div class="pw-widget">
                                <div class="pw-success-header">
                                    <div class="pw-success-icon">
                                        <svg width="28" height="28" fill="none" stroke="white" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="20 6 9 17 4 12"/>
                                        </svg>
                                    </div>
                                    <div class="pw-success-title">Zahlung erfolgreich!</div>
                                    <div class="pw-success-subtitle">Ihr Gutschein wurde erstellt</div>
                                </div>
                                <div class="pw-body">
                                    <div class="pw-notice pw-notice-info" style="margin-bottom: 24px;">
                                        Sie erhalten in Kürze eine E-Mail mit dem Gutschein-PDF.
                                    </div>
                                    <button class="pw-btn-primary" onclick="window.location.href = window.location.pathname">
                                        Weiteren Gutschein kaufen
                                    </button>
                                </div>
                            </div>
                        `;
                        return;
                    }

                    root.innerHTML = `
                        <div class="pw-widget">
                            <div class="pw-header">
                                <div class="pw-header-top">
                                    <div>
                                        <div class="pw-title">Gutschein Kaufen</div>
                                        <div class="pw-subtitle">Schenken Sie Freude</div>
                                    </div>
                                </div>
                            </div>

                            <div class="pw-body">
                                <div id="error-message"></div>

                                <form id="gift-card-form">
                                    <div class="pw-field">
                                        <div class="pw-label">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                                            Betrag auswählen
                                        </div>
                                        <div class="pw-amounts">
                                            <button type="button" class="pw-amount-btn ${!isCustomAmount && selectedAmount === 50 ? 'active' : ''}" data-amount="50">€50</button>
                                            <button type="button" class="pw-amount-btn ${!isCustomAmount && selectedAmount === 100 ? 'active' : ''}" data-amount="100">€100</button>
                                            <button type="button" class="pw-amount-btn ${!isCustomAmount && selectedAmount === 200 ? 'active' : ''}" data-amount="200">€200</button>
                                        </div>
                                        <div class="pw-label" style="margin-top: 14px;">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                                            Individueller Betrag
                                            <span style="font-weight: 400; opacity: 0.6;">— mind. €10</span>
                                        </div>
                                        <input type="number" id="custom-amount" min="10" step="1" placeholder="z.B. 75" class="pw-input" />
                                    </div>

                                    <div class="pw-divider">Empfänger</div>

                                    <div class="pw-section-title">Empfänger-Informationen</div>

                                    <div class="pw-row">
                                        <div class="pw-field">
                                            <div class="pw-label">
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                                                Name des Empfängers *
                                            </div>
                                            <input type="text" id="recipient-name" class="pw-input" placeholder="Max Mustermann" required />
                                        </div>
                                        <div class="pw-field">
                                            <div class="pw-label">
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                                                E-Mail des Empfängers *
                                            </div>
                                            <input type="email" id="recipient-email" class="pw-input" placeholder="max@beispiel.de" required />
                                        </div>
                                    </div>

                                    <div class="pw-divider">Käufer</div>

                                    <div class="pw-section-title">Ihre Informationen</div>

                                    <div class="pw-row">
                                        <div class="pw-field">
                                            <div class="pw-label">
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                                                Ihr Name *
                                            </div>
                                            <input type="text" id="buyer-name" class="pw-input" placeholder="Anna Muster" required />
                                        </div>
                                        <div class="pw-field">
                                            <div class="pw-label">
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                                                Ihre E-Mail *
                                            </div>
                                            <input type="email" id="buyer-email" class="pw-input" placeholder="anna@beispiel.de" required />
                                        </div>
                                    </div>

                                    <div class="pw-field">
                                        <div class="pw-label">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                                            Persönliche Nachricht
                                            <span style="font-weight: 400; opacity: 0.6;">— optional</span>
                                        </div>
                                        <textarea id="message" class="pw-textarea" maxlength="500" placeholder="Fügen Sie eine persönliche Nachricht hinzu…"></textarea>
                                    </div>

                                    <div class="pw-summary-card">
                                        <div class="pw-summary-title">Übersicht</div>
                                        <div class="pw-summary-row" style="padding-top: 10px; margin-top: 2px; border-top: none; border-bottom: none;">
                                            <span class="pw-summary-total-key">Gutscheinwert</span>
                                            <span class="pw-summary-total-val" id="total-amount">€${selectedAmount.toFixed(2)}</span>
                                        </div>
                                        <div style="font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 10px; letter-spacing: 0.03em;">
                                            Der Gutschein wird unmittelbar nach Zahlung per E-Mail zugestellt
                                        </div>
                                    </div>

                                    <button type="submit" class="pw-btn-amber" id="submit-btn">
                                        Gutschein kaufen &amp; bezahlen
                                    </button>

                                    <div class="pw-footer-note">
                                        Mit dem Kauf stimmen Sie unseren Allgemeinen Geschäftsbedingungen zu.<br>
                                        Gutscheine sind 1 Jahr ab Kaufdatum gültig.
                                    </div>
                                </form>

                                <div class="pw-divider" style="margin-top: 32px;">Gutschein prüfen</div>

                                <div class="pw-section-title">Gutschein prüfen</div>
                                <div class="pw-notice pw-notice-info" style="margin-bottom: 16px;">
                                    Geben Sie die Barcode-Nummer Ihres Gutscheins ein, um die Gültigkeit und den Restbetrag zu prüfen.
                                </div>

                                <form id="verify-form">
                                    <div class="pw-verify-row">
                                        <input
                                            type="text"
                                            id="verify-code"
                                            class="pw-verify-input"
                                            placeholder="Barcode-Nummer eingeben"
                                            value="${verifyCode}"
                                            required
                                        />
                                        <button type="submit" class="pw-verify-btn" ${verifyLoading ? 'disabled' : ''}>
                                            ${verifyLoading ? '<span class="pw-spinner"></span>Prüfen…' : 'Prüfen'}
                                        </button>
                                    </div>
                                </form>

                                ${renderGiftCardDetails()}

                                ${verifyResult && !giftCardDetails ? `
                                    <div class="pw-notice pw-notice-error" style="margin-top: 16px;">
                                        ${verifyResult.error || 'Ungültiger oder abgelaufener Gutschein'}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;

                    attachEventListeners();
                }

                function attachEventListeners() {
                    const amountBtns = root.querySelectorAll('.pw-amount-btn');
                    const customAmountInput = root.querySelector('#custom-amount');
                    const form = root.querySelector('#gift-card-form');
                    const totalDisplay = root.querySelector('#total-amount');
                    const verifyForm = root.querySelector('#verify-form');
                    const verifyCodeInput = root.querySelector('#verify-code');

                    amountBtns.forEach(btn => {
                        btn.addEventListener('click', function() {
                            selectedAmount = parseInt(this.dataset.amount);
                            isCustomAmount = false;
                            customAmountInput.value = '';
                            totalDisplay.textContent = '€' + selectedAmount.toFixed(2);
                            render();
                        });
                    });

                    customAmountInput.addEventListener('input', function() {
                        const value = parseFloat(this.value);
                        if (!isNaN(value) && value >= 10) {
                            selectedAmount = value;
                            isCustomAmount = true;
                            totalDisplay.textContent = '€' + selectedAmount.toFixed(2);
                        }
                    });

                    verifyCodeInput.addEventListener('input', function() {
                        verifyCode = this.value;
                    });

                    verifyForm.addEventListener('submit', handleVerifyGiftCard);

                    form.addEventListener('submit', async function(e) {
                        e.preventDefault();

                        const submitBtn = root.querySelector('#submit-btn');
                        const errorDiv = root.querySelector('#error-message');

                        submitBtn.disabled = true;
                        submitBtn.innerHTML = '<span class="pw-spinner"></span>Wird bearbeitet…';
                        errorDiv.innerHTML = '';

                        try {
                            const response = await fetch(config.supabaseUrl + '/functions/v1/purchase-gift-card', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': 'Bearer ' + config.supabaseAnonKey
                                },
                                body: JSON.stringify({
                                    amount: selectedAmount,
                                    recipientName: root.querySelector('#recipient-name').value,
                                    recipientEmail: root.querySelector('#recipient-email').value,
                                    buyerName: root.querySelector('#buyer-name').value,
                                    buyerEmail: root.querySelector('#buyer-email').value,
                                    message: root.querySelector('#message').value
                                })
                            });

                            const data = await response.json();

                            if (!response.ok) {
                                throw new Error(data.error || 'Zahlung konnte nicht verarbeitet werden');
                            }

                            if (data.checkoutUrl) {
                                window.location.href = data.checkoutUrl;
                            }
                        } catch (error) {
                            errorDiv.innerHTML = '<div class="pw-notice pw-notice-error">' + error.message + '</div>';
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Gutschein kaufen & bezahlen';
                        }
                    });
                }

                render();
                } catch (error) {
                    root.innerHTML = `
                        <div class="pw-widget">
                            <div class="pw-header">
                                <div class="pw-title">Gutschein Kaufen</div>
                            </div>
                            <div class="pw-body">
                                <div class="pw-notice pw-notice-error">Fehler beim Laden: ${error.message}</div>
                            </div>
                        </div>
                    `;
                }
            })();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initWidget);
        } else {
            initWidget();
        }
    </script>
</body>
</html>
