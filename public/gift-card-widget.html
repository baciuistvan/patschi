<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Card Purchase</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        #gift-card-widget-root {
            max-width: 800px;
            margin: 40px auto;
        }

        .gc-widget {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 40px;
        }

        .gc-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .gc-header h2 {
            font-size: 32px;
            font-weight: bold;
            color: #1e293b;
            margin: 0 0 10px 0;
        }

        .gc-header p {
            color: #64748b;
            font-size: 16px;
            margin: 0;
        }

        .gc-amounts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .gc-amount-btn {
            padding: 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: #334155;
        }

        .gc-amount-btn:hover {
            border-color: #10b981;
            background: #f0fdf4;
        }

        .gc-amount-btn.active {
            border-color: #10b981;
            background: #ecfdf5;
            color: #059669;
        }

        .gc-form-group {
            margin-bottom: 25px;
        }

        .gc-form-group label {
            display: block;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .gc-form-group input,
        .gc-form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .gc-form-group input:focus,
        .gc-form-group textarea:focus {
            outline: none;
            border-color: #10b981;
            background: #f0fdf4;
        }

        .gc-form-group textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .gc-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .gc-section {
            border-top: 2px solid #e2e8f0;
            padding-top: 30px;
            margin-top: 30px;
        }

        .gc-section h3 {
            font-size: 20px;
            font-weight: bold;
            color: #1e293b;
            margin: 0 0 20px 0;
        }

        .gc-total {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin: 30px 0;
        }

        .gc-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .gc-total-label {
            font-weight: 600;
            color: #475569;
        }

        .gc-total-amount {
            font-size: 32px;
            font-weight: bold;
            color: #1e293b;
        }

        .gc-total-note {
            font-size: 12px;
            color: #64748b;
            margin: 0;
        }

        .gc-submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .gc-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }

        .gc-submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .gc-error {
            background: #fee;
            border: 2px solid #fcc;
            border-radius: 8px;
            padding: 15px;
            color: #991b1b;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .gc-footer {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 30px;
        }

        .gc-config-error {
            text-align: center;
            padding: 40px;
            color: #991b1b;
            background: #fee;
            border: 2px solid #fcc;
            border-radius: 12px;
        }

        .gc-verify-section {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid #e2e8f0;
        }

        .gc-verify-title {
            text-align: center;
            margin-bottom: 20px;
        }

        .gc-verify-title h3 {
            font-size: 18px;
            font-weight: bold;
            color: #1e293b;
            margin: 0 0 8px 0;
        }

        .gc-verify-title p {
            font-size: 13px;
            color: #64748b;
            margin: 0;
        }

        .gc-verify-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .gc-verify-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .gc-verify-input:focus {
            outline: none;
            border-color: #10b981;
            background: #f0fdf4;
        }

        .gc-verify-btn {
            padding: 12px 24px;
            background: #475569;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .gc-verify-btn:hover {
            background: #334155;
        }

        .gc-verify-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .gc-card-details {
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .gc-card-details.valid {
            background: #ecfdf5;
            border: 2px solid #a7f3d0;
        }

        .gc-card-details.invalid {
            background: #fee;
            border: 2px solid #fcc;
        }

        .gc-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .gc-card-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gc-card-icon.valid {
            background: #d1fae5;
        }

        .gc-card-icon.invalid {
            background: #fee;
        }

        .gc-card-icon svg {
            width: 20px;
            height: 20px;
        }

        .gc-card-icon.valid svg {
            stroke: #059669;
        }

        .gc-card-icon.invalid svg {
            stroke: #dc2626;
        }

        .gc-card-title {
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 4px 0;
        }

        .gc-card-title.valid {
            color: #059669;
        }

        .gc-card-title.invalid {
            color: #991b1b;
        }

        .gc-card-subtitle {
            font-size: 12px;
            margin: 0;
        }

        .gc-card-subtitle.valid {
            color: #047857;
        }

        .gc-card-subtitle.invalid {
            color: #991b1b;
        }

        .gc-card-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .gc-info-box {
            background: white;
            border-radius: 8px;
            padding: 12px;
        }

        .gc-info-label {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .gc-info-value {
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
        }

        .gc-info-value.expired {
            color: #dc2626;
        }

        .gc-success {
            text-align: center;
            padding: 40px;
        }

        .gc-success-icon {
            width: 80px;
            height: 80px;
            background: #d1fae5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .gc-success-icon svg {
            width: 40px;
            height: 40px;
            stroke: #059669;
        }

        .gc-success-title {
            font-size: 28px;
            font-weight: bold;
            color: #1e293b;
            margin: 0 0 10px 0;
        }

        .gc-success-message {
            color: #64748b;
            font-size: 16px;
            margin: 0 0 30px 0;
        }

        .gc-success-btn {
            padding: 12px 30px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .gc-success-btn:hover {
            background: #059669;
        }

        @media (max-width: 768px) {
            .gc-widget {
                padding: 20px;
            }
            .gc-amounts {
                grid-template-columns: 1fr;
            }
            .gc-row {
                grid-template-columns: 1fr;
            }
            .gc-card-info {
                grid-template-columns: 1fr;
            }
            .gc-verify-form {
                flex-direction: column;
            }
            .gc-verify-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="gift-card-widget-root"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuration - Replace these with your actual Supabase credentials
        const GIFT_CARD_CONFIG = {
            supabaseUrl: 'https://qwwerwkekvmaswusvgxy.supabase.co',
            supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d2Vyd2tla3ZtYXN3dXN2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzkxOTYsImV4cCI6MjA3OTU1NTE5Nn0.LkNZz4Tl0y8DzI4P3dvZn2-5a4FIjE72kYHbhK5_YvE'
        };

        // Wait for Supabase library to load
        function initWidget() {
            if (!window.supabase) {
                console.error('Supabase library not loaded');
                document.getElementById('gift-card-widget-root').innerHTML = `
                    <div class="gc-widget">
                        <div class="gc-config-error">
                            <h2>Laden fehlgeschlagen</h2>
                            <p style="margin-top: 15px;">
                                Die Supabase-Bibliothek konnte nicht geladen werden. Bitte überprüfen Sie Ihre Internetverbindung.
                            </p>
                        </div>
                    </div>
                `;
                return;
            }

            const supabase = window.supabase.createClient(GIFT_CARD_CONFIG.supabaseUrl, GIFT_CARD_CONFIG.supabaseAnonKey);

            // Validate configuration
            if (!GIFT_CARD_CONFIG.supabaseUrl || GIFT_CARD_CONFIG.supabaseUrl === 'YOUR_SUPABASE_URL' ||
                !GIFT_CARD_CONFIG.supabaseAnonKey || GIFT_CARD_CONFIG.supabaseAnonKey === 'YOUR_SUPABASE_ANON_KEY') {
                document.getElementById('gift-card-widget-root').innerHTML = `
                    <div class="gc-widget">
                        <div class="gc-config-error">
                            <h2>⚠️ Konfiguration erforderlich</h2>
                            <p style="margin-top: 15px;">
                                Bitte bearbeiten Sie diese HTML-Datei und ersetzen Sie YOUR_SUPABASE_URL und YOUR_SUPABASE_ANON_KEY
                                durch Ihre tatsächlichen Supabase-Anmeldedaten.
                            </p>
                        </div>
                    </div>
                `;
                return;
            }

            // Initialize the widget
            (function() {
                const root = document.getElementById('gift-card-widget-root');
                const config = GIFT_CARD_CONFIG;

                try {

                let selectedAmount = 50;
                let isCustomAmount = false;
                let verifyCode = '';
                let verifyLoading = false;
                let verifyResult = null;
                let giftCardDetails = null;
                let showSuccess = false;
                let successProcessing = true;
                let successError = null;

                // Check for success parameter in URL
                const urlParams = new URLSearchParams(window.location.search);
                const sessionId = urlParams.get('session_id');
                if (urlParams.get('success') === 'true') {
                    showSuccess = true;
                    if (sessionId) {
                        fetch(config.supabaseUrl + '/functions/v1/gift-card-success', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + config.supabaseAnonKey
                            },
                            body: JSON.stringify({ sessionId })
                        })
                        .then(r => r.json())
                        .then(data => {
                            successProcessing = false;
                            if (!data.success) {
                                successError = data.error || 'Verarbeitung fehlgeschlagen';
                            }
                            render();
                        })
                        .catch(() => {
                            successProcessing = false;
                            render();
                        });
                    } else {
                        successProcessing = false;
                    }
                }

                function isExpired(expiryDate) {
                    return new Date(expiryDate) < new Date();
                }

                function isValid(card) {
                    return card.status === 'active' &&
                           card.payment_status === 'paid' &&
                           card.current_balance > 0 &&
                           !isExpired(card.expiry_date);
                }

                async function handleVerifyGiftCard(e) {
                    e.preventDefault();
                    verifyLoading = true;
                    verifyResult = null;
                    giftCardDetails = null;
                    render();

                    try {
                        const { data: giftCard, error } = await supabase
                            .from('gift_cards')
                            .select(`
                                *,
                                redemptions:gift_card_redemptions(
                                    id,
                                    amount,
                                    redeemed_at
                                )
                            `)
                            .eq('barcode', verifyCode.trim())
                            .maybeSingle();

                        if (error) throw error;

                        if (!giftCard) {
                            verifyResult = { valid: false, error: 'Gutschein mit diesem Barcode nicht gefunden' };
                        } else {
                            const expired = isExpired(giftCard.expiry_date);
                            const valid = giftCard.status === 'active' &&
                                         giftCard.payment_status === 'paid' &&
                                         giftCard.current_balance > 0 &&
                                         !expired;

                            let errorMessage;
                            if (!valid) {
                                if (giftCard.payment_status === 'pending') {
                                    errorMessage = 'Gutschein wartet auf Zahlungsbestätigung';
                                } else if (expired) {
                                    errorMessage = 'Gutschein ist abgelaufen';
                                } else if (giftCard.status === 'cancelled') {
                                    errorMessage = 'Gutschein wurde storniert';
                                } else if (giftCard.current_balance <= 0) {
                                    errorMessage = 'Gutschein ist vollständig eingelöst';
                                } else {
                                    errorMessage = 'Gutschein ist nicht mehr gültig';
                                }
                            }

                            verifyResult = {
                                valid: valid,
                                balance: giftCard.current_balance,
                                expiryDate: giftCard.expiry_date,
                                error: errorMessage
                            };
                            giftCardDetails = giftCard;
                        }

                        verifyLoading = false;
                        render();
                    } catch (err) {
                        verifyResult = { valid: false, error: 'Ein Fehler ist aufgetreten' };
                        verifyLoading = false;
                        render();
                    }
                }

                function renderGiftCardDetails() {
                    if (!verifyResult || !giftCardDetails) return '';

                    const card = giftCardDetails;
                    const valid = isValid(card);

                    const checkIcon = valid
                        ? '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>'
                        : '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';

                    let redemptionsHtml = '';
                    if (card.redemptions && card.redemptions.length > 0) {
                        redemptionsHtml = `
                            <div class="gc-info-box" style="grid-column: 1 / -1;">
                                <div class="gc-info-label">Einlösungen</div>
                                ${card.redemptions.map(r => `
                                    <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 14px;">
                                        <span style="color: #64748b;">${new Date(r.redeemed_at).toLocaleDateString('de-DE')}</span>
                                        <span style="font-weight: 600; color: #1e293b;">-€${Number(r.amount).toFixed(2)}</span>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }

                    return `
                        <div class="gc-card-details ${valid ? 'valid' : 'invalid'}">
                            <div class="gc-card-header">
                                <div class="gc-card-icon ${valid ? 'valid' : 'invalid'}">
                                    ${checkIcon}
                                </div>
                                <div>
                                    <h4 class="gc-card-title ${valid ? 'valid' : 'invalid'}">
                                        ${valid ? 'Gültiger Gutschein' : 'Ungültiger Gutschein'}
                                    </h4>
                                    <p class="gc-card-subtitle ${valid ? 'valid' : 'invalid'}">
                                        ${verifyResult.error || 'Dieser Gutschein kann verwendet werden'}
                                    </p>
                                </div>
                            </div>

                            <div class="gc-card-info">
                                <div class="gc-info-box">
                                    <div class="gc-info-label">Gutschein-Code</div>
                                    <div class="gc-info-value">${card.code}</div>
                                </div>
                                <div class="gc-info-box">
                                    <div class="gc-info-label">Ursprünglicher Betrag</div>
                                    <div class="gc-info-value">€${Number(card.original_amount).toFixed(2)}</div>
                                </div>
                                <div class="gc-info-box">
                                    <div class="gc-info-label">Aktuelles Guthaben</div>
                                    <div class="gc-info-value">€${Number(card.current_balance).toFixed(2)}</div>
                                </div>
                                <div class="gc-info-box">
                                    <div class="gc-info-label">Ablaufdatum</div>
                                    <div class="gc-info-value ${isExpired(card.expiry_date) ? 'expired' : ''}">
                                        ${new Date(card.expiry_date).toLocaleDateString('de-DE')}
                                        ${isExpired(card.expiry_date) ? ' (Abgelaufen)' : ''}
                                    </div>
                                </div>
                                ${card.recipient_name ? `
                                    <div class="gc-info-box" style="grid-column: 1 / -1;">
                                        <div class="gc-info-label">Empfänger</div>
                                        <div class="gc-info-value" style="font-size: 14px;">${card.recipient_name}</div>
                                    </div>
                                ` : ''}
                                ${redemptionsHtml}
                            </div>
                        </div>
                    `;
                }

                function render() {
                    if (showSuccess) {
                        if (successProcessing) {
                            root.innerHTML = `
                                <div class="gc-widget">
                                    <div class="gc-success">
                                        <div class="gc-success-icon" style="background:#f1f5f9;">
                                            <svg fill="none" stroke="#64748b" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m0 14v1m8-8h-1M5 12H4m13.66-6.34l-.71.71M7.05 16.95l-.71.71m11.32 0l-.71-.71M7.05 7.05l-.71-.71"></path>
                                            </svg>
                                        </div>
                                        <h2 class="gc-success-title" style="color:#334155;">Zahlung wird verarbeitet...</h2>
                                        <p class="gc-success-message">
                                            Ihr Gutschein wird gerade erstellt. Bitte warten Sie einen Moment.
                                        </p>
                                    </div>
                                </div>
                            `;
                            return;
                        }
                        root.innerHTML = `
                            <div class="gc-widget">
                                <div class="gc-success">
                                    <div class="gc-success-icon">
                                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                        </svg>
                                    </div>
                                    <h2 class="gc-success-title">Zahlung erfolgreich!</h2>
                                    <p class="gc-success-message">
                                        Ihr Gutschein wurde erfolgreich gekauft.<br>
                                        Sie erhalten in Kürze eine E-Mail mit dem Gutschein-PDF.
                                    </p>
                                    <button class="gc-success-btn" onclick="window.location.href = window.location.pathname">
                                        Weiteren Gutschein kaufen
                                    </button>
                                </div>
                            </div>
                        `;
                        return;
                    }

                    root.innerHTML = `
                        <div class="gc-widget">
                            <div class="gc-header">
                                <h2>🎁 Gutschein Kaufen</h2>
                                <p>Schenken Sie Freude</p>
                            </div>

                            <form id="gift-card-form">
                                <div class="gc-form-group">
                                    <label>Betrag auswählen</label>
                                    <div class="gc-amounts">
                                        <button type="button" class="gc-amount-btn ${!isCustomAmount && selectedAmount === 50 ? 'active' : ''}" data-amount="50">€50</button>
                                        <button type="button" class="gc-amount-btn ${!isCustomAmount && selectedAmount === 100 ? 'active' : ''}" data-amount="100">€100</button>
                                        <button type="button" class="gc-amount-btn ${!isCustomAmount && selectedAmount === 200 ? 'active' : ''}" data-amount="200">€200</button>
                                    </div>
                                    <label style="margin-top: 15px;">Individueller Betrag (mind. €10)</label>
                                    <input type="number" id="custom-amount" min="10" step="1" placeholder="€10" />
                                </div>

                                <div class="gc-section">
                                    <h3>Empfänger-Informationen</h3>
                                    <div class="gc-row">
                                        <div class="gc-form-group">
                                            <label>Name des Empfängers *</label>
                                            <input type="text" id="recipient-name" required />
                                        </div>
                                        <div class="gc-form-group">
                                            <label>E-Mail des Empfängers *</label>
                                            <input type="email" id="recipient-email" required />
                                        </div>
                                    </div>
                                </div>

                                <div class="gc-section">
                                    <h3>Ihre Informationen</h3>
                                    <div class="gc-row">
                                        <div class="gc-form-group">
                                            <label>Ihr Name *</label>
                                            <input type="text" id="buyer-name" required />
                                        </div>
                                        <div class="gc-form-group">
                                            <label>Ihre E-Mail *</label>
                                            <input type="email" id="buyer-email" required />
                                        </div>
                                    </div>
                                </div>

                                <div class="gc-form-group">
                                    <label>Persönliche Nachricht (Optional)</label>
                                    <textarea id="message" maxlength="500" placeholder="Fügen Sie eine persönliche Nachricht hinzu..."></textarea>
                                </div>

                                <div id="error-message"></div>

                                <div class="gc-total">
                                    <div class="gc-total-row">
                                        <span class="gc-total-label">Gesamtbetrag:</span>
                                        <span class="gc-total-amount" id="total-amount">€${selectedAmount.toFixed(2)}</span>
                                    </div>
                                    <p class="gc-total-note">Der Gutschein wird unmittelbar nach Zahlung per E-Mail zugestellt</p>
                                </div>

                                <button type="submit" class="gc-submit-btn" id="submit-btn">
                                    🎁 Gutschein Kaufen
                                </button>

                                <div class="gc-footer">
                                    Mit dem Kauf stimmen Sie unseren Allgemeinen Geschäftsbedingungen zu. Gutscheine sind 1 Jahr ab Kaufdatum gültig.
                                </div>
                            </form>

                            <div class="gc-verify-section">
                                <div class="gc-verify-title">
                                    <h3>Gutschein prüfen</h3>
                                    <p>Geben Sie die Barcode-Nummer Ihres Gutscheins ein, um die Gültigkeit und den Restbetrag zu überprüfen</p>
                                </div>

                                <form id="verify-form" class="gc-verify-form">
                                    <input
                                        type="text"
                                        id="verify-code"
                                        class="gc-verify-input"
                                        placeholder="Barcode-Nummer eingeben"
                                        value="${verifyCode}"
                                        required
                                    />
                                    <button type="submit" class="gc-verify-btn" ${verifyLoading ? 'disabled' : ''}>
                                        ${verifyLoading ? '⏳ Prüfen...' : '🔍 Prüfen'}
                                    </button>
                                </form>

                                ${renderGiftCardDetails()}

                                ${verifyResult && !giftCardDetails ? `
                                    <div class="gc-error">
                                        ${verifyResult.error || 'Ungültiger oder abgelaufener Gutschein'}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;

                    attachEventListeners();
                }

                function attachEventListeners() {
                    const amountBtns = root.querySelectorAll('.gc-amount-btn');
                    const customAmountInput = root.querySelector('#custom-amount');
                    const form = root.querySelector('#gift-card-form');
                    const totalDisplay = root.querySelector('#total-amount');
                    const verifyForm = root.querySelector('#verify-form');
                    const verifyCodeInput = root.querySelector('#verify-code');

                    amountBtns.forEach(btn => {
                        btn.addEventListener('click', function() {
                            selectedAmount = parseInt(this.dataset.amount);
                            isCustomAmount = false;
                            customAmountInput.value = '';
                            totalDisplay.textContent = '€' + selectedAmount.toFixed(2);
                            render();
                        });
                    });

                    customAmountInput.addEventListener('input', function() {
                        const value = parseFloat(this.value);
                        if (!isNaN(value) && value >= 10) {
                            selectedAmount = value;
                            isCustomAmount = true;
                            totalDisplay.textContent = '€' + selectedAmount.toFixed(2);
                        }
                    });

                    verifyCodeInput.addEventListener('input', function() {
                        verifyCode = this.value;
                    });

                    verifyForm.addEventListener('submit', handleVerifyGiftCard);

                    form.addEventListener('submit', async function(e) {
                        e.preventDefault();

                        const submitBtn = root.querySelector('#submit-btn');
                        const errorDiv = root.querySelector('#error-message');

                        submitBtn.disabled = true;
                        submitBtn.textContent = '⏳ Wird bearbeitet...';
                        errorDiv.innerHTML = '';

                        try {
                            const response = await fetch(config.supabaseUrl + '/functions/v1/purchase-gift-card', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': 'Bearer ' + config.supabaseAnonKey
                                },
                                body: JSON.stringify({
                                    amount: selectedAmount,
                                    recipientName: root.querySelector('#recipient-name').value,
                                    recipientEmail: root.querySelector('#recipient-email').value,
                                    buyerName: root.querySelector('#buyer-name').value,
                                    buyerEmail: root.querySelector('#buyer-email').value,
                                    message: root.querySelector('#message').value
                                })
                            });

                            const data = await response.json();

                            if (!response.ok) {
                                throw new Error(data.error || 'Zahlung konnte nicht verarbeitet werden');
                            }

                            if (data.checkoutUrl) {
                                window.location.href = data.checkoutUrl;
                            }
                        } catch (error) {
                            errorDiv.innerHTML = '<div class="gc-error">' + error.message + '</div>';
                            submitBtn.disabled = false;
                            submitBtn.textContent = '🎁 Gutschein Kaufen';
                        }
                    });
                }

                render();
                } catch (error) {
                    console.error('Widget initialization error:', error);
                    root.innerHTML = `
                        <div class="gc-widget">
                            <div class="gc-config-error">
                                <h2>Fehler beim Laden</h2>
                                <p style="margin-top: 15px;">
                                    Ein Fehler ist aufgetreten: ${error.message}<br>
                                    Bitte öffnen Sie die Browser-Konsole für weitere Details.
                                </p>
                            </div>
                        </div>
                    `;
                }
            })();
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initWidget);
        } else {
            initWidget();
        }
    </script>
</body>
</html>
