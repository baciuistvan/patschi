<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tisch Reservierung</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 8px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f8fafc;
        }
        #root {
            max-width: 100%;
            margin: 0 auto;
        }
        #card-element {
            padding: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            background: white;
        }
        .StripeElement {
            padding: 8px 0;
        }

        /* Normalize input styling across all devices */
        input[type="date"],
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        select,
        textarea {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            font-size: 16px !important;
        }

        @media (min-width: 640px) {
            body {
                padding: 20px;
            }
            #root {
                max-width: 640px;
            }
        }

        @media (min-width: 768px) {
            #root {
                max-width: 768px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createClient } = supabase;

        // Initialize Supabase client
        const supabaseClient = createClient(
            'https://qwwerwkekvmaswusvgxy.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d2Vyd2tla3ZtYXN3dXN2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzkxOTYsImV4cCI6MjA3OTU1NTE5Nn0.LkNZz4Tl0y8DzI4P3dvZn2-5a4FIjE72kYHbhK5_YvE'
        );

        // Initialize Stripe
        const stripe = Stripe('pk_live_51OEezdIQvWRnwONvrkXBEz6EbaztIkLcUGh9X4oa5lFEN3KcCYiZqLT56yfDT4c97UdLsdVmDLQgA0w5eqXZKn9w008uzaLr2X');

        // Icons as SVG components
        const Calendar = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
        );

        const Users = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
        );

        const Mail = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
        );

        const Phone = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
        );

        const MessageSquare = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
        );

        const CreditCard = () => (
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                <line x1="1" y1="10" x2="23" y2="10"></line>
            </svg>
        );

        const Check = () => (
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        );

        function ReservationWidget() {
            // Maintenance mode flag
            const MAINTENANCE_MODE = true;

            const [step, setStep] = useState(1);
            const [rooms, setRooms] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [availabilityChecked, setAvailabilityChecked] = useState(false);
            const [selectedTables, setSelectedTables] = useState([]);
            const [tablesNeeded, setTablesNeeded] = useState(1);
            const [success, setSuccess] = useState(false);
            const [bookingCode, setBookingCode] = useState('');
            const [cardElement, setCardElement] = useState(null);
            const [paymentRequest, setPaymentRequest] = useState(null);
            const [stripeEnabled, setStripeEnabled] = useState(true);

            const [formData, setFormData] = useState({
                party_size: 2,
                reservation_date: '',
                reservation_time: '15:45',
                room_id: '',
                customer_name: '',
                customer_email: '',
                customer_phone: '',
                special_requests: '',
                payment_amount: 35000,
            });

            useEffect(() => {
                loadRooms();
                loadDepositAmount();
                loadStripeSettings();
                initializeStripeElements();
            }, []);

            useEffect(() => {
                setAvailabilityChecked(false);
                setSelectedTables([]);
                setTablesNeeded(1);
                setError('');
            }, [formData.reservation_date, formData.party_size, formData.room_id]);

            const initializeStripeElements = () => {
                try {
                    const elements = stripe.elements();
                    const card = elements.create('card', {
                        style: {
                            base: {
                                fontSize: '16px',
                                color: '#1e293b',
                                fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                                '::placeholder': {
                                    color: '#94a3b8',
                                },
                            },
                            invalid: {
                                color: '#ef4444',
                            },
                        },
                    });
                    setCardElement(card);
                } catch (err) {
                    console.error('Error initializing Stripe elements:', err);
                }
            };

            const initializePaymentRequest = () => {
                if (!formData.payment_amount) return;

                const pr = stripe.paymentRequest({
                    country: 'AT',
                    currency: 'eur',
                    total: {
                        label: 'Reservierungs-Anzahlung',
                        amount: formData.payment_amount,
                    },
                    requestPayerName: true,
                    requestPayerEmail: true,
                });

                pr.canMakePayment().then((result) => {
                    if (result) {
                        setPaymentRequest(pr);
                    }
                });
            };

            useEffect(() => {
                if (step === 3) {
                    initializePaymentRequest();
                    if (cardElement) {
                        setTimeout(() => {
                            try {
                                const cardContainer = document.getElementById('card-element');
                                if (cardContainer && !cardContainer.hasChildNodes()) {
                                    cardElement.mount('#card-element');
                                }
                            } catch (err) {
                                console.error('Error mounting card element:', err);
                            }
                        }, 100);
                    }
                }
            }, [step, cardElement, formData.payment_amount]);

            const loadRooms = async () => {
                const { data } = await supabaseClient
                    .from('rooms')
                    .select('*')
                    .eq('is_active', true)
                    .order('name');

                if (data && data.length > 0) {
                    setRooms(data);
                    setFormData(prev => ({ ...prev, room_id: data[0].id }));
                }
            };

            const loadDepositAmount = async () => {
                const { data: depositData } = await supabaseClient
                    .from('settings')
                    .select('value')
                    .eq('key', 'deposit_amount')
                    .maybeSingle();

                if (depositData) {
                    setFormData(prev => ({ ...prev, payment_amount: parseFloat(depositData.value) * 100 }));
                }
            };

            const loadStripeSettings = async () => {
                const { data: stripeData } = await supabaseClient
                    .from('settings')
                    .select('value')
                    .eq('key', 'stripe_enabled')
                    .maybeSingle();

                if (stripeData) {
                    setStripeEnabled(stripeData.value === 'true');
                }
            };

            const checkAvailability = async () => {
                const apiUrl = `https://qwwerwkekvmaswusvgxy.supabase.co/functions/v1/check-availability`;
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d2Vyd2tla3ZtYXN3dXN2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzkxOTYsImV4cCI6MjA3OTU1NTE5Nn0.LkNZz4Tl0y8DzI4P3dvZn2-5a4FIjE72kYHbhK5_YvE`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        reservation_date: formData.reservation_date,
                        reservation_time: formData.reservation_time,
                        party_size: formData.party_size,
                        room_id: formData.room_id,
                    }),
                });

                if (!response.ok) {
                    throw new Error('Fehler beim Prüfen der Verfügbarkeit');
                }

                return await response.json();
            };

            const handleNextStep = async () => {
                console.log('handleNextStep called, current step:', step);
                setError('');
                setLoading(true);

                try {

                if (step === 1) {
                    if (!formData.reservation_date) {
                        setError('Bitte wählen Sie ein Datum');
                        return;
                    }
                    const selectedDate = new Date(formData.reservation_date);
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    if (selectedDate < today) {
                        setError('Bitte wählen Sie ein zukünftiges Datum');
                        return;
                    }

                    const now = new Date();
                    const currentHour = now.getHours();
                    const currentMinutes = now.getMinutes();
                    const currentTimeInMinutes = currentHour * 60 + currentMinutes;
                    const cutoffTimeInMinutes = 12 * 60;

                    const isToday = selectedDate.getTime() === today.getTime();

                    if (isToday && currentTimeInMinutes >= cutoffTimeInMinutes) {
                        setError('Reservierungen für heute sind nur bis 12:00 Uhr möglich. Bitte wählen Sie ein Datum ab morgen.');
                        return;
                    }

                    if (!formData.party_size || formData.party_size < 1) {
                        setError('Bitte geben Sie die Anzahl der Personen an');
                        return;
                    }

                    // Check availability before proceeding
                    const availability = await checkAvailability();
                    if (!availability.available) {
                        setAvailabilityChecked(false);
                        setSelectedTables([]);
                        setTablesNeeded(1);
                        let errorMessage = availability.message || 'Keine Verfügbarkeit';
                        if (availability.reason === 'closed') {
                            errorMessage = 'An diesem Datum sind alle Tische geschlossen. Bitte wählen Sie ein anderes Datum.';
                        } else if (availability.reason === 'fully_booked') {
                            errorMessage = 'An diesem Datum und dieser Uhrzeit sind alle Tische bereits gebucht. Bitte wählen Sie ein anderes Datum.';
                        } else if (availability.reason === 'capacity_exceeded') {
                            errorMessage = `Leider haben wir keine verfügbaren Tische für ${formData.party_size} Personen. Bitte kontaktieren Sie uns direkt.`;
                        }
                        setError(errorMessage);
                        return;
                    }
                    // Store selected tables info
                    setSelectedTables(availability.selected_tables || []);
                    setTablesNeeded(availability.tables_needed || 1);
                    setAvailabilityChecked(true);
                }

                if (step === 2) {
                    if (!formData.customer_name || !formData.customer_email) {
                        setError('Bitte füllen Sie alle Pflichtfelder aus');
                        return;
                    }
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(formData.customer_email)) {
                        setError('Bitte geben Sie eine gültige E-Mail-Adresse ein');
                        return;
                    }

                    // If Stripe is disabled, create a free reservation directly
                    if (!stripeEnabled) {
                        await createFreeReservation();
                        return;
                    }
                }

                    console.log('Moving to step:', step + 1);
                    setStep(step + 1);
                } catch (err) {
                    console.error('Error in handleNextStep:', err);
                    setError(err.message || 'Ein Fehler ist aufgetreten. Bitte versuchen Sie es erneut.');
                } finally {
                    setLoading(false);
                }
            };

            const createFreeReservation = async () => {
                try {
                    const reservationData = {
                        customer_name: formData.customer_name,
                        customer_email: formData.customer_email,
                        customer_phone: formData.customer_phone || '',
                        party_size: formData.party_size,
                        reservation_date: formData.reservation_date,
                        reservation_time: formData.reservation_time,
                        duration_minutes: 120,
                        status: 'confirmed',
                        special_requests: formData.special_requests || '',
                        payment_status: 'unpaid',
                        payment_amount: 0,
                        payment_method: 'none',
                        booking_method: 'free',
                        room_id: formData.room_id,
                        selected_tables: selectedTables,
                    };

                    const apiUrl = 'https://qwwerwkekvmaswusvgxy.supabase.co/functions/v1/create-reservation';
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d2Vyd2tla3ZtYXN3dXN2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzkxOTYsImV4cCI6MjA3OTU1NTE5Nn0.LkNZz4Tl0y8DzI4P3dvZn2-5a4FIjE72kYHbhK5_YvE',
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(reservationData),
                    });

                    const responseData = await response.json();

                    if (!response.ok) {
                        throw new Error(responseData.error || 'Fehler beim Erstellen der Reservierung');
                    }

                    setBookingCode(responseData.booking_code);
                    setSuccess(true);
                } catch (err) {
                    console.error('Error creating free reservation:', err);
                    setError(err.message || 'Ein Fehler ist aufgetreten. Bitte versuchen Sie es erneut.');
                }
            };

            const createPaymentIntent = async () => {
                try {
                    const apiUrl = 'https://qwwerwkekvmaswusvgxy.supabase.co/functions/v1/create-payment-intent';
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d2Vyd2tla3ZtYXN3dXN2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzkxOTYsImV4cCI6MjA3OTU1NTE5Nn0.LkNZz4Tl0y8DzI4P3dvZn2-5a4FIjE72kYHbhK5_YvE',
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            amount: formData.payment_amount,
                            currency: 'eur',
                            metadata: {
                                customer_name: formData.customer_name,
                                customer_email: formData.customer_email,
                                reservation_date: formData.reservation_date,
                                reservation_time: formData.reservation_time,
                                party_size: formData.party_size.toString(),
                            },
                        }),
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        console.error('Payment intent error:', data);
                        throw new Error(data.error || 'Fehler beim Erstellen der Zahlung');
                    }

                    if (!data.clientSecret) {
                        console.error('No client secret in response:', data);
                        throw new Error('Keine Zahlungsinformationen erhalten');
                    }

                    return data.clientSecret;
                } catch (error) {
                    console.error('createPaymentIntent error:', error);
                    throw error;
                }
            };

            const handleSubmit = async () => {
                if (!stripe || !cardElement) {
                    setError('Stripe ist noch nicht geladen. Bitte versuchen Sie es erneut.');
                    return;
                }

                setLoading(true);
                setError('');

                try {
                    const secret = await createPaymentIntent();

                    const { error: stripeError, paymentIntent } = await stripe.confirmCardPayment(secret, {
                        payment_method: {
                            card: cardElement,
                            billing_details: {
                                name: formData.customer_name,
                                email: formData.customer_email,
                                phone: formData.customer_phone,
                            },
                        },
                    });

                    if (stripeError) {
                        throw new Error(stripeError.message);
                    }

                    if (paymentIntent.status !== 'succeeded') {
                        throw new Error('Zahlung fehlgeschlagen');
                    }

                    const reservationData = {
                        customer_name: formData.customer_name,
                        customer_email: formData.customer_email,
                        customer_phone: formData.customer_phone || '',
                        party_size: formData.party_size,
                        reservation_date: formData.reservation_date,
                        reservation_time: formData.reservation_time,
                        duration_minutes: 120,
                        status: 'confirmed',
                        special_requests: formData.special_requests || '',
                        payment_status: 'paid',
                        payment_amount: formData.payment_amount / 100,
                        payment_method: 'stripe',
                        stripe_payment_intent_id: paymentIntent.id,
                        booking_method: 'online',
                        room_id: formData.room_id,
                        selected_tables: selectedTables,
                    };

                    const apiUrl = 'https://qwwerwkekvmaswusvgxy.supabase.co/functions/v1/create-reservation';
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d2Vyd2tla3ZtYXN3dXN2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzkxOTYsImV4cCI6MjA3OTU1NTE5Nn0.LkNZz4Tl0y8DzI4P3dvZn2-5a4FIjE72kYHbhK5_YvE',
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(reservationData),
                    });

                    const responseData = await response.json();

                    if (!response.ok) {
                        throw new Error(responseData.error || 'Fehler beim Erstellen der Reservierung');
                    }

                    setBookingCode(responseData.booking_code);
                    setSuccess(true);
                } catch (err) {
                    console.error('Error:', err);
                    setError(err.message || 'Ein Fehler ist aufgetreten. Bitte versuchen Sie es erneut.');
                } finally {
                    setLoading(false);
                }
            };

            // Show maintenance notice if enabled
            if (MAINTENANCE_MODE) {
                return (
                    <div style={{maxWidth: '672px', margin: '0 auto', padding: '32px', background: 'white', borderRadius: '24px', boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)'}}>
                        <div style={{textAlign: 'center', padding: '48px 24px'}}>
                            <div style={{width: '80px', height: '80px', background: '#fef3c7', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 24px'}}>
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="8" x2="12" y2="12"></line>
                                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                </svg>
                            </div>
                            <h2 style={{fontSize: '28px', fontWeight: 'bold', color: '#0f172a', marginBottom: '16px'}}>Online-Reservierung nicht verfügbar</h2>
                            <p style={{fontSize: '18px', color: '#475569', lineHeight: '1.6', marginBottom: '12px'}}>
                                Unsere Online-Reservierung ist derzeit nicht verfügbar.
                            </p>
                            <p style={{fontSize: '16px', color: '#64748b', lineHeight: '1.6'}}>
                                Wir entschuldigen uns für die Unannehmlichkeiten und danken für Ihr Verständnis.
                            </p>
                            <div style={{background: '#f8fafc', border: '2px solid #e2e8f0', borderRadius: '16px', padding: '24px', marginTop: '32px', textAlign: 'left'}}>
                                <p style={{fontSize: '16px', color: '#334155', fontWeight: '600', marginBottom: '16px'}}>Für Reservierungen kontaktieren Sie uns bitte:</p>
                                <div style={{display: 'flex', flexDirection: 'column', gap: '12px'}}>
                                    <div style={{display: 'flex', alignItems: 'center', gap: '12px'}}>
                                        <Phone />
                                        <span style={{fontSize: '16px', color: '#475569'}}>+43 5476 6334</span>
                                    </div>
                                    <div style={{display: 'flex', alignItems: 'center', gap: '12px'}}>
                                        <Mail />
                                        <span style={{fontSize: '16px', color: '#475569'}}>info@patschi.at</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (success) {
                return (
                    <div style={{maxWidth: '672px', margin: '0 auto', padding: '32px', background: 'linear-gradient(135deg, #ecfdf5 0%, #f0fdfa 100%)', borderRadius: '24px', boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)'}}>
                        <div style={{textAlign: 'center', padding: '32px 0'}}>
                            <div style={{width: '80px', height: '80px', background: '#10b981', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 24px', boxShadow: '0 10px 15px -3px rgba(16, 185, 129, 0.3)'}}>
                                <Check />
                            </div>
                            <h2 style={{fontSize: '30px', fontWeight: 'bold', color: '#0f172a', marginBottom: '12px'}}>Reservierung bestätigt!</h2>
                            <p style={{fontSize: '18px', color: '#475569', marginBottom: '32px'}}>Vielen Dank für Ihre Buchung</p>

                            </button>
                        ) : (
                            <button
                                onClick={handleSubmit}
                                disabled={loading}
                                style={{flex: 1, minWidth: '200px', padding: '14px 20px', background: loading ? '#94a3b8' : '#10b981', color: 'white', border: 'none', borderRadius: '12px', fontWeight: '600', fontSize: '16px', cursor: loading ? 'not-allowed' : 'pointer', boxShadow: '0 10px 15px -3px rgba(16, 185, 129, 0.3)', opacity: loading ? 0.5 : 1}}
                            >
                                {loading ? 'Wird verarbeitet...' : 'Jetzt bezahlen & buchen'}
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<ReservationWidget />, document.getElementById('root'));
    </script>
</body>
</html>
