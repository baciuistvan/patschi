        // Stripe keys will be loaded from database settings

        function ReservationWidget() {
            // Maintenance mode flag
            const MAINTENANCE_MODE = false;

            // Language state with auto-detection
            const [language, setLanguage] = useState(detectLanguage());
            const t = translations[language];

            const [step, setStep] = useState(1);
            const [rooms, setRooms] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [availabilityChecked, setAvailabilityChecked] = useState(false);
            const [selectedTables, setSelectedTables] = useState([]);
            const [success, setSuccess] = useState(false);
            const [bookingCode, setBookingCode] = useState('');
            const [cardElement, setCardElement] = useState(null);
            const cardElementRef = useRef(null);
            const [paymentRequest, setPaymentRequest] = useState(null);
            const [stripeEnabled, setStripeEnabled] = useState(true);
            const [isTestMode, setIsTestMode] = useState(false);
            const [sessionStarted, setSessionStarted] = useState(false);
            const [paymentIntentCreated, setPaymentIntentCreated] = useState(false);

            const toggleLanguage = () => {
                setLanguage(prev => prev === 'de' ? 'en' : 'de');
            };

            // Update document title when language changes
            useEffect(() => {
                document.title = language === 'de' ? 'Tisch Reservierung' : 'Table Reservation';
                document.documentElement.lang = language;
            }, [language]);

            // Process Stripe error messages into user-friendly text
            const processStripeError = (errorMessage) => {
                if (!errorMessage) return t.errors.paymentFailed;

                const lowerMsg = errorMessage.toLowerCase();

                // Check for test mode / test card errors
                if (lowerMsg.includes('test') && (lowerMsg.includes('card') || lowerMsg.includes('kártya'))) {
                    return t.errors.testCardRequired;
                }

                // Check for card declined errors
                if (lowerMsg.includes('declined') || lowerMsg.includes('elutasított') || lowerMsg.includes('abgelehnt')) {
                    return t.errors.cardDeclined;
                }

                // Return original message if it's short and clear
                if (errorMessage.length < 100) {
                    return errorMessage;
                }

                // Default to generic payment error
                return t.errors.paymentFailed;
            };

            const [formData, setFormData] = useState({
                party_size: 2,
                reservation_date: '',
                reservation_time: '15:45',
                room_id: '',
                customer_name: '',
                customer_email: '',
                customer_phone: '',
                special_requests: '',
                payment_amount: 35000,
            });
            const formDataRef = useRef(formData);
            const setFormDataAndRef = (updater) => {
                setFormData(prev => {
                    const next = typeof updater === 'function' ? updater(prev) : updater;
                    formDataRef.current = next;
                    return next;
                });
            };

            useEffect(() => {
                console.log('Component mounted, Stripe available:', typeof Stripe !== 'undefined');
                const initialize = async () => {
                    loadRooms();
                    loadDepositAmount();
                    await loadStripeSettings();
                    setSessionStarted(true);
                };
                initialize();

                // Track page abandonment
                const handleBeforeUnload = () => {
                    if (!success && sessionStarted && formData.customer_name) {
                        logAbandonment();
                    }
                };

                window.addEventListener('beforeunload', handleBeforeUnload);
                return () => window.removeEventListener('beforeunload', handleBeforeUnload);
            }, [success, sessionStarted, formData.customer_name]);

            useEffect(() => {
                setAvailabilityChecked(false);
                setSelectedTables([]);
                setError('');
            }, [formData.reservation_date, formData.party_size, formData.room_id]);

            const initializeStripeElements = () => {
                try {
                    if (!stripe) {
                        console.warn('Stripe not available, skipping card element initialization');
                        setStripeEnabled(false);
                        return;
                    }
                    console.log('Creating Stripe Elements instance');
                    const elements = stripe.elements();
                    console.log('Creating card element');
                    const card = elements.create('card', {
                        style: {
                            base: {
                                fontSize: '16px',
                                color: '#1e293b',
                                fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                                '::placeholder': {
                                    color: '#94a3b8',
                                },
                            },
                            invalid: {
                                color: '#ef4444',
                            },
                        },
                    });
                    console.log('Card element created successfully:', card);
                    cardElementRef.current = card;
                    setCardElement(card);
                } catch (err) {
                    console.error('Error initializing Stripe elements:', err);
                    setStripeEnabled(false);
                }
            };

            const initializePaymentRequest = () => {
                if (!formData.payment_amount || !stripe) return;

                try {
                    const pr = stripe.paymentRequest({
                        country: 'AT',
                        currency: 'eur',
                        total: {
                            label: language === 'de' ? 'Reservierungs-Anzahlung' : 'Reservation Deposit',
                            amount: formData.payment_amount,
                        },
                        requestPayerName: true,
                        requestPayerEmail: true,
                    });

                    pr.canMakePayment().then((result) => {
                        if (result) {
                            setPaymentRequest(pr);
                        }
                    });
                } catch (err) {
                    console.error('Error initializing payment request:', err);
                }
            };

            useEffect(() => {
                if (step === 3) {
                    const card = cardElementRef.current || cardElement;
                    console.log('Step 3 reached, cardElement from ref:', cardElementRef.current, 'from state:', cardElement);
                    initializePaymentRequest();
                    if (card) {
                        setTimeout(() => {
                            try {
                                const cardContainer = document.getElementById('card-element');
                                console.log('Attempting to mount card element, container:', cardContainer, 'hasChildren:', cardContainer?.hasChildNodes());
                                if (cardContainer && !cardContainer.hasChildNodes()) {
                                    console.log('Mounting card element to #card-element');
                                    card.mount('#card-element');
                                    console.log('Card element mounted successfully');
                                }
                            } catch (err) {
                                console.error('Error mounting card element:', err);
                                setError(t.errors.paymentError);
                            }
                        }, 100);
                    } else {
                        console.warn('No card element available at step 3');
                    }
                }
            }, [step, cardElement, formData.payment_amount]);

            const loadRooms = async () => {
                const { data } = await supabaseClient
                    .from('rooms')
                    .select('*')
                    .eq('is_active', true)
                    .order('name');

                if (data && data.length > 0) {
                    setRooms(data);
                    setFormDataAndRef(prev => ({ ...prev, room_id: data[0].id }));
                }
            };

            const loadDepositAmount = async () => {
                const { data: depositData } = await supabaseClient
                    .from('settings')
                    .select('value')
                    .eq('key', 'deposit_amount')
                    .maybeSingle();

                if (depositData) {
                    setFormDataAndRef(prev => ({ ...prev, payment_amount: parseFloat(depositData.value) * 100 }));
                }
            };

            const loadStripeSettings = async () => {
                try {
                    // Load all Stripe settings
                    const { data: settings } = await supabaseClient
                        .from('settings')
                        .select('key, value')
                        .in('key', ['stripe_enabled', 'stripe_mode', 'stripe_live_publishable_key', 'stripe_test_publishable_key']);

                    const settingsMap = {};
                    settings?.forEach(s => settingsMap[s.key] = s.value);

                    const enabled = settingsMap['stripe_enabled'] === 'true';
                    const mode = settingsMap['stripe_mode'] || 'test';
                    const testKey = settingsMap['stripe_test_publishable_key'];
                    const liveKey = settingsMap['stripe_live_publishable_key'];

                    console.log('Stripe settings loaded - enabled:', enabled, 'mode:', mode, 'hasTestKey:', !!testKey, 'hasLiveKey:', !!liveKey);

                    setStripeEnabled(enabled);

                    // Initialize Stripe with the correct key
                    if (enabled && typeof Stripe !== 'undefined') {
                        const stripeKey = mode === 'live' ? liveKey : testKey;

                        if (!stripeKey) {
                            console.error('Stripe key not found in settings for mode:', mode);
                            setError('Stripe ist nicht konfiguriert. Bitte kontaktieren Sie den Administrator.');
                            setStripeEnabled(false);
                            return;
                        }

                        console.log('Initializing Stripe with', mode, 'key');

                        // Detect if we're in test mode
                        const testMode = stripeKey.startsWith('pk_test_');
                        setIsTestMode(testMode);
                        console.log('Stripe mode detected:', testMode ? 'test' : 'live');

                        stripe = Stripe(stripeKey);

                        // Initialize card element immediately after Stripe is ready
                        setTimeout(() => {
                            console.log('Creating Stripe card element');
                            initializeStripeElements();
                        }, 100);
                    } else {
                        console.warn('Stripe not enabled or not available');
                    }
                } catch (err) {
                    console.error('Error loading Stripe settings:', err);
                    setStripeEnabled(false);
                }
            };

            const logAbandonment = async (stage = null, reason = null, errorMsg = null, paymentIntentId = null) => {
                try {
                    // Determine stage automatically if not provided
                    let abandonmentStage = stage;
                    if (!abandonmentStage) {
                        if (step === 1) {
                            abandonmentStage = 'form_incomplete';
                        } else if (step === 2) {
                            abandonmentStage = 'cancelled_before_payment';
                        } else if (step === 3) {
                            abandonmentStage = paymentIntentCreated ? 'payment_initiated' : 'cancelled_before_payment';
                        }
                    }

                    const room = rooms.find(r => r.id === formData.room_id);

                    await supabaseClient.from('abandoned_reservations').insert({
                        customer_name: formData.customer_name || 'Unbekannt',
                        customer_email: formData.customer_email || 'nicht angegeben',
                        customer_phone: formData.customer_phone || null,
                        reservation_date: formData.reservation_date || new Date().toISOString().split('T')[0],
                        reservation_time: formData.reservation_time || '15:45',
                        party_size: formData.party_size || 2,
                        room_id: formData.room_id || null,
                        room_name: room?.name || null,
                        abandonment_stage: abandonmentStage,
                        abandonment_reason: reason,
                        error_message: errorMsg,
                        payment_intent_id: paymentIntentId,
                        amount: stripeEnabled ? formData.payment_amount : null,
                    });

                    console.log('Abandonment logged:', abandonmentStage);
                } catch (err) {
                    console.error('Error logging abandonment:', err);
                }
            };

            const checkAvailability = async (overrideData) => {
                const data = overrideData || formData;
                console.log('[widget] checkAvailability called with room_id:', data.room_id, 'date:', data.reservation_date);
                const apiUrl = `https://qwwerwkekvmaswusvgxy.supabase.co/functions/v1/check-availability`;
                const response = await fetch(apiUrl, {

                        setError(t.errors.futureDate);
                        return;

                    const isToday = selectedDate.getTime() === today.getTime();

                        return;

                                <p style={{fontSize: '12px', color: '#64748b', marginTop: '4px'}}>{t.step1.timeNote}</p>
                            </div>

                            <div>
                                <label style={{display: 'flex', alignItems: 'center', fontSize: '14px', fontWeight: '600', color: '#334155', marginBottom: '10px'}}>
                                    <Users /> <span style={{marginLeft: '8px'}}>{t.step1.partySize}</span>
                                </label>
                                <input
                                    type="number"
                                    min="1"
                                    max="10"
                                    value={formData.party_size}
                                    onChange={(e) => {
                                        const value = e.target.value;
                                        const numValue = parseInt(value);
                                        if (value === '' || (numValue >= 1 && numValue <= 10)) {
                                            setFormDataAndRef(prev => ({ ...prev, party_size: value === '' ? '' : numValue }));
                                        }
                                    }}
                                    style={{width: '100%', padding: '12px 12px', border: '2px solid #cbd5e1', borderRadius: '12px', fontSize: '16px', height: '48px', boxSizing: 'border-box'}}
                                />
                            </div>

                            {rooms.length > 1 && (
                                <div>
                                    <label style={{display: 'block', fontSize: '14px', fontWeight: '600', color: '#334155', marginBottom: '10px'}}>
                                        {t.step1.area}
                                    </label>
                                    <select
                                        value={formData.room_id}
                                        onChange={(e) => setFormDataAndRef(prev => ({ ...prev, room_id: e.target.value }))}
                                        style={{width: '100%', padding: '12px 12px', border: '2px solid #cbd5e1', borderRadius: '12px', fontSize: '16px', height: '48px', boxSizing: 'border-box'}}
                                    >
                                        {rooms.map((room) => (
                                            <option key={room.id} value={room.id}>{room.name}</option>
                                        ))}
                                    </select>
                                </div>
                            )}
                        </div>
                    )}

                    {step === 2 && (
                        <div style={{display: 'flex', flexDirection: 'column', gap: '20px'}}>
                            <h3 style={{fontSize: '18px', fontWeight: 'bold', color: '#0f172a', marginBottom: '4px'}}>{t.step2.heading}</h3>

                            {!stripeEnabled && (
                                <div style={{background: '#dbeafe', border: '2px solid #93c5fd', borderRadius: '12px', padding: '20px'}}>
                                    <p style={{fontSize: '14px', color: '#1e40af'}}>
                                        <strong>Info:</strong> {t.step2.noDeposit}
                                    </p>
                                </div>
                            )}

                            <div>
                                <label style={{display: 'flex', alignItems: 'center', fontSize: '14px', fontWeight: '600', color: '#334155', marginBottom: '10px'}}>
                                    <Users /> <span style={{marginLeft: '8px'}}>{t.step2.name}</span>
                                </label>
                                <input
                                    type="text"
                                    value={formData.customer_name}
                                    onChange={(e) => setFormDataAndRef(prev => ({ ...prev, customer_name: e.target.value }))}
                                    placeholder={t.step2.placeholder.name}
                                    style={{width: '100%', padding: '12px 12px', border: '2px solid #cbd5e1', borderRadius: '12px', fontSize: '16px', height: '48px', boxSizing: 'border-box'}}
                                />
                            </div>

                            <div>
                                <label style={{display: 'flex', alignItems: 'center', fontSize: '14px', fontWeight: '600', color: '#334155', marginBottom: '10px'}}>
                                    <Mail /> <span style={{marginLeft: '8px'}}>{t.step2.email}</span>
                                </label>
                                <input
                                    type="email"
                                    value={formData.customer_email}
                                    onChange={(e) => setFormDataAndRef(prev => ({ ...prev, customer_email: e.target.value }))}
                                    placeholder={t.step2.placeholder.email}
                                    style={{width: '100%', padding: '12px 12px', border: '2px solid #cbd5e1', borderRadius: '12px', fontSize: '16px', height: '48px', boxSizing: 'border-box'}}
                                />
                            </div>

                            <div>
                                <label style={{display: 'flex', alignItems: 'center', fontSize: '14px', fontWeight: '600', color: '#334155', marginBottom: '10px'}}>
                                    <Phone /> <span style={{marginLeft: '8px'}}>{t.step2.phone}</span>
                                </label>
                                <input
                                    type="tel"
                                    value={formData.customer_phone}
                                    onChange={(e) => setFormDataAndRef(prev => ({ ...prev, customer_phone: e.target.value }))}
                                    placeholder={t.step2.placeholder.phone}
                                    style={{width: '100%', padding: '12px 12px', border: '2px solid #cbd5e1', borderRadius: '12px', fontSize: '16px', height: '48px', boxSizing: 'border-box'}}
                                />
                            </div>

                            <div>
                                <label style={{display: 'flex', alignItems: 'center', fontSize: '14px', fontWeight: '600', color: '#334155', marginBottom: '10px'}}>
                                    <MessageSquare /> <span style={{marginLeft: '8px'}}>{t.step2.specialRequests}</span>
                                </label>
                                <textarea
                                    value={formData.special_requests}
                                    onChange={(e) => setFormDataAndRef(prev => ({ ...prev, special_requests: e.target.value }))}
                                    rows={4}
                                    placeholder={t.step2.placeholder.requests}
                                    style={{width: '100%', padding: '12px 12px', border: '2px solid #cbd5e1', borderRadius: '12px', fontSize: '16px', boxSizing: 'border-box'}}
                                />
                            </div>
                        </div>
                    )}

                    {step === 3 && stripeEnabled && (
                        <div style={{display: 'flex', flexDirection: 'column', gap: '20px'}}>
                            <h3 style={{fontSize: '18px', fontWeight: 'bold', color: '#0f172a', marginBottom: '4px'}}>{t.step3.heading}</h3>

                            {isTestMode && (
                                <div style={{background: '#fef3c7', border: '2px solid #fcd34d', borderRadius: '12px', padding: '16px'}}>
                                    <p style={{fontSize: '13px', color: '#78350f', fontWeight: '600', marginBottom: '8px'}}>
                                        {language === 'de' ? '⚠️ Test-Modus' : '⚠️ Test Mode'}
                                    </p>
                                    <p style={{fontSize: '13px', color: '#78350f', marginBottom: '8px'}}>
                                        {language === 'de'
                                            ? 'Verwenden Sie eine Test-Kartennummer:'
                                            : 'Use a test card number:'}
                                    </p>
                                    <p style={{fontSize: '13px', color: '#78350f', fontFamily: 'monospace', background: '#fef9e5', padding: '8px', borderRadius: '6px'}}>
                                        4242 4242 4242 4242
                                    </p>
                                    <p style={{fontSize: '12px', color: '#92400e', marginTop: '8px'}}>
                                        {language === 'de'
                                            ? 'CVC: beliebige 3 Ziffern • Ablaufdatum: beliebiges zukünftiges Datum'
                                            : 'CVC: any 3 digits • Expiry: any future date'}
                                    </p>
                                </div>
                            )}

                            <div style={{background: 'linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%)', borderRadius: '16px', padding: '24px', border: '2px solid #e2e8f0'}}>
                                <h4 style={{fontWeight: 'bold', fontSize: '18px', color: '#0f172a', marginBottom: '16px'}}>{t.step3.summary}</h4>
                                <div style={{display: 'flex', flexDirection: 'column', gap: '12px', fontSize: '16px'}}>
                                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                                        <span style={{color: '#475569'}}>{t.step3.date}</span>
                                        <span style={{fontWeight: '600', color: '#0f172a'}}>
                                            {new Date(formData.reservation_date).toLocaleDateString(language === 'de' ? 'de-DE' : 'en-US', {
                                                weekday: 'short',
                                                year: 'numeric',
                                                month: 'long',
                                                day: 'numeric'
                                            })}
                                        </span>
                                    </div>
                                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                                        <span style={{color: '#475569'}}>{t.step3.time}</span>
                                        <span style={{fontWeight: '600', color: '#0f172a'}}>15:45{language === 'de' ? ' Uhr' : ''}</span>
                                    </div>
                                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                                        <span style={{color: '#475569'}}>{t.step3.guests}</span>
                                        <span style={{fontWeight: '600', color: '#0f172a'}}>{formData.party_size}</span>
                                    </div>
                                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingTop: '12px', marginTop: '12px', borderTop: '2px solid #cbd5e1'}}>
                                        <span style={{fontWeight: 'bold', fontSize: '18px', color: '#334155'}}>{t.step3.deposit}</span>
                                        <span style={{fontWeight: 'bold', fontSize: '24px', color: '#10b981'}}>
                                            €{(formData.payment_amount / 100).toFixed(2)}
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div style={{background: '#fef3c7', border: '2px solid #fcd34d', borderRadius: '12px', padding: '20px'}}>
                                <p style={{fontSize: '14px', color: '#78350f'}}>
                                    <strong>{t.success.important}</strong> {t.step3.depositRequired} €{(formData.payment_amount / 100).toFixed(2)} {t.step3.depositRequired2}
                                </p>
                            </div>

                            <div>
                                <label style={{display: 'flex', alignItems: 'center', fontSize: '16px', fontWeight: '600', color: '#334155', marginBottom: '12px'}}>
                                    <CreditCard /> <span style={{marginLeft: '8px'}}>{t.step3.paymentMethod}</span>
                                </label>

                {paymentRequest && (
                                    <div style={{marginBottom: '16px'}}>
                                        <button
                                            type="button"
                                            onClick={async () => {
                                                setLoading(true);
                                                setError('');
                                                // Read from ref — always has the latest values regardless of closure age
                                                const prFd = formDataRef.current;
                                                try {
                                                    // Re-verify availability to get fresh table IDs
                                                    const prAvailability = await checkAvailability(prFd);
                                                    if (!prAvailability.available) {
                                                        setStep(1);
                                                        setAvailabilityChecked(false);
                                                        setSelectedTables([]);
                                                        setError(prAvailability.message || t.errors.noAvailability);
                                                        setLoading(false);
                                                        return;
                                                    }
                                                    const prFreshTables = prAvailability.selected_tables || [];

                                                    const secret = await createPaymentIntent();
                                                    if (!secret) {
                                                        throw new Error(t.errors.paymentError);
                                                    }

                                                    paymentRequest.update({
                                                        total: {
                                                            label: language === 'de' ? 'Reservierungs-Anzahlung' : 'Reservation Deposit',
                                                            amount: prFd.payment_amount,
                                                        },
                                                    });

                                                    // Remove any existing listeners
                                                    paymentRequest.off('paymentmethod');

                                                    // Add the payment method handler
                                                    paymentRequest.on('paymentmethod', async (ev) => {
                                                        try {
                                                            const result = await stripe.confirmCardPayment(secret, {
                                                                payment_method: ev.paymentMethod.id,
                                                            });

                                                            if (result.error) {
                                                                ev.complete('fail');
                                                                await logAbandonment('payment_failed', 'Payment Request API error', result.error.message, null);
                                                                setError(processStripeError(result.error.message));
                                                                setLoading(false);
                                                            } else {
                                                                ev.complete('success');

                                                                const reservationData = {
                                                                    customer_name: prFd.customer_name,
                                                                    customer_email: prFd.customer_email,
                                                                    customer_phone: prFd.customer_phone || '',
                                                                    party_size: prFd.party_size,
                                                                    reservation_date: prFd.reservation_date,
                                                                    reservation_time: prFd.reservation_time,
                                                                    duration_minutes: 120,
                                                                    status: 'confirmed',
                                                                    special_requests: prFd.special_requests || '',
                                                                    payment_status: 'paid',
                                                                    payment_amount: prFd.payment_amount / 100,
                                                                    payment_method: 'stripe',
                                                                    stripe_payment_intent_id: result.paymentIntent.id,
                                                                    booking_method: 'online',
                                                                    room_id: prFd.room_id,
                                                                    selected_tables: prFreshTables,
                                                                };

                                                                const apiUrl = 'https://qwwerwkekvmaswusvgxy.supabase.co/functions/v1/create-reservation';
                                                                const response = await fetch(apiUrl, {
                                                                    method: 'POST',
                                                                    headers: {
                                                                        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d2Vyd2tla3ZtYXN3dXN2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzkxOTYsImV4cCI6MjA3OTU1NTE5Nn0.LkNZz4Tl0y8DzI4P3dvZn2-5a4FIjE72kYHbhK5_YvE',
                                                                        'Content-Type': 'application/json',
                                                                    },
                                                                    body: JSON.stringify(reservationData),
                                                                });

                                                                const responseData = await response.json();
                                                                if (response.ok) {
                                                                    setBookingCode(responseData.booking_code);
                                                                    setSuccess(true);
                                                                    setLoading(false);
                                                                } else {
                                                                    throw new Error(responseData.error || 'Fehler beim Erstellen der Reservierung');
                                                                }
                                                            }
                                                        } catch (err) {
                                                            ev.complete('fail');
                                                            setError(err.message || t.errors.paymentError);
                                                            setLoading(false);
                                                        }
                                                    });

                                                    paymentRequest.show();
                                                } catch (err) {
                                                    setError(err.message || t.errors.paymentError);
                                                    setLoading(false);
                                                }
                                            }}
                                            disabled={loading}
                                            style={{width: '100%', padding: '14px 20px', background: loading ? '#94a3b8' : '#1e293b', color: 'white', border: 'none', borderRadius: '12px', fontWeight: '600', fontSize: '16px', cursor: loading ? 'not-allowed' : 'pointer', boxShadow: '0 10px 15px -3px rgba(0, 0, 0, 0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', opacity: loading ? 0.5 : 1}}
                                        >
                                            <CreditCard />
                                            {loading ? t.buttons.processing : t.step3.appleGooglePay}
                                        </button>
                                        <div style={{position: 'relative', margin: '24px 0'}}>
                                            <div style={{position: 'absolute', inset: 0, display: 'flex', alignItems: 'center'}}>
                                                <div style={{width: '100%', borderTop: '1px solid #cbd5e1'}}></div>
                                            </div>
                                            <div style={{position: 'relative', display: 'flex', justifyContent: 'center', fontSize: '14px'}}>
                                                <span style={{background: 'white', padding: '0 16px', color: '#64748b'}}>{t.step3.orPayWithCard}</span>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div id="card-element"></div>
                            </div>

                            <div style={{background: '#dbeafe', border: '2px solid #93c5fd', borderRadius: '12px', padding: '20px'}}>
                                <p style={{fontSize: '12px', color: '#1e40af'}}>
                                    {t.step3.securePayment}
                                </p>
                            </div>
                        </div>
                    )}

                    <div style={{display: 'flex', gap: '12px', marginTop: '24px', flexWrap: 'wrap'}}>
                        {step > 1 && (
                            <button
                                onClick={() => setStep(step - 1)}
                                style={{flex: 1, minWidth: '120px', padding: '14px 20px', border: '2px solid #cbd5e1', color: '#334155', borderRadius: '12px', background: 'white', fontWeight: '600', fontSize: '16px', cursor: 'pointer'}}
                            >
                                {t.buttons.back}
                            </button>
                        )}
                        {step < 3 ? (
                            <button
                                onClick={handleNextStep}
                                disabled={loading}
                                style={{flex: 1, minWidth: '120px', padding: '14px 20px', background: '#10b981', color: 'white', border: 'none', borderRadius: '12px', fontWeight: '600', fontSize: '16px', cursor: loading ? 'not-allowed' : 'pointer', boxShadow: '0 10px 15px -3px rgba(16, 185, 129, 0.3)', transition: 'transform 0.2s', opacity: loading ? 0.5 : 1}}
                                onMouseOver={(e) => !loading && (e.target.style.transform = 'scale(1.05)')}
                                onMouseOut={(e) => !loading && (e.target.style.transform = 'scale(1)')}
                            >
                                {loading && step === 1
                                    ? t.buttons.checkingAvailability
                                    : loading && step === 2 && !stripeEnabled
                                    ? t.buttons.creatingReservation
                                    : step === 2 && !stripeEnabled
                                    ? t.buttons.completeReservation
                                    : t.buttons.next}
                            </button>
                        ) : (
                            <button
                                onClick={handleSubmit}
                                disabled={loading}
                                style={{flex: 1, minWidth: '200px', padding: '14px 20px', background: loading ? '#94a3b8' : '#10b981', color: 'white', border: 'none', borderRadius: '12px', fontWeight: '600', fontSize: '16px', cursor: loading ? 'not-allowed' : 'pointer', boxShadow: '0 10px 15px -3px rgba(16, 185, 129, 0.3)', opacity: loading ? 0.5 : 1}}
                            >
                                {loading ? t.buttons.processing : t.step3.payNow}
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<ReservationWidget />, document.getElementById('root'));
    </script>
</body>
</html>
