<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ProBooks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="app"></div>

    <script>
        const SUPABASE_URL = 'https://typspuhpjefedpqayunm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5cHNwdWhwamVmZWRwcWF5dW5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI1MDUyMDksImV4cCI6MjA3ODA4MTIwOX0.2piQoBkHNTVtBEIZYpEU3eDZvBDJeznxlLacqeM-9OU';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let state = {
            user: null,
            adminUser: null,
            selectedSystem: null,
            currentView: 'home',
            loading: true,
            reservations: [],
            giftCards: [],
            rooms: [],
            tables: [],
        };

        function setState(newState) {
            state = { ...state, ...newState };
            render();
        }

        // Auth functions
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                const { data: adminUser } = await supabase
                    .from('admin_users')
                    .select('*')
                    .eq('id', session.user.id)
                    .maybeSingle();

                setState({ user: session.user, adminUser, loading: false });
            } else {
                setState({ loading: false });
            }
        }

        async function signIn(email, password) {
            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;

                const { data: adminUser } = await supabase
                    .from('admin_users')
                    .select('*')
                    .eq('id', data.user.id)
                    .maybeSingle();

                setState({ user: data.user, adminUser });
            } catch (error) {
                alert('Login failed: ' + error.message);
            }
        }

        async function signOut() {
            await supabase.auth.signOut();
            setState({ user: null, adminUser: null, selectedSystem: null });
        }

        // Data fetching functions
        async function loadReservations() {
            const { data } = await supabase
                .from('reservations')
                .select(`
                    *,
                    rooms (name),
                    reservation_tables (
                        tables (table_number, custom_label)
                    )
                `)
                .order('reservation_date', { ascending: false });
            setState({ reservations: data || [] });
        }

        async function loadGiftCards() {
            const { data } = await supabase
                .from('gift_cards')
                .select('*')
                .order('created_at', { ascending: false });
            setState({ giftCards: data || [] });
        }

        async function loadRooms() {
            const { data } = await supabase
                .from('rooms')
                .select('*')
                .order('name');
            setState({ rooms: data || [] });
        }

        async function loadTables() {
            const { data } = await supabase
                .from('tables')
                .select('*')
                .order('table_number');
            setState({ tables: data || [] });
        }

        // Components
        function LoginPage() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-slate-100">
                    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4">
                                <span class="text-white font-bold text-2xl">PB</span>
                            </div>
                            <h1 class="text-2xl font-bold text-slate-900">Admin Login</h1>
                            <p class="text-slate-600">ProBooks Management System</p>
                        </div>
                        <form id="loginForm" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">Email</label>
                                <input type="email" id="email" required
                                    class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                                <input type="password" id="password" required
                                    class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                            <button type="submit"
                                class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition">
                                Sign In
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function SystemSelector() {
            return `
                <div class="min-h-screen bg-slate-50">
                    <nav class="bg-white border-b border-slate-200">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div class="flex items-center justify-between h-16">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center">
                                        <span class="text-white font-bold">PB</span>
                                    </div>
                                    <div>
                                        <h1 class="text-lg font-bold text-slate-900">ProBooks</h1>
                                        <p class="text-xs text-slate-600">Management System</p>
                                    </div>
                                </div>
                                <button onclick="signOut()" class="px-4 py-2 text-slate-600 hover:text-slate-900">
                                    Sign Out
                                </button>
                            </div>
                        </div>
                    </nav>

                    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                        <div class="text-center mb-12">
                            <h2 class="text-4xl font-bold text-slate-900 mb-4">Choose Your System</h2>
                            <p class="text-slate-600 text-lg">Select which system you want to manage</p>
                        </div>

                        <div class="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto">
                            <button onclick="setState({ selectedSystem: 'reservations' })"
                                class="bg-white rounded-2xl shadow-lg border-2 border-slate-200 hover:border-blue-500 transition-all p-8 text-center hover:shadow-2xl">
                                <div class="w-20 h-20 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-6">
                                    <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                    </svg>
                                </div>
                                <h3 class="text-2xl font-bold text-slate-900 mb-3">Table Reservations</h3>
                                <p class="text-slate-600">Manage table bookings and floor plans</p>
                            </button>

                            <button onclick="setState({ selectedSystem: 'gift-cards' })"
                                class="bg-white rounded-2xl shadow-lg border-2 border-slate-200 hover:border-green-500 transition-all p-8 text-center hover:shadow-2xl">
                                <div class="w-20 h-20 bg-green-100 rounded-2xl flex items-center justify-center mx-auto mb-6">
                                    <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"></path>
                                    </svg>
                                </div>
                                <h3 class="text-2xl font-bold text-slate-900 mb-3">Gift Cards</h3>
                                <p class="text-slate-600">Create and manage digital gift cards</p>
                            </button>
                        </div>
                    </main>
                </div>
            `;
        }

        function ReservationDashboard() {
            const { reservations } = state;
            return `
                <div class="min-h-screen bg-slate-50">
                    ${NavBar('reservations')}
                    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <div class="mb-8">
                            <h2 class="text-3xl font-bold text-slate-900">Table Reservations</h2>
                            <p class="text-slate-600">Manage your restaurant bookings</p>
                        </div>

                        <div class="bg-white rounded-lg shadow-lg p-6">
                            <div class="flex justify-between items-center mb-6">
                                <h3 class="text-xl font-semibold">Recent Reservations</h3>
                                <button onclick="loadReservations()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                    Refresh
                                </button>
                            </div>

                            <div class="overflow-x-auto">
                                <table class="w-full">
                                    <thead class="bg-slate-50 border-b">
                                        <tr>
                                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Date</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Time</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Name</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Party Size</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y">
                                        ${reservations.map(res => `
                                            <tr class="hover:bg-slate-50">
                                                <td class="px-4 py-3 text-sm">${new Date(res.reservation_date).toLocaleDateString()}</td>
                                                <td class="px-4 py-3 text-sm">${res.reservation_time}</td>
                                                <td class="px-4 py-3 text-sm font-medium">${res.customer_name}</td>
                                                <td class="px-4 py-3 text-sm">${res.party_size} guests</td>
                                                <td class="px-4 py-3 text-sm">
                                                    <span class="px-2 py-1 bg-${res.status === 'confirmed' ? 'green' : 'yellow'}-100 text-${res.status === 'confirmed' ? 'green' : 'yellow'}-800 rounded-full text-xs">
                                                        ${res.status}
                                                    </span>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        function GiftCardDashboard() {
            const { giftCards } = state;
            return `
                <div class="min-h-screen bg-slate-50">
                    ${NavBar('gift-cards')}
                    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <div class="mb-8">
                            <h2 class="text-3xl font-bold text-slate-900">Gift Cards</h2>
                            <p class="text-slate-600">Manage your digital gift cards</p>
                        </div>

                        <div class="bg-white rounded-lg shadow-lg p-6">
                            <div class="flex justify-between items-center mb-6">
                                <h3 class="text-xl font-semibold">Gift Card List</h3>
                                <button onclick="loadGiftCards()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                                    Refresh
                                </button>
                            </div>

                            <div class="overflow-x-auto">
                                <table class="w-full">
                                    <thead class="bg-slate-50 border-b">
                                        <tr>
                                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Code</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Amount</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Balance</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Recipient</th>
                                            <th class="px-4 py-3 text-left text-sm font-semibold text-slate-900">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y">
                                        ${giftCards.map(card => `
                                            <tr class="hover:bg-slate-50">
                                                <td class="px-4 py-3 text-sm font-mono">${card.code}</td>
                                                <td class="px-4 py-3 text-sm">€${card.amount}</td>
                                                <td class="px-4 py-3 text-sm font-medium">€${card.balance}</td>
                                                <td class="px-4 py-3 text-sm">${card.recipient_email}</td>
                                                <td class="px-4 py-3 text-sm">
                                                    <span class="px-2 py-1 bg-${card.status === 'active' ? 'green' : card.status === 'redeemed' ? 'slate' : 'yellow'}-100 text-${card.status === 'active' ? 'green' : card.status === 'redeemed' ? 'slate' : 'yellow'}-800 rounded-full text-xs">
                                                        ${card.status}
                                                    </span>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        function NavBar(system) {
            return `
                <nav class="bg-white border-b border-slate-200">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex items-center justify-between h-16">
                            <div class="flex items-center space-x-4">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 bg-${system === 'gift-cards' ? 'green' : 'blue'}-600 rounded-lg flex items-center justify-center">
                                        <span class="text-white font-bold">PB</span>
                                    </div>
                                    <div>
                                        <h1 class="text-lg font-bold text-slate-900">${system === 'gift-cards' ? 'Gift Cards' : 'Reservations'}</h1>
                                        <p class="text-xs text-slate-600">ProBooks</p>
                                    </div>
                                </div>
                                <button onclick="setState({ selectedSystem: null })"
                                    class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm">
                                    Switch System
                                </button>
                            </div>
                            <div class="flex items-center space-x-4">
                                <span class="text-sm text-slate-600">${state.adminUser?.full_name}</span>
                                <button onclick="signOut()"
                                    class="px-4 py-2 text-slate-600 hover:text-slate-900 text-sm">
                                    Sign Out
                                </button>
                            </div>
                        </div>
                    </div>
                </nav>
            `;
        }

        function render() {
            const app = document.getElementById('app');

            if (state.loading) {
                app.innerHTML = '<div class="min-h-screen flex items-center justify-center"><div class="text-slate-900">Loading...</div></div>';
                return;
            }

            if (!state.user || !state.adminUser) {
                app.innerHTML = LoginPage();
                document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    await signIn(email, password);
                });
                return;
            }

            if (!state.selectedSystem) {
                app.innerHTML = SystemSelector();
                return;
            }

            if (state.selectedSystem === 'reservations') {
                if (state.reservations.length === 0) loadReservations();
                app.innerHTML = ReservationDashboard();
                return;
            }

            if (state.selectedSystem === 'gift-cards') {
                if (state.giftCards.length === 0) loadGiftCards();
                app.innerHTML = GiftCardDashboard();
                return;
            }
        }

        // Initialize
        checkAuth();
    </script>
</body>
</html>
