<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resend Gift Card Emails</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
  <div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
      <h1 class="text-2xl font-bold text-gray-900 mb-4">📧 Resend Gift Card Emails</h1>
      <p class="text-gray-600 mb-4">This tool resends emails for gift cards that have PDFs but were never emailed.</p>

      <button
        onclick="findAndResend()"
        class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-semibold"
      >
        Find & Resend Missing Emails
      </button>
    </div>

    <div id="results" class="space-y-4"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabaseUrl = 'https://qwwerwkekvmaswusvgxy.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d2Vyd2tla3ZtYXN3dXN2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzkxOTYsImV4cCI6MjA3OTU1NTE5Nn0.LkNZz4Tl0y8DzI4P3dvZn2-5a4FIjE72kYHbhK5_YvE';
    const supabase = createClient(supabaseUrl, supabaseKey);

    window.supabase = supabase;

    window.findAndResend = async function() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<div class="bg-white rounded-lg shadow p-6"><p class="text-gray-600">Searching for gift cards...</p></div>';

      try {
        // Find gift cards with PDFs but status "active" (meaning paid)
        const { data: giftCards, error } = await supabase
          .from('gift_cards')
          .select('*')
          .eq('status', 'active')
          .not('pdf_url', 'is', null)
          .not('stripe_payment_intent_id', 'is', null)
          .gte('created_at', '2026-01-01');

        if (error) throw error;

        if (!giftCards || giftCards.length === 0) {
          resultsDiv.innerHTML = `
            <div class="bg-green-50 border-2 border-green-200 rounded-lg p-6">
              <p class="text-green-800 font-semibold">✅ No gift cards found that need email resend</p>
            </div>
          `;
          return;
        }

        resultsDiv.innerHTML = `
          <div class="bg-blue-50 border-2 border-blue-200 rounded-lg p-6">
            <p class="text-blue-900 font-semibold">📧 Found ${giftCards.length} gift card(s) to process</p>
          </div>
        `;

        // Process each gift card
        for (const card of giftCards) {
          await resendEmail(card);
        }

      } catch (error) {
        console.error('Error:', error);
        resultsDiv.innerHTML = `
          <div class="bg-red-50 border-2 border-red-200 rounded-lg p-6">
            <p class="text-red-800 font-semibold">❌ Error: ${error.message}</p>
          </div>
        `;
      }
    };

    window.resendEmail = async function(card) {
      const resultsDiv = document.getElementById('results');

      const cardDiv = document.createElement('div');
      cardDiv.className = 'bg-white rounded-lg shadow p-6';
      cardDiv.id = `card-${card.id}`;
      cardDiv.innerHTML = `
        <div class="flex items-start justify-between mb-4">
          <div>
            <h3 class="font-bold text-lg">${card.code}</h3>
            <p class="text-sm text-gray-600">€${card.original_amount} - ${card.recipient_email}</p>
            <p class="text-xs text-gray-500">Recipient: ${card.recipient_name || 'N/A'}</p>
          </div>
          <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div>
        </div>
        <div class="space-y-2 text-sm">
          <p id="status-${card.id}" class="text-gray-600">Sending email...</p>
        </div>
      `;
      resultsDiv.appendChild(cardDiv);

      const updateStatus = (message, isError = false) => {
        const statusEl = document.getElementById(`status-${card.id}`);
        if (statusEl) {
          statusEl.innerHTML += `<br>${isError ? '❌' : '✓'} ${message}`;
          if (isError) statusEl.className = 'text-red-600';
        }
      };

      try {
        // Send email via edge function
        updateStatus('Calling send-gift-card-email function...');

        const emailResponse = await fetch(
          `${supabaseUrl}/functions/v1/send-gift-card-email`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${supabaseKey}`,
            },
            body: JSON.stringify({ giftCardId: card.id }),
          }
        );

        if (!emailResponse.ok) {
          const error = await emailResponse.json();
          throw new Error(error.error || 'Failed to send email');
        }

        const result = await emailResponse.json();
        updateStatus(`Email sent successfully to ${card.recipient_email}`);

        if (card.purchaser_email && card.purchaser_email !== card.recipient_email) {
          updateStatus(`Confirmation sent to buyer: ${card.purchaser_email}`);
        }

        // Update card display
        const spinner = cardDiv.querySelector('.animate-spin');
        if (spinner) {
          spinner.className = 'rounded-full h-6 w-6 bg-green-100 flex items-center justify-center text-green-600 text-xl';
          spinner.textContent = '✓';
        }

      } catch (error) {
        console.error('Error sending email:', error);
        updateStatus(`Error: ${error.message}`, true);

        const spinner = cardDiv.querySelector('.animate-spin');
        if (spinner) {
          spinner.className = 'rounded-full h-6 w-6 bg-red-100 flex items-center justify-center text-red-600 text-xl';
          spinner.textContent = '✗';
        }
      }
    };
  </script>
</body>
</html>
