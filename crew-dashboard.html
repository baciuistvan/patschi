<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patschi Crew Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    .loading { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    // Supabase configuration
    const SUPABASE_URL = 'https://qwwerwkekvmaswusvgxy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3d2Vyd2tla3ZtYXN3dXN2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NzkxOTYsImV4cCI6MjA3OTU1NTE5Nn0.LkNZz4Tl0y8DzI4P3dvZn2-5a4FIjE72kYHbhK5_YvE';

    //  State management
    let state = {
      user: null,
      view: 'login',
      loading: false,
      error: null
    };

    // Check for saved session
    const savedUser = localStorage.getItem('crew_user');
    const savedToken = localStorage.getItem('crew_token');
    if (savedUser && savedToken) {
      try {
        state.user = JSON.parse(savedUser);
        state.view = 'dashboard';
      } catch (e) {
        localStorage.removeItem('crew_user');
        localStorage.removeItem('crew_token');
      }
    }

    // Crew login function
    async function crewLogin(username, password) {
      state.loading = true;
      state.error = null;
      render();

      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/crew-login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Anmeldung fehlgeschlagen');
        }

        if (data.success) {
          state.user = data.user;
          state.view = 'dashboard';
          localStorage.setItem('crew_user', JSON.stringify(data.user));
          localStorage.setItem('crew_token', data.token);
        }
      } catch (err) {
        state.error = err.message;
      } finally {
        state.loading = false;
        render();
      }
    }

    // Logout function
    function logout() {
      state.user = null;
      state.view = 'login';
      localStorage.removeItem('crew_user');
      localStorage.removeItem('crew_token');
      render();
    }

    // Render login view
    function renderLogin() {
      return `
        <div class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
            <div class="text-center mb-8">
              <div class="w-16 h-16 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4">
                <span class="text-white font-bold text-2xl">P</span>
              </div>
              <h1 class="text-3xl font-bold text-gray-900 mb-2">Crew Dashboard</h1>
              <p class="text-gray-600">Anmelden um fortzufahren</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-6">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Benutzername</label>
                <input
                  type="text"
                  id="username"
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  placeholder="Benutzername eingeben"
                  required
                  autofocus
                />
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Passwort</label>
                <input
                  type="password"
                  id="password"
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  placeholder="Passwort eingeben"
                  required
                />
              </div>

              ${state.error ? `
                <div class="p-4 bg-red-50 border border-red-200 rounded-lg">
                  <p class="text-sm text-red-700">${state.error}</p>
                </div>
              ` : ''}

              <button
                type="submit"
                ${state.loading ? 'disabled' : ''}
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
              >
                ${state.loading ? 'Wird angemeldet...' : 'Anmelden'}
              </button>
            </form>

            <div class="mt-6 p-4 bg-blue-50 rounded-lg">
              <p class="text-sm text-blue-900 font-medium mb-1">Standard-Zugangsdaten:</p>
              <p class="text-sm text-blue-700">Benutzername: Crew</p>
              <p class="text-sm text-blue-700">Passwort: crew123</p>
            </div>
          </div>
        </div>
      `;
    }

    // Render dashboard view
    function renderDashboard() {
      return `
        <div class="min-h-screen bg-slate-50">
          <nav class="bg-white border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-4">
                  <div class="w-10 h-10 bg-slate-900 rounded-lg flex items-center justify-center">
                    <span class="text-white font-bold">P</span>
                  </div>
                  <div>
                    <h1 class="text-lg font-bold text-slate-900">Patschi Restaurant</h1>
                    <p class="text-xs text-slate-600">Crew Dashboard</p>
                  </div>
                </div>

                <div class="flex items-center space-x-4">
                  <div class="text-right">
                    <p class="text-sm font-medium text-slate-900">${state.user.name}</p>
                    <p class="text-xs text-slate-600">Crew Member</p>
                  </div>
                  <button
                    onclick="handleLogout()"
                    class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition text-sm font-medium"
                  >
                    Abmelden
                  </button>
                </div>
              </div>
            </div>
          </nav>

          <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center mb-4">
                  <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                  </svg>
                </div>
                <h3 class="text-lg font-semibold text-slate-900 mb-2">Reservierungen</h3>
                <p class="text-sm text-slate-600">Alle Reservierungen ansehen und verwalten</p>
              </div>

              <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center mb-4">
                  <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                  </svg>
                </div>
                <h3 class="text-lg font-semibold text-slate-900 mb-2">Gutscheine</h3>
                <p class="text-sm text-slate-600">Gutscheine prüfen und einlösen</p>
              </div>

              <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center mb-4">
                  <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"></path>
                  </svg>
                </div>
                <h3 class="text-lg font-semibold text-slate-900 mb-2">Tischplan</h3>
                <p class="text-sm text-slate-600">Tischbelegung ansehen und aktualisieren</p>
              </div>
            </div>

            <div class="mt-8 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
              <h2 class="text-xl font-bold text-slate-900 mb-4">Willkommen, ${state.user.name}!</h2>
              <p class="text-slate-600">
                Du bist als Crew-Mitglied angemeldet. Verwende das Dashboard, um Reservierungen zu verwalten,
                Gutscheine zu prüfen und den Tischplan zu aktualisieren.
              </p>
            </div>
          </main>
        </div>
      `;
    }

    // Main render function
    function render() {
      const app = document.getElementById('app');
      if (state.view === 'login') {
        app.innerHTML = renderLogin();
      } else {
        app.innerHTML = renderDashboard();
      }
    }

    // Event handlers
    window.handleLogin = function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      crewLogin(username, password);
    };

    window.handleLogout = function() {
      logout();
    };

    // Initial render
    render();
  </script>
</body>
</html>
